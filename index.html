    {q:"Running K-Means with n_init=10 means:",opts:["Training for 10 epochs per run","Running 10 independent random initializations, keeping the best result","Using 10 different values of K","Setting the maximum iterations per run to 10"],ans:1,exp:"n_init controls how many independent runs with different random initializations are attempted. Keeping the lowest-inertia result significantly improves clustering quality."}
  ]
}},
{id:'naive-bayes',label:'Naive Bayes',color:'#3B6B1A',content:{
  definition:"A probabilistic classifier based on Bayes' theorem that assumes all features are conditionally independent given the class — an assumption that's almost always wrong yet produces surprisingly strong results.",
  explanation:[
    {heading:"Bayes' Theorem — The Foundation",body:`Naive Bayes is built entirely on Bayes' theorem:\n$$P(A \\mid B) = \\frac{P(B \\mid A)\\cdot P(A)}{P(B)}$$\n\nIn classification, $A$ = class label, $B$ = observed features:\n$$P(\\text{class}\\mid\\mathbf{x}) = \\frac{P(\\mathbf{x}\\mid\\text{class})\\cdot P(\\text{class})}{P(\\mathbf{x})}$$\n\nIn words: **Posterior** $\\propto$ **Likelihood** $\\times$ **Prior**\n\n$P(\\mathbf{x})$ is the same for all classes so we ignore it:\n$$\\hat{y} = \\arg\\max_k\\; P(\\mathbf{x}\\mid\\text{class}=k)\\cdot P(\\text{class}=k)$$\nThis is the Maximum A Posteriori (MAP) estimate.`},
    {heading:"The Naive Assumption — Independence",body:`Computing $P(x_1,x_2,\\ldots,x_n\\mid\\text{class})$ in full is intractable. Naive Bayes assumes:\n$$P(x_1,\\ldots,x_n\\mid\\text{class}) = \\prod_{i=1}^{n} P(x_i\\mid\\text{class})$$\n\nAll features are conditionally independent given the class. Now we only need $n$ separate 1D distributions.\n\nWHY IT'S NAIVE: this assumption is almost never true.\nWHY IT WORKS ANYWAY: even though the joint probability is wrong, the ranking of classes is often correct. If $P(\\text{spam}\\mid\\mathbf{x}) > P(\\text{ham}\\mid\\mathbf{x})$ consistently, the decision is right even if absolute probabilities are off.`},
    {heading:"Three Variants and Laplace Smoothing",body:`GAUSSIAN NB (continuous features):\n$$P(x_i\\mid k) = \\frac{1}{\\sqrt{2\\pi\\sigma_{ki}^2}}\\exp\\!\\left(-\\frac{(x_i-\\mu_{ki})^2}{2\\sigma_{ki}^2}\\right)$$\n\nMULTINOMIAL NB (count data — word frequencies):\n  With Laplace smoothing ($\\alpha$):\n$$P(w\\mid k) = \\frac{\\text{count}(w,k)+\\alpha}{\\text{total}_k+\\alpha\\cdot V}$$\n\nBERNOULLI NB (binary features — word present/absent):\n$$P(x_i\\mid k) = p_{ki}^{x_i}\\cdot(1-p_{ki})^{1-x_i}$$\n\nLAPLACE SMOOTHING prevents zero probabilities for unseen features. Without it, one unseen word gives $P(w\\mid k)=0$, zeroing out the entire class probability.`}
  ],
  keyPoints:[
    {title:"Bayes' Theorem",body:"$$P(\\text{class}\\mid\\mathbf{x}) \\propto P(\\mathbf{x}\\mid\\text{class})\\cdot P(\\text{class})$$\nPosterior $\\propto$ Likelihood $\\times$ Prior.\nPick class with highest posterior (MAP estimate)."},
    {title:"The Naive Assumption",body:"$$P(\\mathbf{x}\\mid c) = \\prod_i P(x_i\\mid c)$$\nAll features independent given class.\nAlmost never true — but classification is often still accurate."},
    {title:"Three Variants",body:"Gaussian: continuous features, normal distribution per class.\nMultinomial: count features (word frequencies in text).\nBernoulli: binary features (word present/absent)."},
    {title:"Laplace Smoothing",body:"$$P(x_i\\mid k) = \\frac{\\text{count}(x_i,k)+\\alpha}{\\text{total}_k+\\alpha V}$$\nPrevents zero probabilities for unseen features."},
    {title:"Where It Excels",body:"Text classification: high-dim, sparse, many features.\nSmall training sets: very data-efficient.\nReal-time systems: training and prediction are very fast."},
    {title:"Limitations",body:"Poor calibrated probabilities — often overconfident.\nAssumes feature independence — breaks with correlated features.\nStronger alternatives exist with abundant data."}
  ],
  watchOut:"Never trust Naive Bayes output probabilities as calibrated confidence estimates. The independence assumption means the probabilities are often extreme (very close to 0 or 1). For well-calibrated probabilities, use logistic regression or apply Platt scaling post-hoc. NB's strength is in its rankings, not its probability values.",
  questions:[
    {q:"Why can we ignore P(features) when choosing the predicted class?",opts:["P(features) is always 1","P(features) is the same for all classes — it doesn't affect which has the highest posterior","P(features) is computed automatically","P(features) cancels because we normalize at the end"],ans:1,exp:"P(features) is a constant denominator for all classes. Since we compare P(class|features) across classes and P(features) is the same for all, we can drop it."},
    {q:"What is the 'naive' in Naive Bayes?",opts:["The algorithm is simpler than Bayesian Networks","It assumes all features are conditionally independent given the class","It doesn't use Laplace smoothing by default","It ignores the prior probability of each class"],ans:1,exp:"Naive Bayes assumes P(x1,...,xn|class) = P(x1|class) × ... × P(xn|class). This 'naive' independence assumption is almost never true, yet the algorithm performs surprisingly well."},
    {q:"Without smoothing, an unseen word causes what?",opts:["The word gets probability 0.5","Prediction defaults to the prior","P(word|class)=0 for all classes, making all class probabilities zero — prediction fails","The word is ignored and removed from the feature vector"],ans:2,exp:"Without smoothing, an unseen word has count=0, giving P(word|class)=0. The product P(features|class) includes this zero, zeroing out the entire class probability."},
    {q:"Which Naive Bayes variant is best for classifying emails using word counts?",opts:["Gaussian NB","Bernoulli NB","Multinomial NB","Logistic NB"],ans:2,exp:"Multinomial NB models P(word|class) as a categorical distribution over word counts — exactly what bag-of-words text features represent."},
    {q:"Naive Bayes is especially strong when:",opts:["Training data is abundant and features are correlated","You need perfectly calibrated output probabilities","Data is sparse and high-dimensional (like text) and training examples are few","The decision boundary between classes is linear"],ans:2,exp:"NB's independence assumption handles sparse high-dimensional data efficiently. It's data-efficient (works with few examples) and fast."},
    {q:"What does the prior P(class) represent?",opts:["The model's confidence in a specific prediction","The probability of observing a particular set of features","The base rate of each class in the training data","The likelihood of the features given the class"],ans:2,exp:"P(class=k) is the prior — the base rate of class k before observing any features. Estimated from class frequencies in training data."},
    {q:"Why does Naive Bayes produce poorly calibrated probabilities?",opts:["It doesn't apply the sigmoid function to outputs","Multiplying many small probabilities amplifies deviations — the independence assumption creates overconfident posteriors","Laplace smoothing artificially inflates confidence","It uses MAP rather than full Bayesian posterior"],ans:1,exp:"The product P(x1|c) × P(x2|c) × ... multiplies many probabilities. With the independence assumption, this product becomes extremely small or large relative to other classes, pushing posteriors to near 0 or 1."},
    {q:"Laplace smoothing with α=1 adds what?",opts:["1 to both numerator and denominator total","1 to the count and V (vocabulary size) to the denominator","1 to all probabilities and normalizes","The class prior divided by the number of features"],ans:1,exp:"P(xi|k) = (count(xi,k) + 1) / (total_k + V). Adding 1 ensures no zero counts. Adding V maintains a valid probability distribution."}
  ]
}},
{id:'svm',label:'Support Vector Machines',color:'#1A3D5C',content:{
  definition:"A classifier that finds the maximum-margin hyperplane separating two classes — and uses the kernel trick to handle non-linear boundaries by implicitly mapping data to higher-dimensional spaces.",
  explanation:[
    {heading:"Maximum Margin and Support Vectors",body:`The decision boundary is a hyperplane: $\\mathbf{w}\\cdot\\mathbf{x}+b=0$\n\nThe margin boundaries (gutters) are:\n$$\\mathbf{w}\\cdot\\mathbf{x}+b = +1 \\quad\\text{(nearest positive points)}$$\n$$\\mathbf{w}\\cdot\\mathbf{x}+b = -1 \\quad\\text{(nearest negative points)}$$\n\nThe margin width is $\\dfrac{2}{\\|\\mathbf{w}\\|}$. Maximising the margin means minimising $\\|\\mathbf{w}\\|$, subject to correct classification. This is a convex quadratic problem — always finds the global optimum.\n\nSUPPORT VECTORS: only the training points on the margin boundaries define the decision boundary. All other training points could be removed without changing the model.`},
    {heading:"Soft Margin and the C Parameter",body:`HARD MARGIN: requires all points correctly classified. Fails if data isn't linearly separable.\n\nSOFT MARGIN: allows violations, each costing a slack penalty $\\xi_i$:\n$$\\min_{\\mathbf{w},b,\\boldsymbol{\\xi}}\\; \\frac{1}{2}\\|\\mathbf{w}\\|^2 + C\\sum_i \\xi_i$$\n\n$C$ IS THE KEY HYPERPARAMETER:\n- Large $C$: violations expensive → narrow margin → overfitting risk.\n- Small $C$: violations tolerable → wide margin → more regularization.\n\nAlways tune $C$ via cross-validation. Typical range: $C \\in [10^{-3}, 10^3]$ on a log scale.`},
    {heading:"The Kernel Trick",body:`SVM's math only requires dot products: $K(\\mathbf{x}_i,\\mathbf{x}_j) = \\phi(\\mathbf{x}_i)\\cdot\\phi(\\mathbf{x}_j)$\n\nKernel functions compute this in a transformed space without materialising the features:\n$$\\text{Linear:}\\quad K(\\mathbf{a},\\mathbf{b}) = \\mathbf{a}\\cdot\\mathbf{b}$$\n$$\\text{Polynomial:}\\quad K(\\mathbf{a},\\mathbf{b}) = (\\mathbf{a}\\cdot\\mathbf{b}+c)^d$$\n$$\\text{RBF (Gaussian):}\\quad K(\\mathbf{a},\\mathbf{b}) = \\exp\\!\\left(-\\gamma\\|\\mathbf{a}-\\mathbf{b}\\|^2\\right)$$\n\nThe RBF kernel maps data to infinite dimensions — yet computing $K(\\mathbf{a},\\mathbf{b})$ is $\\mathcal{O}(d)$.\n\nRBF PARAMETER $\\gamma$:\n  Large $\\gamma$: tight local boundaries → overfitting.\n  Small $\\gamma$: smooth global boundaries → underfitting.\nTune BOTH $C$ and $\\gamma$ via grid search.`}
  ],
  keyPoints:[
    {title:"Maximum Margin",body:"Margin width $= 2/\\|\\mathbf{w}\\|$.\nMaximise margin = minimise $\\|\\mathbf{w}\\|$.\nConvex optimization → always the global optimum."},
    {title:"Support Vectors",body:"Only points on the margin boundaries define the decision boundary.\nAll other training points could be removed without changing the model."},
    {title:"C Parameter (Soft Margin)",body:"Large $C$: narrow margin → overfitting risk.\nSmall $C$: wide margin → more regularization.\nTune via cross-validation. Range: $[10^{-3}, 10^3]$."},
    {title:"Kernel Trick",body:"$$K(\\mathbf{a},\\mathbf{b}) = \\phi(\\mathbf{a})\\cdot\\phi(\\mathbf{b})$$\ncomputed without materialising $\\phi$.\nRBF: $\\exp(-\\gamma\\|\\mathbf{a}-\\mathbf{b}\\|^2)$ — infinite dimensions in $\\mathcal{O}(d)$."},
    {title:"γ Parameter (RBF Kernel)",body:"Large $\\gamma$: complex local boundaries → overfitting.\nSmall $\\gamma$: smooth global boundaries → underfitting.\nTune jointly with $C$ via grid search."},
    {title:"When SVM Wins",body:"High-dimensional data (text, genomics, images).\nSmall datasets where $n \\ll 10^6$.\nClear class separation.\nConvex problem → guaranteed global optimum."}
  ],
  watchOut:"Always scale features before SVM — it's even more critical here than for KNN. SVMs are computationally expensive: training scales as O(n²) to O(n³). For large datasets (>100k samples), consider LinearSVC or switch to gradient boosting, which typically outperforms SVM on tabular data anyway.",
  questions:[
    {q:"What principle does SVM use to choose its decision boundary?",opts:["Minimising total misclassifications on training data","Maximising probability of correct classification using a sigmoid","Maximising the margin — the gap between the boundary and the closest points of each class","Minimising cross-entropy loss over the training distribution"],ans:2,exp:"SVM finds the hyperplane that maximises the margin. Maximum margin implies maximum robustness to small perturbations in the data."},
    {q:"What are support vectors?",opts:["All training points used to compute the decision boundary","Only the training points that lie on or within the margin boundaries","The weight vectors defining the hyperplane","Points on the wrong side of the decision boundary"],ans:1,exp:"Support vectors are the training points closest to the decision boundary — lying exactly on the margin hyperplanes (w·x + b = ±1). Only these points define the boundary."},
    {q:"Setting C to a very large value:",opts:["Widens the margin to allow more correct classifications","Creates a narrower margin, risking overfitting","Applies stronger regularization, simplifying the boundary","Has no effect — C only affects training speed"],ans:1,exp:"Large C makes margin violations very expensive. The optimizer tries hard to classify all points correctly, resulting in a narrow margin — overfitting risk increases."},
    {q:"What is the kernel trick?",opts:["A method to reduce the number of support vectors","Computing dot products in a high-dimensional transformed space without explicitly constructing it","A technique to speed up SVM training","Using polynomial features to increase dimensions before training"],ans:1,exp:"SVM's math only needs K(xi,xj) = φ(xi)·φ(xj). Kernel functions compute this directly without materializing the high-dimensional feature vectors."},
    {q:"The RBF kernel parameter γ controls:",opts:["The regularization strength — equivalent to 1/C","How many support vectors are created","The influence radius of each training point: large γ = local, small γ = smooth global boundaries","The degree of the polynomial mapping"],ans:2,exp:"Large γ: each point influences only nearby predictions → complex boundaries → overfitting. Small γ: points influence a wide area → smooth boundaries → underfitting."},
    {q:"When is SVM a poor choice vs gradient boosting on tabular data?",opts:["When d > n (more features than samples)","When you need a guaranteed global optimum","When the dataset has millions of samples (O(n²–n³) training)","When the problem is text classification with sparse features"],ans:2,exp:"SVM training is O(n²) to O(n³). For millions of samples this is impractically slow. Gradient boosting trains in O(n log n) and typically matches or outperforms SVM on large tabular datasets."},
    {q:"Unlike logistic regression, SVM does NOT naturally output:",opts:["A predicted class label","Calibrated probability estimates for each class","A decision boundary in feature space","Feature coefficients (weights)"],ans:1,exp:"SVMs output the class label and a margin-based score, but not calibrated probabilities. To get probabilities, you need Platt scaling — fitting logistic regression on SVM outputs."},
    {q:"Why is feature scaling especially critical for SVM?",opts:["SVM requires normally distributed features","The margin computation and kernel evaluations are distance/dot-product based — features on different scales distort the geometry","SVM's kernel trick only works when all features are in [0,1]","Scaling reduces the number of support vectors"],ans:1,exp:"SVM geometry is entirely based on distances and dot products. Features with large ranges dominate the margin computation."}
  ]
}},
{id:'ensemble',label:'Ensemble Methods',color:'#5C1A1A',content:{
  definition:"Techniques that combine multiple models to produce predictions stronger than any single model — by canceling individual errors through diversity, sequential correction, or learned combination.",
  explanation:[
    {heading:"Bagging — Variance Reduction",body:`BAGGING (Bootstrap AGGregating):\n  1. Create $B$ bootstrap samples (sampling with replacement).\n  2. Train a separate model on each sample.\n  3. Average (regression) or majority vote (classification).\n\nVARIANCE REDUCTION:\n  If $B$ models each have variance $\\sigma^2$ and their errors are uncorrelated:\n$$\\text{Var}\\!\\left(\\frac{1}{B}\\sum_{b=1}^B f_b\\right) \\approx \\frac{\\sigma^2}{B}$$\nAveraging $B$ models reduces variance $B$-fold. Works best with high-variance models (deep trees).`},
    {heading:"Gradient Boosting — Sequential Error Correction",body:`Boosting trains models sequentially, each correcting the errors of the previous ones.\n\nGRADIENT BOOSTING:\n  Initialise: $F_0(\\mathbf{x}) = \\bar{y}$\n  For $m = 1, 2, \\ldots, M$:\n    Compute residuals: $r_i = y_i - F_{m-1}(\\mathbf{x}_i)$\n    Fit a new tree $h_m$ to the residuals.\n    Update: $F_m(\\mathbf{x}) = F_{m-1}(\\mathbf{x}) + \\eta \\cdot h_m(\\mathbf{x})$\n\n$\\eta$ = learning rate. Small $\\eta$ requires more trees but often achieves better generalization.\n\nADABOOST: after each round, increase the weight of misclassified samples. The next model focuses on hard cases. Sensitive to noisy data and outliers.`},
    {heading:"XGBoost, LightGBM, and Stacking",body:`XGBOOST:\n  Adds $L_1/L_2$ regularization to each tree. Uses second-order gradient information (Newton's method) for faster, more accurate optimization. Handles missing values natively.\n\nLIGHTGBM:\n  Histogram-based splitting: bins continuous features into $B$ discrete buckets.\n  Instead of $\\mathcal{O}(n)$ split evaluations: $\\mathcal{O}(B)$.\n  Leaf-wise (best-first) tree growth — deeper, more asymmetric trees.\n  Dramatically faster on large datasets.\n\nSTACKING:\n  LEVEL 0 — Base learners: train diverse algorithms (LR, RF, XGBoost, KNN, SVM).\n  LEVEL 1 — Meta-learner: trains on out-of-fold predictions from base learners.\n\n  Out-of-fold predictions prevent leakage — each training point is predicted by models that never saw it.`}
  ],
  keyPoints:[
    {title:"Why Ensembles Work",body:"Diverse models make different errors — combining them lets errors cancel.\nTwo requirements: individual accuracy + model diversity."},
    {title:"Bagging",body:"Bootstrap samples → parallel models → vote/average.\n$$\\text{Var}(\\bar{f}) \\approx \\sigma^2/B$$\nRandom Forest = bagging + random feature subsets."},
    {title:"Gradient Boosting",body:"$$F_m(\\mathbf{x}) = F_{m-1}(\\mathbf{x}) + \\eta\\cdot h_m(\\mathbf{x})$$\nEach tree fits residuals of the ensemble.\nSmall $\\eta$ + more trees often beats large $\\eta$."},
    {title:"XGBoost / LightGBM",body:"XGBoost: regularized, second-order, handles missing values.\nLightGBM: histogram splits $\\mathcal{O}(B)$, leaf-wise growth — faster.\nState-of-the-art for tabular ML."},
    {title:"Stacking",body:"Base learners → out-of-fold predictions → meta-learner.\nMeta-learner learns to combine base predictions.\nRequires out-of-fold scheme to prevent data leakage."},
    {title:"Practical Hierarchy",body:"1. Random Forest — fast, robust baseline\n2. XGBoost/LightGBM — best tabular performance\n3. Stacking — maximum performance, maximum complexity\nNeural nets dominate images, text, audio — not tables."}
  ],
  watchOut:"More models doesn't always mean better performance. Ensemble diversity is essential — stacking five gradient boosters gives less benefit than combining a gradient booster, a random forest, and a linear model. Also: boosting is sensitive to noisy labels and outliers.",
  questions:[
    {q:"What two properties must base learners have for an ensemble to improve over a single model?",opts:["High precision and high recall","Each model must be better than random, and models must be diverse (make different errors)","All models must use the same algorithm and hyperparameters","Models must be trained on the exact same data"],ans:1,exp:"Two requirements: (1) accuracy — each model must be better than random guessing. (2) diversity — models must make different errors. Identical models averaging together is just one model."},
    {q:"How does Gradient Boosting differ from Bagging?",opts:["Gradient Boosting trains models in parallel on random subsets; Bagging trains them sequentially","Gradient Boosting trains models sequentially, each correcting the errors of the ensemble so far; Bagging trains in parallel on different bootstrap samples","Gradient Boosting requires linear base learners; Bagging requires trees","Bagging uses gradient descent; Gradient Boosting uses random sampling"],ans:1,exp:"Bagging: parallel training on bootstrap samples, errors averaged. Gradient Boosting: sequential training where each new tree fits the residuals of the current ensemble."},
    {q:"What does the learning rate η control in Gradient Boosting?",opts:["The depth of each decision tree","How much each new tree's contribution is shrunk before adding it to the ensemble","The number of bootstrap samples per tree","The proportion of features considered at each split"],ans:1,exp:"Each tree's predictions are multiplied by η: F_m(x) = F_{m-1}(x) + η × h_m(x). Small η makes each tree contribute less — requiring more trees but often better generalization."},
    {q:"What is the main advantage of LightGBM over standard Gradient Boosting?",opts:["It uses second-order gradient information","Histogram-based binning and leaf-wise growth make it dramatically faster on large datasets","It applies L1/L2 regularization","It handles categorical features automatically"],ans:1,exp:"LightGBM bins continuous features into histograms, reducing split evaluation from O(n) to O(B). Combined with leaf-wise growth, it's dramatically faster on large datasets."},
    {q:"In a stacking ensemble, what does the meta-learner train on?",opts:["The original training features directly","Out-of-fold predictions from base learners — generated on data each base learner never saw","The test set predictions from all base learners","A random subsample of the training set"],ans:1,exp:"The meta-learner trains on out-of-fold predictions to prevent data leakage. If base learners and meta-learner train on the same data, the meta-learner learns to trust whichever base learner overfits most."},
    {q:"AdaBoost is sensitive to noisy data because:",opts:["It trains on bootstrap samples, amplifying noise","Misclassified samples get increased weight — noisy/mislabeled points become increasingly dominant","It uses very deep trees that memorize noise","It applies no regularization to individual learners"],ans:1,exp:"AdaBoost increases the weight of misclassified samples each round. Mislabeled or outlier points accumulate high weights, forcing subsequent learners to overfit to noise."},
    {q:"Why is stacking rarely used in production despite winning competitions?",opts:["Stacking always overfits on real-world data","It requires labeled test data not available in production","Stacking adds significant complexity, maintenance burden, and fragility without always justifying the marginal gain","Stacking is protected by patents"],ans:2,exp:"Stacking requires careful out-of-fold schemes to prevent leakage. In production: more models to maintain, more failure points, harder to debug, and the gains over a well-tuned XGBoost are often marginal."},
    {q:"In which order should you try ensemble methods when building a tabular ML model?",opts:["Stacking → XGBoost → Random Forest (most complex first)","Random Forest → XGBoost/LightGBM → Stacking (ascending complexity and tuning effort)","All three simultaneously, then pick the best","AdaBoost → Gradient Boosting → Stacking (historical order)"],ans:1,exp:"Start with Random Forest (fast, minimal tuning, strong baseline). If more needed: XGBoost/LightGBM. If still more needed: Stacking. Always start simple."}
  ]
}}
];

def sigmoid(z): return 1/(1+math.exp(-z))

def bce(yt, yp):
    return -sum(yt[i]*math.log(yp[i]+1e-9)+(1-yt[i])*math.log(1-yp[i]+1e-9)
                for i in range(len(yt)))/len(yt)

def train(X, y, lr=0.1, epochs=500):

        dw2 = sum((p[i]-y[i])*X[i][1] for i in range(n))/n

'overfitting':[{title:"Observe Overfitting with Polynomial Degree",desc:"Fit polynomials of increasing degree and watch train vs test error diverge.",template:`import math, random; random.seed(0)

def poly(x,d): return [x**i for i in range(d+1)]

def gpdf(x,mu,var):
    if var==0: return 1.0 if x==mu else 0.0
    return math.exp(-(x-mu)**2/(2*var))/math.sqrt(2*math.pi*var)

class GNB:
    def fit(self,X,y):
        self.cls=list(set(y)); n=len(y)
        self.prior={c:y.count(c)/n for c in self.cls}
        self.stats={}
        for c in self.cls:
            pts=[X[i] for i in range(n) if y[i]==c]; d=len(pts[0])
            mu=[sum(p[j] for p in pts)/len(pts) for j in range(d)]
            va=[sum((p[j]-mu[j])**2 for p in pts)/len(pts) for j in range(d)]
            self.stats[c]=(mu,va)

        res=[]
        for x in X:
            best,bsc=None,float('-inf')
            for c in self.cls:
                mu,va=self.stats[c]
                lp=math.log(self.prior[c])
                for j in range(len(x)): lp+=math.log(gpdf(x[j],mu[j],va[j])+1e-300)
                if lp>bsc: bsc,best=lp,c
            res.append(best)
        return res

def mean(v): return sum(v)/len(v) if v else 0

def stump(X,r):
    best=(None,0,0,float('inf'))
    for t in sorted(set(X)):
        L=[r[i] for i in range(len(X)) if X[i]<=t]
        R=[r[i] for i in range(len(X)) if X[i]>t]

        loss=sum((v-mean(L))**2 for v in L)+sum((v-mean(R))**2 for v in R)

// Shared canvas helpers
function getCanvas(id,w,h){
  const c=document.getElementById(id);
  if(!c) return null;
  const dpr=window.devicePixelRatio||1;
  const rect=c.getBoundingClientRect();
  const cw=rect.width||w;
  c.width=cw*dpr; c.height=Math.min(cw*(h/w),340)*dpr;
  const ctx=c.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.cw=cw; ctx.ch=c.height/dpr;
  return ctx;
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// LINEAR REGRESSION — Gradient Descent Bowl
// ──────────────────────────────────────────────────────────────────────────
function vizGradientDescent(containerId){
  const el=document.getElementById(containerId);
  if(!el) return;
  el.innerHTML=`
  <div class="viz-wrap">
    <div class="viz-head">
      <div class="viz-title">Gradient Descent — The Loss Landscape</div>
      <div class="viz-controls">
        <div class="viz-slider-wrap">
          <span class="viz-label">Learning rate α</span>
          <input class="viz-slider" type="range" id="gd-lr" min="1" max="10" value="3" step="1">
          <span class="viz-val" id="gd-lr-val">0.3</span>
        </div>
        <button class="viz-btn viz-btn-primary" id="gd-play">▶ Run</button>
        <button class="viz-btn" id="gd-reset">Reset</button>
      </div>
    </div>
    <canvas class="viz-canvas" id="gd-canvas" height="300" width="600"></canvas>
    <div class="viz-note">The MSE loss surface is a perfect bowl (convex). Gradient descent rolls the ball downhill to the minimum — the optimal weight. A too-large learning rate overshoots; too small is slow.</div>
  </div>`;

  let w=-3, animId=null, step=0, running=false;
  const lrSlider=document.getElementById('gd-lr');
  const lrVal=document.getElementById('gd-lr-val');
  const playBtn=document.getElementById('gd-play');
  const resetBtn=document.getElementById('gd-reset');
  const history=[];

  function getLR(){return parseFloat(lrSlider.value)*0.1;}
  lrSlider.oninput=()=>{lrVal.textContent=getLR().toFixed(1); if(!running) draw();};

  function mse(w){return 0.8*w*w + 0.1;}  // simple bowl: MSE ~ w²
  function grad(w){return 1.6*w;}

  function draw(){
    const ctx=getCanvas('gd-canvas',600,300);
    if(!ctx) return;
    const {cw,ch}=ctx;
    ctx.clearRect(0,0,cw,ch);
    const pad=40, W=cw-pad*2, H=ch-pad*2-20;

    // Bowl curve
    const pts=[];
    for(let i=0;i<=200;i++){
      const wv=-3.5+i*7/200;
      pts.push({x:pad+W*(wv+3.5)/7, y:pad+H*(1-mse(wv)/10)+20});
    }
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    pts.forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.strokeStyle='#DDD9D1'; ctx.lineWidth=2; ctx.stroke();

    // Fill under curve
    ctx.lineTo(pts[pts.length-1].x,pad+H+20);
    ctx.lineTo(pts[0].x,pad+H+20);
    ctx.closePath();
    ctx.fillStyle='rgba(221,217,209,0.15)'; ctx.fill();

    // Axes labels
    ctx.fillStyle='#8C8278'; ctx.font='11px Geist Mono,monospace';
    ctx.fillText('Weight w',cw/2-20,ch-4);
    ctx.save(); ctx.translate(12,ch/2); ctx.rotate(-Math.PI/2);
    ctx.fillText('Loss (MSE)',0,0); ctx.restore();

    // Optimal
    const ox=pad+W*3.5/7, oy=pad+H*0.9+20;
    ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(ox,pad+20);ctx.lineTo(ox,oy);
    ctx.strokeStyle='#3A7D55'; ctx.lineWidth=1; ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#3A7D55'; ctx.font='10px Geist Mono,monospace';
    ctx.fillText('w*=0',ox+4,pad+32);

    // Path history
    if(history.length>1){
      ctx.beginPath();
      history.forEach((hw,i)=>{
        const hx=pad+W*(hw+3.5)/7;
        const hy=pad+H*(1-mse(hw)/10)+20;
        i===0?ctx.moveTo(hx,hy):ctx.lineTo(hx,hy);
      });
      ctx.strokeStyle='rgba(45,85,68,0.4)'; ctx.lineWidth=1.5; ctx.stroke();
    }

    // Current ball
    const bx=pad+W*(w+3.5)/7;
    const by=pad+H*(1-mse(w)/10)+20;
    ctx.beginPath(); ctx.arc(bx,by,7,0,Math.PI*2);
    ctx.fillStyle='#1A1714'; ctx.fill();

    // Gradient arrow
    const g=grad(w)*0.5;
    const ax=bx-g*18, ay=by;
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(ax,ay);
    ctx.strokeStyle='#B85C38'; ctx.lineWidth=2; ctx.stroke();
    // arrowhead
    const ang=Math.atan2(0,ax-bx);
    ctx.beginPath();
    ctx.moveTo(ax,ay);
    ctx.lineTo(ax+6*Math.cos(ang-0.4),ay+6*Math.sin(ang-0.4));
    ctx.lineTo(ax+6*Math.cos(ang+0.4),ay+6*Math.sin(ang+0.4));
    ctx.closePath(); ctx.fillStyle='#B85C38'; ctx.fill();

    // Loss label
    ctx.fillStyle='#1A1714'; ctx.font='11px Geist Mono,monospace';
    ctx.fillText(`w=${w.toFixed(2)}  Loss=${mse(w).toFixed(3)}`,pad,pad+12);
  }

  function animate(){
    if(Math.abs(w)<0.005 || step>80){
      running=false; playBtn.textContent='▶ Run'; return;
    }
    const lr=getLR();
    w=w-lr*grad(w);
    w=clamp(w,-3.5,3.5);
    history.push(w);
    step++;
    draw();
    animId=requestAnimationFrame(animate);
  }

  playBtn.onclick=()=>{
    if(running){cancelAnimationFrame(animId);running=false;playBtn.textContent='▶ Run';return;}
    running=true; playBtn.textContent='⏸ Pause';
    animId=requestAnimationFrame(animate);
  };
  resetBtn.onclick=()=>{
    cancelAnimationFrame(animId); running=false; playBtn.textContent='▶ Run';
    w=-3; step=0; history.length=0; history.push(w); draw();
  };
  history.push(w);
  draw();
  window.addEventListener('resize',draw);
}

function vizDecisionBoundary(containerId){
  const el=document.getElementById(containerId);
  if(!el) return;
  el.innerHTML=`

    <div class="viz-head">

        <div class="viz-slider-wrap">

        </div>
      </div>
    </div>
    <canvas class="viz-canvas" id="db-canvas" height="320" width="600"></canvas>
    <div class="viz-note">The shaded line is the decision boundary — where P(y=1)=threshold. Slide the threshold to see precision vs recall tradeoff: lower threshold catches more positives (higher recall) at the cost of more false positives.</div>
  </div>`;

  const slider=document.getElementById('db-thresh');
  const tVal=document.getElementById('db-thresh-val');

  const pts=[
    {x:1.2,y:1.0,c:0},{x:1.8,y:2.0,c:0},{x:2.2,y:1.3,c:0},{x:1.5,y:3.0,c:0},
    {x:2.8,y:0.8,c:0},{x:0.8,y:2.2,c:0},{x:3.2,y:2.5,c:0},{x:2.0,y:3.5,c:0},
    {x:4.5,y:4.0,c:1},{x:5.0,y:3.5,c:1},{x:4.8,y:5.0,c:1},{x:5.5,y:4.5,c:1},
    {x:6.0,y:3.8,c:1},{x:4.2,y:5.5,c:1},{x:5.8,y:5.2,c:1},{x:3.8,y:4.8,c:1},
    {x:3.5,y:3.8,c:1},{x:4.0,y:3.0,c:0}
  ];
  // Logistic model: w1=0.9, w2=0.85, b=-6.2
  function prob(x,y){return 1/(1+Math.exp(-(0.9*x+0.85*y-6.2)));}

  function draw(){
    const ctx=getCanvas('db-canvas',600,320);
    if(!ctx) return;
    const {cw,ch}=ctx;
    ctx.clearRect(0,0,cw,ch);
    const pad=36;
    const W=cw-pad*2, H=ch-pad*2;
    const xmin=0,xmax=7,ymin=0,ymax=7;
    const thresh=parseFloat(slider.value)/100;
    tVal.textContent=thresh.toFixed(2);

    function px(xv){return pad+W*(xv-xmin)/(xmax-xmin);}
    function py(yv){return pad+H*(1-(yv-ymin)/(ymax-ymin));}

    // Background probability heatmap
    const res=24;
    const cw2=W/res, ch2=H/res;
    for(let i=0;i<res;i++){
      for(let j=0;j<res;j++){
        const xv=xmin+i*(xmax-xmin)/res;
        const yv=ymin+j*(ymax-ymin)/res;
        const p=prob(xv,yv);
        const alpha=0.12+Math.abs(p-0.5)*0.22;
        ctx.fillStyle=p>thresh?`rgba(45,85,68,${alpha})`:`rgba(155,58,34,${alpha})`;
        ctx.fillRect(pad+i*cw2, pad+(res-1-j)*ch2, cw2+1, ch2+1);
      }
    }

    // Decision boundary line
    ctx.beginPath();
    let first=true;
    for(let i=0;i<=200;i++){
      const xv=xmin+i*(xmax-xmin)/200;
      // solve: w1*xv + w2*yv + b = logit(thresh)
      const logit=Math.log(thresh/(1-thresh));
      const yv=(logit-0.9*xv+6.2)/0.85;
      if(yv<ymin||yv>ymax){first=true;continue;}
      const bx=px(xv), by=py(yv);
      first?ctx.moveTo(bx,by):ctx.lineTo(bx,by);
      first=false;
    }
    ctx.strokeStyle='#1A1714'; ctx.lineWidth=2.5; ctx.stroke();

    // Points
    pts.forEach(p=>{
      const predicted=prob(p.x,p.y)>thresh?1:0;
      const correct=predicted===p.c;
      ctx.beginPath(); ctx.arc(px(p.x),py(p.y),6,0,Math.PI*2);
      ctx.fillStyle=p.c===1?'#2D5544':'#9B3A22';
      ctx.fill();
      if(!correct){
        ctx.beginPath(); ctx.arc(px(p.x),py(p.y),9,0,Math.PI*2);
        ctx.strokeStyle='#B85C38'; ctx.lineWidth=2; ctx.stroke();
      }
    });

    // Legend
    ctx.fillStyle='#2D5544'; ctx.beginPath(); ctx.arc(pad+10,pad+8,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1A1714'; ctx.font='10px Geist Mono,monospace'; ctx.fillText('Class 1',pad+18,pad+12);
    ctx.fillStyle='#9B3A22'; ctx.beginPath(); ctx.arc(pad+80,pad+8,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1A1714'; ctx.fillText('Class 0',pad+88,pad+12);
    ctx.fillStyle='#B85C38'; ctx.font='10px Geist Mono,monospace';
    ctx.fillText('⭕ = misclassified',pad+150,pad+12);

    // Axes
    ctx.strokeStyle='#DDD9D1'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pad,pad); ctx.lineTo(pad,pad+H); ctx.lineTo(pad+W,pad+H); ctx.stroke();
    ctx.fillStyle='#8C8278'; ctx.font='10px Geist Mono,monospace';
    ctx.fillText('Feature 1',pad+W/2-20,pad+H+18);
    ctx.save(); ctx.translate(10,pad+H/2); ctx.rotate(-Math.PI/2);
    ctx.fillText('Feature 2',0,0); ctx.restore();
  }

  slider.oninput=draw;
  draw();
  window.addEventListener('resize',draw);
}

// ──────────────────────────────────────────────────────────────────────────
// OVERFITTING — Polynomial fit comparison
// ──────────────────────────────────────────────────────────────────────────
function vizOverfitting(containerId){
  const el=document.getElementById(containerId);
  if(!el) return;
  el.innerHTML=`
  <div class="viz-wrap">
    <div class="viz-head">
      <div class="viz-title">Overfitting in Action \u2014 Polynomial Degree</div>
      <div class="viz-controls">
        <div class="viz-slider-wrap">
          <span class="viz-label">Degree</span>
          <input class="viz-slider" type="range" id="ov-deg" min="1" max="7" value="1" step="1">
          <span class="viz-val" id="ov-deg-val">1</span>
        </div>
        <span id="ov-badge" style="font-size:11px;font-weight:600;padding:3px 10px;border-radius:6px;background:var(--bg-input);color:var(--text-faint);">UNDERFITTING</span>
      </div>
    </div>
    <div style="display:flex;gap:20px;padding:6px 18px 0;font-size:11px;font-family:'Geist Mono',monospace;color:var(--text-faint);">
      <span>Train RMSE: <span id="ov-tr" style="color:var(--text-strong);">-</span></span>
      <span>Test RMSE: <span id="ov-te" style="color:var(--text-strong);">-</span></span>
    </div>
    <div style="position:relative;width:100%;height:280px;padding:0 8px 8px;">
      <canvas id="ov-chart" role="img" aria-label="Polynomial curve fitting showing overfitting at high degrees"></canvas>
    </div>
    <div class="viz-note">Degree 1: straight line \u2014 underfitting. Degree 3: captures the shape well. Degree 7: passes through every training point exactly (Train RMSE = 0.000) but wiggles wildly between them \u2014 perfect memorisation, terrible generalisation.</div>
  </div>`;

  const N=8, lo=0.5, hi=7.5, mid=(lo+hi)/2, half=(hi-lo)/2;
  const TX=Array.from({length:N},(_,k)=>mid+half*Math.cos(Math.PI*(2*(N-1-k)+1)/(2*N)));
  const TN=[0.10,-0.14,0.18,-0.12,0.16,-0.18,0.13,-0.10];
  const TY=TX.map((x,i)=>Math.sin(x)*0.85+0.55+TN[i]);
  const testX=[1.0,2.0,3.2,4.0,5.1,6.2,7.0];
  const testY=testX.map(x=>Math.sin(x)*0.85+0.55);

  function lagrange(xq){
    let r=0;
    for(let i=0;i<N;i++){
      let t=TY[i];
      for(let j=0;j<N;j++) if(j!==i) t*=(xq-TX[j])/(TX[i]-TX[j]);
      r+=t;
    }
    return r;
  }

  function chebBasis(t,k){
    const T=[1]; if(k===0) return T;
    T.push(t);
    for(let i=2;i<=k;i++) T.push(2*t*T[i-1]-T[i-2]);
    return T;
  }

  function fitLS(deg){
    const k=deg+1;
    const tn=TX.map(x=>2*(x-lo)/(hi-lo)-1);
    const F=tn.map(t=>chebBasis(t,deg));
    const A=Array.from({length:k},(_,a)=>[
      ...Array.from({length:k},(_,b)=>F.reduce((s,r)=>s+r[a]*r[b],0)),
      F.reduce((s,r,i)=>s+r[a]*TY[i],0)
    ]);
    for(let c=0;c<k;c++){
      let pr=c,pv=0;
      for(let r=c;r<k;r++) if(Math.abs(A[r][c])>pv){pv=Math.abs(A[r][c]);pr=r;}
      if(pv<1e-12) return null;
      [A[c],A[pr]]=[A[pr],A[c]];
      const inv=1/A[c][c];
      for(let j=c;j<=k;j++) A[c][j]*=inv;
      for(let r=0;r<k;r++){
        if(r===c) continue;
        const f=A[r][c];
        for(let j=c;j<=k;j++) A[r][j]-=f*A[c][j];
      }
    }
    const coefs=A.map(r=>r[k]);
    return x=>{
      const t=2*(x-lo)/(hi-lo)-1;
      return chebBasis(t,deg).reduce((s,v,i)=>s+coefs[i]*v,0);
    };
  }

  function calcRmse(fn,X,Y){return Math.sqrt(X.reduce((s,x,i)=>s+(fn(x)-Y[i])**2,0)/X.length);}

  const xs=Array.from({length:200},(_,i)=>lo+i*(hi-lo)/199);
  const trueY=xs.map(x=>Math.sin(x)*0.85+0.55);

  const chartInst=new Chart(document.getElementById('ov-chart'),{
    type:'line',
    data:{datasets:[
      {label:'True curve',data:xs.map((x,i)=>({x,y:trueY[i]})),
       borderColor:'rgba(29,158,117,0.6)',borderWidth:1.5,borderDash:[6,4],
       pointRadius:0,tension:0.3,fill:false,order:3},
      {label:'Fitted',data:[],
       borderColor:'#1A3D5C',borderWidth:2.5,
       pointRadius:0,tension:0,fill:false,order:2},
      {label:'Train',data:TX.map((x,i)=>({x,y:TY[i]})),
       type:'scatter',pointRadius:6,pointBackgroundColor:'#1A1714',
       pointBorderColor:'white',pointBorderWidth:2,
       showLine:false,order:1}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      animation:{duration:80},
      plugins:{legend:{display:false},tooltip:{enabled:false}},
      scales:{
        x:{type:'linear',min:0,max:8.5,
           grid:{color:'rgba(128,128,128,0.1)'},
           ticks:{color:'#8C8278',font:{size:10,family:"'Geist Mono',monospace"},stepSize:1}},
        y:{type:'linear',min:-0.5,max:1.9,
           grid:{color:'rgba(128,128,128,0.1)'},
           ticks:{color:'#8C8278',font:{size:10,family:"'Geist Mono',monospace"},stepSize:0.5}}
      }
    }
  });

  function updateOv(){
    const deg=parseInt(document.getElementById('ov-deg').value);
    document.getElementById('ov-deg-val').textContent=deg;
    const isInterp=deg>=N-1;
    const fn=isInterp?lagrange:(fitLS(deg)||lagrange);
    chartInst.data.datasets[1].data=xs.map(x=>({x,y:isFinite(fn(x))?Math.max(-0.7,Math.min(2.1,fn(x))):null}));
    const isOver=deg>=5,isUnder=deg<=1;
    chartInst.data.datasets[1].borderColor=isOver?'#B85C38':isUnder?'#9B8E84':'#1A3D5C';
    chartInst.update('none');
    const tr=calcRmse(fn,TX,TY).toFixed(3);
    const te=calcRmse(fn,testX,testY).toFixed(3);
    document.getElementById('ov-tr').textContent=tr;
    const teEl=document.getElementById('ov-te');
    teEl.textContent=te;
    teEl.style.color=parseFloat(te)>parseFloat(tr)*1.5?'#B85C38':'var(--text-strong)';
    const badge=document.getElementById('ov-badge');
    if(isOver||isInterp){badge.textContent=isInterp?'INTERPOLATION':'OVERFITTING';badge.style.background='#FDF0EC';badge.style.color='#B85C38';}
    else if(isUnder){badge.textContent='UNDERFITTING';badge.style.background='var(--bg-input)';badge.style.color='var(--text-faint)';}
    else{badge.textContent='GOOD FIT';badge.style.background='#EDF5F0';badge.style.color='#2D6B4A';}
  }
  document.getElementById('ov-deg').addEventListener('input',updateOv);
  updateOv();
}
// ──────────────────────────────────────────────────────────────────────────
// MODEL EVALUATION — Bias-Variance Tradeoff Curve
// ──────────────────────────────────────────────────────────────────────────
function vizBiasVariance(containerId){
  const el=document.getElementById(containerId);
  if(!el) return;
  el.innerHTML=`
  <div class="viz-wrap">
    <div class="viz-head">
      <div class="viz-title">Bias–Variance Tradeoff</div>
    </div>
    <canvas class="viz-canvas" id="bv-canvas" height="300" width="600"></canvas>
    <div class="viz-note">As model complexity grows, bias² falls and variance rises. Total test error (their sum) forms a U-curve — the optimal model complexity is at the bottom of the U. Training error keeps falling, which is why evaluating only on training data is misleading.</div>
  </div>`;

  function draw(){
    const ctx=getCanvas('bv-canvas',600,300);
    if(!ctx) return;
    const {cw,ch}=ctx;
    ctx.clearRect(0,0,cw,ch);
    const pad=44, W=cw-pad*2, H=ch-pad*2;
    const N=120;

    function bias2(t){return 1.1*Math.pow(1-t,1.6);}
    function variance(t){return 0.05+0.9*Math.pow(t,1.8);}
    function totalTest(t){return bias2(t)+variance(t)+0.08;}
    function trainErr(t){return Math.max(0.02, 0.08-t*0.06);}

    // find intersection of bias2 and variance (where they cross)
    let minT=0.5,minDiff=10;
    for(let i=1;i<=N;i++){
      const t=i/N, tp=(i-1)/N;
      // crossing: bias2 goes from above to below variance
      if((bias2(tp)-variance(tp))*(bias2(t)-variance(t))<=0){
        // linear interpolation for precise crossing point
        const db0=bias2(tp)-variance(tp), db1=bias2(t)-variance(t);
        minT=tp+(-db0/(db1-db0))*(t-tp);
        break;
      }
    }

    const curves=[
      {fn:bias2, color:'#9B3A22', dash:[], label:'Bias²', lx:0.05},
      {fn:variance, color:'#1A3D5C', dash:[], label:'Variance', lx:0.75},
      {fn:trainErr, color:'#3A7D55', dash:[4,4], label:'Train error', lx:0.55},
      {fn:totalTest, color:'#1A1714', dash:[], label:'Test error (Bias²+Var)', lx:0.35},
    ];

    const allY=curves.flatMap(({fn})=>Array.from({length:N+1},(_,i)=>fn(i/N)));
    const ymax=Math.max(...allY)*1.1, ymin=0;

    function px(t){return pad+t*W;}
    function py(v){return pad+H*(1-(v-ymin)/(ymax-ymin));}

    // Grid
    ctx.strokeStyle='#E8E4DC'; ctx.lineWidth=1;
    [0.25,0.5,0.75,1].forEach(t=>{
      ctx.beginPath(); ctx.moveTo(px(t),pad); ctx.lineTo(px(t),pad+H); ctx.stroke();
    });

    curves.forEach(({fn,color,dash,label,lx})=>{
      ctx.beginPath(); ctx.setLineDash(dash);
      for(let i=0;i<=N;i++){const t=i/N; i===0?ctx.moveTo(px(t),py(fn(t))):ctx.lineTo(px(t),py(fn(t)));}
      ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]);
      // Label at lx
      const lv=fn(lx);
      ctx.fillStyle=color; ctx.font='10px Geist Mono,monospace';
      ctx.fillText(label,px(lx),py(lv)-6);
    });

    // Optimal marker
    ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(px(minT),pad); ctx.lineTo(px(minT),pad+H);
    ctx.strokeStyle='#1A1714'; ctx.lineWidth=1.5; ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#1A1714'; ctx.font='10px Geist Mono,monospace';
    ctx.fillText('Optimal',px(minT)+4,pad+14);
    // Dot at the intersection point
    const intY=py((bias2(minT)+variance(minT))/2);
    ctx.beginPath(); ctx.arc(px(minT),intY,5,0,Math.PI*2);
    ctx.fillStyle='#1A1714'; ctx.fill();
    ctx.strokeStyle='white'; ctx.lineWidth=1.5; ctx.stroke();

    // Shaded regions
    ctx.fillStyle='rgba(155,58,34,0.06)';
    ctx.fillRect(pad,pad,W*0.22,H);
    ctx.fillStyle='rgba(26,61,92,0.06)';
    ctx.fillRect(pad+W*0.62,pad,W*0.38,H);
    ctx.fillStyle='#9B3A22'; ctx.font='10px Geist Mono,monospace'; ctx.fillText('Underfitting',pad+4,pad+H-6);
    ctx.fillStyle='#1A3D5C'; ctx.fillText('Overfitting',pad+W*0.64,pad+H-6);

    // Axes
    ctx.strokeStyle='#DDD9D1'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pad,pad); ctx.lineTo(pad,pad+H); ctx.lineTo(pad+W,pad+H); ctx.stroke();
    ctx.fillStyle='#8C8278'; ctx.font='10px Geist Mono,monospace';
    ctx.fillText('Model Complexity →',pad+W/2-50,pad+H+18);
    ctx.save(); ctx.translate(12,pad+H/2); ctx.rotate(-Math.PI/2);
    ctx.fillText('Error',0,0); ctx.restore();
  }
  draw();
  window.addEventListener('resize',draw);
}

// ──────────────────────────────────────────────────────────────────────────
// KNN — Decision Regions
// ──────────────────────────────────────────────────────────────────────────
function vizKNN(containerId){
  const el=document.getElementById(containerId);
  if(!el) return;
  el.innerHTML=`
  <div class="viz-wrap">
    <div class="viz-head">
      <div class="viz-title">KNN Decision Regions</div>
      <div class="viz-controls">
        <div class="viz-slider-wrap">
          <span class="viz-label">K =</span>
          <input class="viz-slider" type="range" id="knn-k" min="1" max="15" value="1" step="2">
          <span class="viz-val" id="knn-k-val">1</span>
        </div>
      </div>
    </div>
    <canvas class="viz-canvas" id="knn-canvas" height="320" width="600"></canvas>
    <div class="viz-note">Each background pixel is colored by the class KNN would assign it. Small K = jagged, complex boundary (high variance). Large K = smooth, simple boundary (high bias). Find the sweet spot.</div>
  </div>`;

  const trainPts=[
    {x:1.5,y:1.5,c:0},{x:2,y:2.5,c:0},{x:1,y:3,c:0},{x:2.5,y:1,c:0},{x:3,y:2,c:0},
    {x:1.5,y:4.5,c:0},{x:4,y:1.2,c:0},
    {x:5,y:5,c:1},{x:5.5,y:4,c:1},{x:6,y:5.5,c:1},{x:4.5,y:6,c:1},{x:6.5,y:4.5,c:1},
    {x:5,y:3.2,c:1},{x:7,y:5,c:1},
    {x:3.5,y:4,c:2},{x:4,y:5,c:2},{x:3,y:5.5,c:2},{x:4.5,y:3.5,c:2},{x:2.5,y:4.5,c:2},
    {x:5.5,y:2.5,c:2},{x:3,y:3.5,c:2}
  ];
  const palette=['rgba(45,85,68','rgba(26,61,92','rgba(155,58,34'];

  const kSlider=document.getElementById('knn-k');
  const kVal=document.getElementById('knn-k-val');

  function knnPredict(x,y,k){
    const dists=trainPts.map(p=>({d:(x-p.x)**2+(y-p.y)**2,c:p.c}));
    dists.sort((a,b)=>a.d-b.d);
    const votes=[0,0,0];
    dists.slice(0,k).forEach(n=>votes[n.c]++);
    return votes.indexOf(Math.max(...votes));
  }

  function draw(){
    const ctx=getCanvas('knn-canvas',600,320);
    if(!ctx) return;
    const {cw,ch}=ctx;
    ctx.clearRect(0,0,cw,ch);
    const pad=28, W=cw-pad*2, H=ch-pad*2;
    const xmin=0,xmax=8,ymin=0,ymax=8;
    const k=parseInt(kSlider.value);
    kVal.textContent=k;

    function px(xv){return pad+W*(xv-xmin)/(xmax-xmin);}
    function py(yv){return pad+H*(1-(yv-ymin)/(ymax-ymin));}

    // Background grid
    const res=40;
    const cw2=W/res, ch2=H/res;
    for(let i=0;i<res;i++){
      for(let j=0;j<res;j++){
        const xv=xmin+i*(xmax-xmin)/res;
        const yv=ymin+(res-1-j)*(ymax-ymin)/res;
        const c=knnPredict(xv,yv,k);
        ctx.fillStyle=`${palette[c]},0.18)`;
        ctx.fillRect(pad+i*cw2, pad+j*ch2, cw2+1, ch2+1);
      }
    }

    // Training points
    trainPts.forEach(p=>{
      ctx.beginPath(); ctx.arc(px(p.x),py(p.y),6,0,Math.PI*2);
      ctx.fillStyle=`${palette[p.c]},0.9)`; ctx.fill();
      ctx.strokeStyle='white'; ctx.lineWidth=1.5; ctx.stroke();
    });

    // K label
    ctx.fillStyle='#1A1714'; ctx.font='11px Geist Mono,monospace';
    const label=k===1?'K=1: every point is its own kingdom (overfit)':
                k>=11?`K=${k}: very smooth, approaching underfitting`:`K=${k}: reasonable boundary`;
    ctx.fillText(label,pad+4,pad+16);
  }
  kSlider.oninput=draw;
  draw();
  window.addEventListener('resize',draw);
}

// ──────────────────────────────────────────────────────────────────────────
// CLUSTERING — K-Means animation
// ──────────────────────────────────────────────────────────────────────────
function vizKMeans(containerId){
  const el=document.getElementById(containerId);
  if(!el) return;
  el.innerHTML=`
  <div class="viz-wrap">
    <div class="viz-head">
      <div class="viz-title">K-Means Convergence</div>
      <div class="viz-controls">
        <div class="viz-slider-wrap">
          <span class="viz-label">K =</span>
          <input class="viz-slider" type="range" id="km-k" min="2" max="6" value="3" step="1">
          <span class="viz-val" id="km-k-val">3</span>
        </div>
        <button class="viz-btn viz-btn-primary" id="km-play">▶ Step</button>
        <button class="viz-btn" id="km-reset">Restart</button>
      </div>
    </div>
    <canvas class="viz-canvas" id="km-canvas" height="320" width="600"></canvas>
    <div class="viz-note">Press Step to advance one iteration at a time. Watch centroids (⬡) move toward their cluster means. The algorithm stops when centroids no longer move — convergence.</div>
  </div>`;

  // Fixed data: 3 natural clusters
  const rawData=[];
  const seeds=[[2,2],[5,7],[8,2]];
  // Use a deterministic pseudo-random for reproducibility
  let seed=42;
  function rand(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296;}
  function randn(){let u=0,v=0;while(!u)u=rand();while(!v)v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
  seeds.forEach(([mx,my])=>{
    for(let i=0;i<16;i++) rawData.push({x:mx+randn()*1.1,y:my+randn()*1.1});
  });

  const palette3=['#2D5544','#1A3D5C','#9B3A22','#5C3D6E','#B07A1F','#A65A2C'];
  let K=3, centroids=[], labels=[], iteration=0;

  const kSlider=document.getElementById('km-k');
  const kVal=document.getElementById('km-k-val');
  const playBtn=document.getElementById('km-play');
  const resetBtn=document.getElementById('km-reset');

  function initCentroids(k){
    centroids=[];
    for(let i=0;i<k;i++) centroids.push({x:1.5+i*2.5,y:1.5+((i%2)*5)});
    labels=rawData.map(()=>0);
    iteration=0;
    playBtn.textContent='▶ Step';
  }

  function step(){
    // Assign
    const prev=[...labels];
    rawData.forEach((p,i)=>{
      let best=0, bd=Infinity;
      centroids.forEach((c,ci)=>{const d=(p.x-c.x)**2+(p.y-c.y)**2; if(d<bd){bd=d;best=ci;}});
      labels[i]=best;
    });
    // Update centroids
    centroids=centroids.map((_,ci)=>{
      const pts=rawData.filter((_,i)=>labels[i]===ci);
      if(!pts.length) return centroids[ci];
      return{x:pts.reduce((s,p)=>s+p.x,0)/pts.length, y:pts.reduce((s,p)=>s+p.y,0)/pts.length};
    });
    iteration++;
    const converged=labels.every((l,i)=>l===prev[i]);
    if(converged) playBtn.textContent='✓ Converged';
    return converged;
  }

  function draw(){
    const ctx=getCanvas('km-canvas',600,320);
    if(!ctx) return;
    const {cw,ch}=ctx;
    ctx.clearRect(0,0,cw,ch);
    const pad=28, W=cw-pad*2, H=ch-pad*2;
    const xmin=0,xmax=11,ymin=0,ymax=11;
    function px(xv){return pad+W*(xv-xmin)/(xmax-xmin);}
    function py(yv){return pad+H*(1-(yv-ymin)/(ymax-ymin));}

    // Voronoi background (fast grid)
    const res=36;
    for(let i=0;i<res;i++){
      for(let j=0;j<res;j++){
        const xv=xmin+i*(xmax-xmin)/res, yv=ymin+(res-1-j)*(ymax-ymin)/res;
        let best=0,bd=Infinity;
        centroids.forEach((c,ci)=>{const d=(xv-c.x)**2+(yv-c.y)**2;if(d<bd){bd=d;best=ci;}});
        ctx.fillStyle=palette3[best]+'22';
        ctx.fillRect(pad+i*(W/res),pad+j*(H/res),W/res+1,H/res+1);
      }
    }

    // Lines from points to centroids
    rawData.forEach((p,i)=>{
      const c=centroids[labels[i]];
      ctx.beginPath(); ctx.moveTo(px(p.x),py(p.y)); ctx.lineTo(px(c.x),py(c.y));
      ctx.strokeStyle=palette3[labels[i]]+'33'; ctx.lineWidth=1; ctx.stroke();
    });

    // Data points
    rawData.forEach((p,i)=>{
      ctx.beginPath(); ctx.arc(px(p.x),py(p.y),5,0,Math.PI*2);
      ctx.fillStyle=palette3[labels[i]]+'CC'; ctx.fill();
      ctx.strokeStyle='white'; ctx.lineWidth=1; ctx.stroke();
    });

    // Centroids as diamonds
    centroids.forEach((c,ci)=>{
      const cx=px(c.x), cy=py(c.y), r=9;
      ctx.beginPath();
      ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r,cy); ctx.lineTo(cx,cy+r); ctx.lineTo(cx-r,cy);
      ctx.closePath();
      ctx.fillStyle=palette3[ci]; ctx.fill();
      ctx.strokeStyle='white'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='white'; ctx.font='bold 8px Geist Mono,monospace';
      ctx.textAlign='center'; ctx.fillText(ci,cx,cy+3); ctx.textAlign='left';
    });

    ctx.fillStyle='#1A1714'; ctx.font='11px Geist Mono,monospace';
    ctx.fillText(`Iteration ${iteration}`,pad+4,pad+16);
  }

  kSlider.oninput=()=>{K=parseInt(kSlider.value);kVal.textContent=K;initCentroids(K);draw();};
  playBtn.onclick=()=>{
    if(playBtn.textContent==='✓ Converged') return;
    step(); draw();
  };
  resetBtn.onclick=()=>{initCentroids(K);draw();};

  K=parseInt(kSlider.value);
  initCentroids(K);
  draw();
  window.addEventListener('resize',draw);
}

// ──────────────────────────────────────────────────────────────────────────
// DECISION TREES — Gini split visualizer
// ──────────────────────────────────────────────────────────────────────────
function vizDecisionTree(containerId){
  const el=document.getElementById(containerId);
  if(!el) return;
  el.innerHTML=`
  <div class="viz-wrap">
    <div class="viz-head">
      <div class="viz-title">Decision Tree — Gini Impurity Splits</div>
      <div class="viz-controls">
        <div class="viz-slider-wrap">
          <span class="viz-label">Split at x =</span>
          <input class="viz-slider" type="range" id="dt-split" min="5" max="95" value="50" step="1">
          <span class="viz-val" id="dt-split-val">50</span>
        </div>
      </div>
    </div>
    <canvas class="viz-canvas" id="dt-canvas" height="300" width="600"></canvas>
    <div class="viz-note">Slide the split point. The tree algorithm exhaustively tries every threshold and picks the one that minimizes the weighted Gini impurity of the two child nodes. Watch Gini drop toward 0 (pure) as you find the natural boundary.</div>
  </div>`;

  // Two separable clusters along x-axis
  const ptData=[
    {x:8,c:0},{x:15,c:0},{x:20,c:0},{x:28,c:0},{x:35,c:0},{x:22,c:0},{x:12,c:0},{x:40,c:0},{x:18,c:0},{x:32,c:0},
    {x:60,c:1},{x:68,c:1},{x:75,c:1},{x:80,c:1},{x:72,c:1},{x:65,c:1},{x:85,c:1},{x:90,c:1},{x:78,c:1},{x:63,c:1},
    {x:45,c:0},{x:50,c:1},{x:55,c:0} // ambiguous middle
  ];

  function gini(labels){
    if(!labels.length) return 0;
    const n=labels.length;
    const counts={};
    labels.forEach(l=>counts[l]=(counts[l]||0)+1);
    return 1-Object.values(counts).reduce((s,c)=>s+(c/n)**2,0);
  }

  const splitSlider=document.getElementById('dt-split');
  const splitVal=document.getElementById('dt-split-val');

  function draw(){
    const ctx=getCanvas('dt-canvas',600,300);
    if(!ctx) return;
    const {cw,ch}=ctx;
    ctx.clearRect(0,0,cw,ch);
    const pad=40, W=cw-pad*2, H=ch-pad*2;
    const split=parseInt(splitSlider.value);
    splitVal.textContent=split;

    // Gini curve across all splits
    const giniesCurve=[];
    for(let s=5;s<=95;s++){
      const L=ptData.filter(p=>p.x<=s).map(p=>p.c);
      const R=ptData.filter(p=>p.x>s).map(p=>p.c);
      const n=ptData.length;
      const wg=(L.length/n)*gini(L)+(R.length/n)*gini(R);
      giniesCurve.push({s,g:wg});
    }
    const minG=Math.min(...giniesCurve.map(v=>v.g));
    const ymax=0.55, ymin=0;

    function px(sv){return pad+W*(sv-5)/(95-5);}
    function py(gv){return pad+H*(1-(gv-ymin)/(ymax-ymin));}

    // Gini curve
    ctx.beginPath();
    giniesCurve.forEach(({s,g},i)=>{i===0?ctx.moveTo(px(s),py(g)):ctx.lineTo(px(s),py(g));});
    ctx.strokeStyle='#DDD9D1'; ctx.lineWidth=2; ctx.stroke();

    // Min marker
    const best=giniesCurve.reduce((a,b)=>b.g<a.g?b:a);
    ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.moveTo(px(best.s),pad); ctx.lineTo(px(best.s),py(best.g));
    ctx.strokeStyle='#3A7D55'; ctx.lineWidth=1.5; ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#3A7D55'; ctx.font='10px Geist Mono,monospace';
    ctx.fillText(`Best: x=${best.s}`,px(best.s)+4,pad+12);

    // Current split line
    ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(px(split),pad); ctx.lineTo(px(split),pad+H);
    ctx.strokeStyle='#1A1714'; ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]);

    // Current point
    const curG=giniesCurve.find(v=>v.s===split)?.g||0;
    ctx.beginPath(); ctx.arc(px(split),py(curG),6,0,Math.PI*2);
    ctx.fillStyle='#1A1714'; ctx.fill();

    // Gini info
    const L=ptData.filter(p=>p.x<=split);
    const R=ptData.filter(p=>p.x>split);
    const n=ptData.length;
    const Lg=gini(L.map(p=>p.c)), Rg=gini(R.map(p=>p.c));
    const wg=(L.length/n)*Lg+(R.length/n)*Rg;
    ctx.fillStyle='#1A1714'; ctx.font='10px Geist Mono,monospace';
    ctx.fillText(`Weighted Gini: ${wg.toFixed(3)}`,pad+4,pad+14);
    ctx.fillStyle='#9B3A22'; ctx.fillText(`Left Gini: ${Lg.toFixed(3)}  n=${L.length}`,pad+4,pad+27);
    ctx.fillStyle='#1A3D5C'; ctx.fillText(`Right Gini: ${Rg.toFixed(3)}  n=${R.length}`,pad+4,pad+40);

    // Background shading
    ctx.fillStyle='rgba(155,58,34,0.06)';
    ctx.fillRect(pad,pad,W*(split-5)/90,H);
    ctx.fillStyle='rgba(26,61,92,0.06)';
    ctx.fillRect(pad+W*(split-5)/90,pad,W*(95-split)/90,H);

    // Data rug plot at bottom
    ptData.forEach(p=>{
      const rx=pad+W*(p.x-5)/90;
      ctx.beginPath(); ctx.arc(rx,pad+H+16,4,0,Math.PI*2);
      ctx.fillStyle=p.c===0?'#9B3A22':'#1A3D5C'; ctx.fill();
    });

    // Axis
    ctx.strokeStyle='#DDD9D1'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pad,pad); ctx.lineTo(pad,pad+H); ctx.lineTo(pad+W,pad+H); ctx.stroke();
    ctx.fillStyle='#8C8278'; ctx.font='10px Geist Mono,monospace';
    ctx.fillText('Split threshold →',pad+W/2-40,pad+H+32);
    ctx.save(); ctx.translate(12,pad+H/2); ctx.rotate(-Math.PI/2);
    ctx.fillText('Weighted Gini',0,0); ctx.restore();
  }

  splitSlider.oninput=draw;
  draw();
  window.addEventListener('resize',draw);
}

// ──────────────────────────────────────────────────────────────────────────
// vizRenderers registry
// ──────────────────────────────────────────────────────────────────────────
const vizRenderers={
  'linear-regression': (id)=>vizGradientDescent(id),
  'logistic-regression': (id)=>vizDecisionBoundary(id),
  'model-evaluation': (id)=>vizBiasVariance(id),
  'overfitting': (id)=>vizOverfitting(id),
  'decision-trees': (id)=>vizDecisionTree(id),
  'knn': (id)=>vizKNN(id),
  'clustering': (id)=>vizKMeans(id),
};

function initViz(topicId){
  const container=document.getElementById('tab-viz');
  if(!container||!vizRenderers[topicId]) return;
  if(container.children.length>0) return; // already rendered
  vizRenderers[topicId](container.id);
}

// ── STATE ────────────────────────────────────────────────────────────────
let currentTopic=0,currentTab='explain',quizState={},editors={},started={};

// ── SIDEBAR ──────────────────────────────────────────────────────────────
function renderNav(){
  document.getElementById('navList').innerHTML=topics.map((t,i)=>`
    <div class="nav-item${i===currentTopic?' active':''}" onclick="selectTopic(${i})">
      <span class="nav-num">${String(i).padStart(2,'0')}</span>
      <span class="nav-dot" style="background:${t.color}"></span>
      <span class="nav-label">${t.label}</span>
    </div>`).join('');

  document.getElementById('progressBar').style.width=(n/topics.length*100)+'%';

// ── MAIN CONTENT ─────────────────────────────────────────────────────────

  const t=topics[currentTopic],c=t.content;
  started[t.id]=true;
  const hasCode=!!(codingChallenges[t.id]&&codingChallenges[t.id].length);
  const hasViz=!!(vizRenderers[t.id]);
  document.getElementById('mainContent').innerHTML=`
    <div class="topic-header">
      <div class="topic-tag"><span class="topic-dot" style="background:${t.color}"></span>Chapter ${String(currentTopic).padStart(2,'0')}</div>
      <div class="topic-title">${t.label}</div>
      <div class="topic-def">${c.definition}</div>
    </div>
    <div class="tabs">
      <div class="tab${currentTab==='explain'?' active':''}" onclick="switchTab('explain')">Deep Dive</div>
      <div class="tab${currentTab==='review'?' active':''}" onclick="switchTab('review')">Key Points</div>
      <div class="tab${currentTab==='practice'?' active':''}" onclick="switchTab('practice')">Practice Quiz</div>
      ${hasViz?`<div class="tab${currentTab==='viz'?' active':''}" onclick="switchTab('viz')">Visualize</div>`:''}
      ${hasCode?`<div class="tab${currentTab==='coding'?' active':''}" onclick="switchTab('coding')">Coding</div>`:''}
    </div>
    <div id="tab-explain" class="tab-content${currentTab==='explain'?' active':''}">${renderExplain(c)}</div>
    <div id="tab-review"  class="tab-content${currentTab==='review'?' active':''}">${renderReview(c)}</div>
    <div id="tab-practice"class="tab-content${currentTab==='practice'?' active':''}">${renderPractice(t.id,c)}</div>
    ${hasViz?`<div id="tab-viz" class="tab-content viz-tab${currentTab==='viz'?' active':''}" ></div>`:''}
    ${hasCode?`<div id="tab-coding" class="tab-content${currentTab==='coding'?' active':''}">${renderCoding(t.id)}</div>`:''}`;
  document.getElementById('mainContent').scrollTop=0;
  setTimeout(()=>{const a=document.querySelector('.tab-content.active');if(a)renderMath(a);},20);
  if(currentTab==='coding') setTimeout(()=>initEditors(t.id),50);
  if(currentTab==='viz') setTimeout(()=>initViz(t.id),60);
}

// ── TAB RENDERERS ────────────────────────────────────────────────────────
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function isCapHeader(s){
  return /^[A-Z][A-Z\s'\d\-\(\)\/]{3,}[\u2014:]/.test(s)&&(s.match(/[A-Z]/g)||[]).length>=3;
}
function extractTag(s){
  const em=s.indexOf('\u2014');
  if(em!==-1){const a=s.slice(em+1).trimStart();if(/[a-z]/.test(a.slice(0,8)))return[s.slice(0,em).trim(),a];}
  const m=s.match(/^(.+?):\s+(.+)$/);
  if(m) return[m[1].trim(),m[2].trim()];
  return[s.replace(/[:\u2014]\s*$/,'').trim(),''];
}

function formatBody(raw){
  const lines=raw.split('\n');
  let html='',i=0;
  while(i<lines.length){
    const line=lines[i],t=line.trim();
    if(!t){i++;continue;}
    // Display math block: line starts and ends with $$
    if(t.startsWith('$$')&&t.endsWith('$$')&&t.length>4){
      html+=`<div class="math-block">${t}</div>`;i++;continue;
    }
    // Indented block
    if(/^  +\S/.test(line)&&!isCapHeader(t)){
      const block=[];
      while(i<lines.length){
        const l=lines[i];
        if(!l.trim()){if(i+1<lines.length&&/^  +\S/.test(lines[i+1])){block.push('');i++;continue;}else break;}
        if(!/^  +/.test(l)) break;
        block.push(l);i++;
      }
      while(block.length&&!block[block.length-1].trim()) block.pop();
      if(block.length){
        const mi=Math.min(...block.filter(l=>l.trim()).map(l=>l.match(/^ */)[0].length));
        const dd=block.map(l=>l.slice(mi)).join('\n');
        const hasMath=dd.includes('$$')||/\$[^\s$]/.test(dd);
        if(hasMath) html+=`<div class="math-block">${dd}</div>`;
        else html+=`<div class="sb-code">${esc(dd)}</div>`;
      }
      continue;
    }
    // ALL-CAPS header
    if(isCapHeader(t)){
      const[tag,desc]=extractTag(t);i++;
      const body=[];
      while(i<lines.length&&/^  +/.test(lines[i])) body.push(lines[i++].trim());
      html+=`<div class="sb-item"><div class="sb-item-header"><span class="sb-item-tag">${esc(tag)}</span>${desc?`<span class="sb-item-desc">${desc}</span>`:''}</div>${body.length?`<div class="sb-item-body">${body.join('\n')}</div>`:''}</div>`;
      continue;
    }
    // Prose (may contain inline $...$)
    const para=[];
    while(i<lines.length){
      const l=lines[i],tt=l.trim();
      if(!tt||/^  +\S/.test(l)||isCapHeader(tt)||(tt.startsWith('$$')&&tt.endsWith('$$'))) break;
      para.push(tt);i++;
    }
    if(para.length) html+=`<p class="sb-prose">${para.join(' ')}</p>`;
  }
  return html;
}

function renderExplain(c){
  return`<div class="sections">${c.explanation.map((s,i)=>`
    <div class="section" id="sec-${i}">
      <div class="section-head" onclick="toggleSection(${i})">
        <span class="section-heading">${s.heading}</span>
        <span class="section-chevron">&#9660;</span>
      </div>
      <div class="section-body">${formatBody(s.body)}</div>
    </div>`).join('')}</div>`;
}

function renderReview(c){
  return`<div class="kp-grid">${c.keyPoints.map(k=>`
    <div class="kp-card">
      <div class="kp-title">${k.title}</div>
      <div class="kp-body">${k.body}</div>
    </div>`).join('')}</div>
  <div class="watch-out-box">
    <div class="watch-out-label">&#9888; Watch Out</div>
    <div class="watch-out-text">${c.watchOut}</div>
  </div>`;
}

function renderPractice(id,c){
  if(!quizState[id]) quizState[id]={idx:0,answers:[],score:0};
  const st=quizState[id];
  if(st.idx>=c.questions.length) return renderResult(id,c);
  const q=c.questions[st.idx],answered=st.answers[st.idx]!==undefined;
  const dots=c.questions.map((_,i)=>{
    let cl='';
    if(i<st.answers.length&&st.answers[i]!==undefined) cl=st.answers[i]===c.questions[i].ans?'correct':'wrong';
    else if(i===st.idx) cl='current';
    return`<div class="quiz-dot ${cl}"></div>`;
  }).join('');
  const opts=q.opts.map((o,i)=>{
    let cl='';
    if(answered){if(i===q.ans) cl='correct-ans';else if(i===st.answers[st.idx]) cl='wrong-ans';}
    return`<div class="option${cl?' '+cl:''}" onclick="answerQuiz('${id}',${st.idx},${i})">${o}</div>`;
  }).join('');
  return`<div class="quiz-progress"><div class="quiz-prog-dots">${dots}</div><div class="quiz-score">${st.score} / ${st.answers.filter(a=>a!==undefined).length||'?'} correct</div></div>
  <div class="question-card">
    <div class="question-text">Q${st.idx+1}. ${q.q}</div>
    <div class="options">${opts}</div>
    ${answered?`<div class="explanation"><div class="explanation-label">Why?</div>${q.exp}</div>`:''}
    ${answered?`<div class="quiz-nav"><button class="btn btn-primary" onclick="nextQuestion('${id}',${c.questions.length})">${st.idx<c.questions.length-1?'Next Question &#8594;':'See Results'}</button></div>`:''}
  </div>`;
}

function renderResult(id,c){
  const st=quizState[id],n=c.questions.length,pct=Math.round(st.score/n*100);
  const msg=pct>=80?'Strong work.':pct>=60?'Good foundation &#8212; review the misses.':'Review the Deep Dive tab and try again.';
  return`<div class="quiz-result">
    <div class="result-score">${st.score}/${n}</div>
    <div class="result-label">${pct}% &#8212; ${msg}</div>
    <button class="btn btn-primary" onclick="resetQuiz('${id}')">Retake Quiz</button>
    <div class="result-breakdown" style="margin-top:20px">${c.questions.map((q,i)=>`<div style="margin-bottom:4px">${st.answers[i]===q.ans?'&#10003;':'&#10007;'} Q${i+1}: ${q.q.substring(0,50)}...</div>`).join('')}</div>
  </div>`;
}

function renderCoding(id){
  return`<div class="coding-challenges">${(codingChallenges[id]||[]).map((ch,i)=>`
    <div class="challenge-card">
      <div class="challenge-head"><div class="challenge-title">${ch.title}</div><div class="challenge-desc">${ch.desc}</div></div>
      <div><textarea id="ed-${id}-${i}">${ch.template}</textarea>
      <div class="editor-actions">
        <button class="btn-run" onclick="runCode('${id}',${i})">&#9654; Run</button>
        <button class="btn-reset" onclick="resetCode('${id}',${i})">Reset</button>
      </div>
      <div class="output-box" id="out-${id}-${i}"><span class="output-placeholder">Press &#9654; Run to execute.</span></div>
      </div>
    </div>`).join('')}</div>`;
}

// ── INTERACTIONS ─────────────────────────────────────────────────────────
function selectTopic(i){currentTopic=i;currentTab='explain';renderNav();renderMain();closeSidebar();}
function switchTab(tab){
  currentTab=tab;renderMain();
  if(tab==='coding') setTimeout(()=>initEditors(topics[currentTopic].id),60);
  if(tab==='viz') setTimeout(()=>initViz(topics[currentTopic].id),60);
}
function toggleSection(i){
  const el=document.getElementById('sec-'+i),wasOpen=el.classList.contains('open');
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('open'));
  if(!wasOpen){
    el.classList.add('open');
    setTimeout(()=>{const b=el.querySelector('.section-body');if(b)renderMath(b);},20);
  }
}
function answerQuiz(id,qi,oi){
  const st=quizState[id];
  if(st.answers[qi]!==undefined) return;
  st.answers[qi]=oi;
  if(oi===topics.find(t=>t.id===id).content.questions[qi].ans) st.score++;
  renderMain();
}
function nextQuestion(id,total){quizState[id].idx=Math.min(quizState[id].idx+1,total);renderMain();}
function resetQuiz(id){quizState[id]={idx:0,answers:[],score:0};renderMain();}

// ── CODE EDITOR ──────────────────────────────────────────────────────────
function initEditors(id){
  (codingChallenges[id]||[]).forEach((_,i)=>{
    const k=`${id}-${i}`,ta=document.getElementById(`ed-${k}`);
    if(!ta||editors[k]) return;
    editors[k]=CodeMirror.fromTextArea(ta,{mode:'python',theme:'dracula',lineNumbers:true,indentUnit:4,indentWithTabs:false,extraKeys:{"Tab":cm=>cm.execCommand("insertSoftTab")}});
  });
}
function runCode(id,i){
  const k=`${id}-${i}`,el=document.getElementById(`out-${k}`);
  el.textContent='';el.className='output-box';
  const code=editors[k]?editors[k].getValue():'';
  let out='';
  Sk.configure({output:t=>{out+=t;el.textContent=out;},read:f=>{if(Sk.builtinFiles?.files[f])return Sk.builtinFiles.files[f];throw new Error(`File not found: '${f}'`);}});
  Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody('<stdin>',false,code,true)).catch(e=>{el.className='output-box error';el.textContent=(out?out+'\n\n':'')+String(e);});
}
function resetCode(id,i){
  const k=`${id}-${i}`;
  if(editors[k]) editors[k].setValue((codingChallenges[id]||[])[i]?.template||'');
  const el=document.getElementById(`out-${k}`);
  if(el){el.className='output-box';el.innerHTML='<span class="output-placeholder">Press &#9654; Run to execute.</span>';}
}

// ── MOBILE ───────────────────────────────────────────────────────────────
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('open');}
document.getElementById('menuBtn').addEventListener('click',()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open');});
document.getElementById('overlay').addEventListener('click',closeSidebar);

// ── INIT ─────────────────────────────────────────────────────────────────
renderNav();renderMain();
</script>
