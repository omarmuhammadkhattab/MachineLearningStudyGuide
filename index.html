// ── 9: NAIVE BAYES ──────────────────────────
{
  id:'naive-bayes', label:'Naive Bayes', color:'#3B6B1A',
  content:{
    definition:"A probabilistic classifier based on Bayes' theorem that assumes all features are conditionally independent given the class — an assumption that's almost always wrong yet produces surprisingly strong results.",
    explanation:[
      {heading:"Bayes' Theorem — The Foundation", body:`Naive Bayes is built entirely on Bayes' theorem:

  P(A | B) = P(B | A) * P(A) / P(B)

In classification, A = class label, B = observed features:

  P(class | features) = P(features | class) * P(class) / P(features)

In words:
  POSTERIOR = LIKELIHOOD × PRIOR / EVIDENCE

  P(class | features):  what we want — probability of this class given what we see.
  P(features | class):  how likely are these features if the class is X? (Learned from data)
  P(class):             how common is this class overall? (Base rate)
  P(features):          a normalization constant — same for all classes, so we can ignore it.

DECISION RULE: pick the class with the highest posterior:
  y_hat = argmax_k [ P(features | class=k) * P(class=k) ]

This is called the Maximum A Posteriori (MAP) estimate.`},
      {heading:"The Naive Assumption — Independence", body:`Computing P(x1, x2, ..., xn | class) is hard — it requires modeling all feature interactions, and with many features, this requires exponentially more data.

Naive Bayes makes a heroic simplifying assumption:

  All features are conditionally independent given the class.

This means:
  P(x1, x2, ..., xn | class) = P(x1 | class) × P(x2 | class) × ... × P(xn | class)

Now we only need to learn P(xi | class) for each individual feature — n separate one-dimensional distributions, not one giant n-dimensional distribution.

WHY IT'S NAIVE:
  This assumption is almost never true. "The email is about money" and "the email uses the word 'transfer'" are obviously not independent.

WHY IT WORKS ANYWAY:
  Even though the joint probability is wrong, the ranking of classes (which has the highest posterior) is often correct.
  If P(class=spam | features) > P(class=ham | features) consistently, the decision is right even if the absolute probabilities are off.
  
  The naive assumption is catastrophically wrong for estimating calibrated probabilities. For ranking classes to make a decision — surprisingly effective.`},
      {heading:"Three Variants — Gaussian, Multinomial, Bernoulli", body:`The three main variants differ in what distribution they use to model P(xi | class):

GAUSSIAN NAIVE BAYES:
  For continuous features.
  Assumes each feature follows a Gaussian (normal) distribution within each class.
  
  P(xi | class=k) = (1/√(2π σ²_ki)) * exp(-(xi - μ_ki)² / (2 σ²_ki))
  
  During training: learn the mean (μ) and variance (σ²) of each feature per class.
  During prediction: plug in xi, compute the Gaussian probability density.
  
  Use for: continuous numeric features, especially when they're roughly bell-shaped.

MULTINOMIAL NAIVE BAYES:
  For count data — typically word frequencies in text.
  
  P(word | class=k) = count(word in class k docs + α) / (total words in class k + α*V)
  
  α is the Laplace smoothing parameter (see next section).
  Use for: text classification, document categorization, bag-of-words features.

BERNOULLI NAIVE BAYES:
  For binary features — whether a feature is present (1) or absent (0).
  
  P(xi | class=k) = p_ki^xi * (1-p_ki)^(1-xi)
  
  Use for: binary text features (word present/absent, not word count), spam detection with binary features, any boolean feature space.`},
      {heading:"Laplace Smoothing — Handling Unseen Features", body:`Consider training a spam filter on email data. The word "cryptocurrency" never appears in your training emails.

Now you receive an email with "cryptocurrency." The Multinomial model computes:
  P(word="cryptocurrency" | spam) = 0

Zero probability! And any class probability multiplied by zero is zero.

PROBLEM: one unseen word zeroes out the entire prediction.

LAPLACE SMOOTHING (add-one smoothing):
  Instead of using raw counts, add a small constant α (typically 1):
  
  P(xi | class=k) = (count(xi in class k) + α) / (total in class k + α * V)
  
  where V = vocabulary size.

Effect:
  - No word ever gets probability zero, even if unseen.
  - Unseen words get a small, shared probability mass.
  - Common words are minimally affected — α=1 is small relative to their counts.

α is a hyperparameter: α=1 (Laplace), α<1 (Lidstone), or tuned via cross-validation.`},
      {heading:"When Naive Bayes Wins", body:`Despite its naive assumption, Naive Bayes is a serious production algorithm. It's not just a teaching example.

NAIVE BAYES WORKS WELL WHEN:
  HIGH-DIMENSIONAL, SPARSE DATA (Text classification):
    Text has thousands of features (words). Most are zero for any document.
    The independence assumption handles sparse data gracefully.
    Competing algorithms struggle with the dimensionality; NB thrives.
  
  SMALL TRAINING DATA:
    Models with many parameters need many examples.
    Naive Bayes only learns one distribution per feature per class — very data efficient.
    With 100 samples and 1000 features, NB can still work reasonably.
  
  REAL-TIME PREDICTION:
    Training is O(n * d). Prediction is O(K * d) — extremely fast.
    Perfect for high-throughput classification.

NAIVE BAYES FAILS WHEN:
  - Features are heavily correlated (independence assumption breaks down hard).
  - You need well-calibrated probabilities (the outputs are often overconfident).
  - Continuous features have complex non-Gaussian distributions (Gaussian NB suffers).
  - You have abundant data — better models will dominate with enough examples.

THE CLASSIC USE CASE: spam filtering.
  Email spam detection was one of NB's first real-world successes.
  It's still used as part of modern spam filters today.`}
    ],
    keyPoints:[
      {title:"Bayes' Theorem",body:"P(class|features) ∝ P(features|class) × P(class)\nPosterior ∝ Likelihood × Prior\nPick class with highest posterior (MAP estimate)."},
      {title:"The Naive Assumption",body:"All features are conditionally independent given the class.\nAlmost never true — but classification accuracy is often still good.\nFails when features are heavily correlated."},
      {title:"Three Variants",body:"Gaussian: continuous features, assumes normal distribution per class.\nMultinomial: count features (word frequencies in text).\nBernoulli: binary features (word present/absent)."},
      {title:"Laplace Smoothing",body:"Add α to all counts to prevent zero probabilities.\nP(xi|class) = (count + α) / (total + α × V)\nOne unseen word shouldn't zero out the entire prediction."},
      {title:"Where It Excels",body:"Text classification: high-dim, sparse, many features.\nSmall training sets: very data-efficient.\nReal-time systems: training and prediction are both very fast."},
      {title:"Limitations",body:"Poor calibrated probabilities — often overconfident.\nAssumes feature independence — breaks down with correlated features.\nStrong alternatives exist when data is abundant."}
    ],
    watchOut:"Never trust Naive Bayes output probabilities as calibrated confidence estimates. The independence assumption means the probabilities are often extreme (very close to 0 or 1). For well-calibrated probabilities, use logistic regression or apply Platt scaling post-hoc. NB's strength is in its rankings, not its probability values.",
    questions:[
      {q:"Bayes' theorem gives P(class | features) = P(features | class) × P(class) / P(features). Why can we ignore P(features) when choosing the predicted class?",opts:["P(features) is always 1 for valid probability distributions","P(features) is the same for all classes — it doesn't affect which class has the highest posterior","P(features) is computed automatically by the algorithm","P(features) cancels out because we normalize at the end"],ans:1,exp:"P(features) is the marginal probability of observing those features — it's a constant that doesn't depend on the class. Since we're comparing P(class=k | features) across classes, and P(features) is the same denominator for all, we can drop it and just find argmax_k P(features|class=k) × P(class=k)."},
      {q:"What is the 'naive' in Naive Bayes?",opts:["The algorithm is simpler than Bayesian Networks","It assumes all features are conditionally independent given the class label","It doesn't use Laplace smoothing by default","It ignores the prior probability of each class"],ans:1,exp:"Naive Bayes assumes P(x1,x2,...,xn|class) = P(x1|class) × P(x2|class) × ... — all features are independent given the class. This assumption is 'naive' because it's almost never true, yet the algorithm still performs surprisingly well in practice."},
      {q:"You train a Multinomial Naive Bayes spam filter. It encounters the word 'cryptocurrency' never seen in training. Without smoothing, what happens?",opts:["The word gets a probability of 0.5 (unknown features get the default probability)","The prediction defaults to the prior class probability","P(word|class)=0 for all classes, making all class probabilities zero — prediction fails","The word is ignored and removed from the feature vector"],ans:2,exp:"Without smoothing, an unseen word has count=0, giving P(word|class)=0. The product P(features|class) includes this zero, zeroing out the entire class probability. Since all classes get probability 0, prediction breaks down. Laplace smoothing prevents this."},
      {q:"Which Naive Bayes variant is best suited for classifying email text using word counts?",opts:["Gaussian Naive Bayes","Bernoulli Naive Bayes","Multinomial Naive Bayes","Logistic Naive Bayes"],ans:2,exp:"Multinomial NB models P(word|class) as a categorical distribution over word counts — exactly what bag-of-words text features represent. Gaussian NB assumes continuous, normally distributed features. Bernoulli NB handles binary word presence/absence, not counts."},
      {q:"Naive Bayes is especially strong when:",opts:["Training data is abundant and features are heavily correlated","You need perfectly calibrated output probabilities","Data is sparse and high-dimensional (like text) and training examples are few","The decision boundary between classes is linear"],ans:2,exp:"NB's independence assumption handles sparse high-dimensional data efficiently — it learns one distribution per feature per class, not a joint distribution. It's data-efficient (works with few examples) and fast. With abundant data and correlated features, better models dominate."},
      {q:"What does the prior P(class) represent in Naive Bayes?",opts:["The model's confidence in a specific prediction","The probability of observing a particular set of features","The base rate of each class in the training data","The likelihood of the features given the class"],ans:2,exp:"P(class=k) is the prior — the probability of class k before observing any features. It's estimated from class frequencies in training data. If 80% of training emails are spam, P(spam)=0.8. The prior anchors predictions toward the more common class."},
      {q:"Why does Naive Bayes produce poorly calibrated probabilities (often near 0 or 1)?",opts:["It doesn't apply the sigmoid function to outputs","Multiplying many small probabilities amplifies any deviation — the independence assumption creates overconfident posteriors","Laplace smoothing artificially inflates confidence","It uses the MAP estimate rather than the full Bayesian posterior"],ans:1,exp:"The product P(x1|class) × P(x2|class) × ... multiplies many probabilities together. With the independence assumption, this product can become extremely small or large relative to other classes, pushing the posterior to near 0 or 1. Even small violations of independence compound across features."},
      {q:"Laplace smoothing with α=1 adds what to each feature count?",opts:["1 to both the numerator count and denominator total","1 to the count and V (vocabulary size) to the denominator, where V is the number of unique features","1 to all probabilities and normalizes","The class prior probability divided by the number of features"],ans:1,exp:"Laplace smoothing: P(xi|class=k) = (count(xi,k) + 1) / (total_k + V). Adding 1 to the numerator ensures no count is zero. Adding V to the denominator maintains a valid probability distribution (all probabilities for a class still sum to 1)."}
    ]
  }
},
// ── 10: SUPPORT VECTOR MACHINES ─────────────
{
  id:'svm', label:'Support Vector Machines', color:'#1A3D5C',
  content:{
    definition:"A classifier that finds the maximum-margin hyperplane separating two classes — and uses the kernel trick to handle non-linear boundaries by implicitly mapping data to higher-dimensional spaces.",
    explanation:[
      {heading:"The Big Idea — Maximum Margin", body:`Logistic regression finds any boundary that separates classes reasonably well. SVM finds the boundary that maximizes the margin — the gap between the boundary and the closest training points.

Imagine two clusters of points — red and blue. Many lines could separate them. SVM finds the one that keeps the largest possible distance to the nearest points of each class.

WHY MAXIMUM MARGIN?
  Large margin → the classifier is farther away from all training points → more "room" to be wrong on new data without flipping a prediction.
  Mathematically: maximizing margin minimizes the worst-case classification error on new points.
  
  Small-margin classifiers sit dangerously close to some training points.
  New data near those points gets misclassified easily.
  The maximum-margin classifier is the most cautious and generalizes better.

This is a genuinely different principle from logistic regression's probability matching.`},
      {heading:"Support Vectors — What They Are", body:`Support vectors are the training points that define the margin — the points closest to the decision boundary.

THE GEOMETRY:
  Decision boundary (hyperplane): w·x + b = 0
  Margin boundaries (gutters): 
    w·x + b = +1  (nearest positive points)
    w·x + b = -1  (nearest negative points)
  
  Margin width = 2 / ||w||

  MAXIMIZING MARGIN means minimizing ||w||.
  This is a convex quadratic optimization problem — solvable exactly.

CRUCIAL INSIGHT:
  Only support vectors matter. The rest of the training data could be removed without changing the decision boundary.
  
  If you add training points that are far from the boundary, the SVM doesn't change.
  Only the points on or near the margin (support vectors) determine the classifier.
  
  This makes SVMs robust to non-support-vector points — a property no other algorithm has.`},
      {heading:"Hard vs. Soft Margin — The C Parameter", body:`HARD MARGIN:
  Requires all training points to be on the correct side of the margin.
  Works only if the data is linearly separable.
  Completely fails if any point is on the wrong side (unsatisfiable constraint).
  Extremely sensitive to outliers — one mislabeled point breaks the whole model.

SOFT MARGIN (C-SVM):
  Allows some points to violate the margin. Each violation costs a penalty.
  
  The optimization becomes:
    Minimize: ||w||² + C × Σ ξi
    
    where ξi (slack) = how much point i violates the margin.
  
  C IS THE KEY HYPERPARAMETER:
    Large C:  violation is very expensive → try hard to classify correctly → narrow margin, more support vectors, risk of overfitting.
    Small C:  violation is tolerable → wide margin, fewer support vectors, more regularization.
  
  C controls the bias-variance tradeoff:
    Large C: low bias, high variance (overfitting risk).
    Small C: high bias, low variance (underfitting risk).
  
  Always tune C via cross-validation. Typical range: C = 0.001 to 1000 on log scale.`},
      {heading:"The Kernel Trick — Going Non-Linear", body:`Hard and soft margin SVMs find linear boundaries. Real data often isn't linearly separable.

NAIVE APPROACH: transform features to a higher-dimensional space.
  Example: add polynomial features x1², x2², x1*x2, etc.
  A linear boundary in this higher space becomes a curve in original space.
  
  Problem: high-dimensional feature spaces are computationally expensive.
  With 100 features and degree-3 polynomials: ~100³ = 1 million transformed features.

THE KERNEL TRICK:
  SVM's math only requires the dot product of feature vectors: K(xi, xj) = φ(xi)·φ(xj)
  
  Kernel functions compute this dot product in the transformed space directly,
  WITHOUT explicitly constructing the high-dimensional features:
  
  LINEAR KERNEL:      K(a,b) = a·b
  POLYNOMIAL KERNEL:  K(a,b) = (a·b + c)^d
  RBF (Gaussian) KERNEL: K(a,b) = exp(-γ||a-b||²)

  RBF maps data to infinite-dimensional space — yet computing K(a,b) is O(d).
  You get the power of infinite features for the cost of computing a single number.

RBF KERNEL:
  γ controls the influence of each training point:
    Large γ: nearby points only → complex, tight boundaries → overfitting risk.
    Small γ: distant points influence → smooth boundaries → underfitting risk.
  
  For RBF kernel: tune BOTH C and γ via grid search.`},
      {heading:"When to Use SVM", body:`SVM WORKS WELL WHEN:
  HIGH-DIMENSIONAL FEATURE SPACES:
    SVM is effective even when d > n (more features than samples).
    Text classification, genomics, image features — classic SVM territory.
    The kernel trick handles this efficiently.
  
  SMALL-TO-MEDIUM DATASETS:
    SVM's training complexity is O(n²) to O(n³) in the number of samples.
    Works well up to tens of thousands of samples.
    For millions of samples, training becomes impractically slow.
  
  CLEAR MARGIN OF SEPARATION:
    When classes are clearly separable (or nearly so), SVM performs excellently.
    Maximum margin principle makes it especially robust in these cases.

SVM STRUGGLES WHEN:
  LARGE DATASETS: O(n²-n³) training makes it slow on millions of samples.
  NOISY OVERLAPPING CLASSES: many support vectors, C tuning becomes critical.
  PROBABILITY CALIBRATION: SVM doesn't naturally output probabilities.
    Workaround: Platt scaling (logistic regression on SVM outputs). Expensive.

PRACTICAL POSITIONING:
  Before deep learning, SVM was state-of-the-art for text, images, and bioinformatics.
  Today: gradient boosting (XGBoost/LightGBM) dominates tabular data.
  SVM with RBF kernel remains competitive for small, clean, well-scaled datasets.`}
    ],
    keyPoints:[
      {title:"Maximum Margin",body:"Finds the hyperplane that maximizes the gap between classes.\nLarger margin → more robust to new data.\nConvex optimization → always finds the global optimum."},
      {title:"Support Vectors",body:"The training points on the margin boundaries.\nOnly support vectors define the decision boundary — others could be removed.\nMakes SVM robust to non-support-vector points."},
      {title:"C Parameter (Soft Margin)",body:"C = penalty for margin violations.\nLarge C: tight margin, tries to classify all correctly → overfitting risk.\nSmall C: wide margin, allows violations → more regularization.\nAlways tune C with cross-validation."},
      {title:"Kernel Trick",body:"Compute dot products in a transformed space without materializing it.\nRBF kernel: exp(-γ||a-b||²) — maps to infinite dimensions.\nAllows non-linear decision boundaries with no extra cost."},
      {title:"γ Parameter (RBF Kernel)",body:"Controls influence radius of each training point.\nLarge γ: complex local boundaries → overfitting.\nSmall γ: smooth global boundaries → underfitting.\nTune jointly with C via grid search."},
      {title:"When SVM Wins",body:"High-dimensional data (text, genomics, images).\nSmall datasets where n << 1M.\nClear class separation.\nWhen you need the global optimum guaranteed (convex problem)."}
    ],
    watchOut:"Always scale features before SVM — it's even more critical here than for KNN. SVMs are computationally expensive: training scales as O(n²) to O(n³), and prediction requires computing kernel evaluations against all support vectors. For large datasets (>100k samples), consider LinearSVC or switch to gradient boosting, which typically outperforms SVM on tabular data anyway.",
    questions:[
      {q:"What principle does SVM use to choose its decision boundary?",opts:["Minimizing the total number of misclassifications on training data","Maximizing the probability of correct classification using a sigmoid function","Maximizing the margin — the gap between the boundary and the closest points of each class","Minimizing cross-entropy loss over the training distribution"],ans:2,exp:"SVM finds the hyperplane that maximizes the margin — the perpendicular distance between the boundary and the nearest training points (support vectors) of each class. Maximum margin implies maximum robustness to small perturbations in the data."},
      {q:"What are support vectors?",opts:["All training points used to compute the decision boundary","Only the training points that lie on or within the margin boundaries","The weight vectors defining the hyperplane","Points on the wrong side of the decision boundary"],ans:1,exp:"Support vectors are the training points closest to the decision boundary — those lying exactly on the margin hyperplanes (w·x + b = ±1). Only these points define the boundary. All other training points could be removed without changing the SVM's decision boundary."},
      {q:"In SVM, setting C to a very large value:",opts:["Widens the margin to allow more training points to be correctly classified","Creates a larger set of support vectors and a narrower margin, risking overfitting","Applies stronger regularization, simplifying the decision boundary","Has no effect — C only affects training speed"],ans:1,exp:"Large C makes margin violations very expensive. The optimizer tries hard to classify all points correctly, resulting in a narrow margin and more support vectors. The model is more complex and sensitive to training data — overfitting risk increases."},
      {q:"What is the kernel trick?",opts:["A method to reduce the number of support vectors","Computing dot products in a high-dimensional transformed space without explicitly constructing it","A technique to speed up SVM training by reducing the training set","Using polynomial features to increase the number of dimensions before training"],ans:1,exp:"The kernel trick: SVM's math only needs K(xi,xj) = φ(xi)·φ(xj) — the dot product in transformed space. Kernel functions compute this directly without materializing the high-dimensional feature vectors. RBF maps to infinite dimensions but computing K takes O(d) time."},
      {q:"The RBF kernel parameter γ controls:",opts:["The regularization strength — equivalent to 1/C","How many support vectors are created","The influence radius of each training point: large γ = local boundaries, small γ = smooth global boundaries","The degree of the polynomial mapping implicitly applied to the data"],ans:2,exp:"Large γ: each training point influences only nearby predictions → complex, jagged boundaries → overfitting. Small γ: points influence a wide area → smooth, simple boundaries → underfitting. Tune γ jointly with C using grid search."},
      {q:"When is SVM a poor choice compared to gradient boosting on tabular data?",opts:["When the dataset has more features than samples (d > n)","When you need a guaranteed global optimum","When the dataset has millions of samples (SVM training is O(n²-n³))","When the problem is text classification with sparse features"],ans:2,exp:"SVM training complexity is O(n²) to O(n³) in the number of samples. For millions of samples, this is impractically slow. Modern gradient boosting methods (XGBoost, LightGBM) train in O(n log n) and typically match or outperform SVM on large tabular datasets."},
      {q:"Unlike logistic regression, a trained SVM does NOT naturally output:",opts:["A predicted class label","Calibrated probability estimates for each class","A decision boundary in feature space","Feature coefficients (weights)"],ans:1,exp:"SVMs output the class label and a margin-based score (signed distance to the boundary), but not calibrated probabilities. To get probabilities, you need Platt scaling — fitting a logistic regression on SVM outputs — which is computationally expensive. Logistic regression outputs calibrated probabilities directly."},
      {q:"Why is feature scaling especially critical for SVM?",opts:["SVM requires features to be normally distributed before training","The margin computation and kernel evaluations are distance/dot-product based — features on different scales distort the geometry","SVM's kernel trick only works when all features are in [0,1]","Scaling reduces the number of support vectors, speeding up prediction"],ans:1,exp:"SVM geometry is entirely based on distances and dot products. Features with large ranges dominate the margin computation and kernel evaluations. An unscaled SVM effectively builds its margin based on whichever feature has the largest values. Always standardize before SVM."}
    ]
  }

// ── 11: ENSEMBLE METHODS ────────────────────
{
  id:'ensemble', label:'Ensemble Methods', color:'#5C1A1A',
  content:{
    definition:"Techniques that combine multiple models to produce predictions stronger than any single model — by canceling individual errors through diversity, sequential correction, or learned combination.",
    explanation:[
      {heading:"Why One Model Isn't Enough", body:`The core insight of ensemble methods: diverse models make different mistakes. If you combine them, their errors cancel.

A simple analogy: asking one expert might give a good answer. Asking 100 diverse experts and taking the majority opinion is almost always better — as long as they're not all wrong in the same way.

The two requirements for ensembles to work:
  1. ACCURACY: each individual model must be better than random guessing.
  2. DIVERSITY: models must disagree — make different errors on different examples.

If all models are identical (same algorithm, same data, same hyperparameters), averaging them does nothing. Diversity is the key ingredient.

THREE STRATEGIES FOR CREATING DIVERSITY:
  BAGGING:    different data subsets (same algorithm in parallel).
  BOOSTING:   sequential correction — each model learns from prior errors.
  STACKING:   different algorithms, combined by a meta-learner.

Random Forest (Chapter 5) is bagging applied to decision trees.
This chapter focuses on Boosting and Stacking — where the real gains happen.`},
      {heading:"Bagging — Parallel Diversity", body:`You already know Bagging from Random Forest (Chapter 5). The principle generalizes.

BAGGING (Bootstrap AGGregating):
  1. Create B bootstrap samples (sampling with replacement from training data).
  2. Train a separate model on each bootstrap sample.
  3. Prediction: average (regression) or majority vote (classification).

THE KEY: each model trains on a different random subset of the data.
  Different data → different models → different errors → averaging cancels errors.

VARIANCE REDUCTION:
  If B models each have variance σ² and their errors are uncorrelated:
    Var(average) = σ² / B
  Averaging B models reduces variance by B-fold.
  
  This is why adding more trees to a Random Forest always helps (up to diminishing returns).

BEYOND RANDOM FOREST:
  Bagging works with any base learner — though it's most effective with high-variance models (deep trees, neural networks).
  With low-variance models (linear regression), bagging provides minimal improvement.`},
      {heading:"Boosting — Sequential Error Correction", body:`Boosting takes the opposite approach to bagging: instead of training models in parallel on different data, it trains them sequentially, with each new model focusing on the mistakes of the previous ones.

THE CORE PRINCIPLE:
  1. Train a weak model (barely better than random).
  2. Find training points the model got wrong.
  3. Train the next model to focus on those mistakes.
  4. Repeat. Each model corrects the combined ensemble's weaknesses.
  5. Final prediction: weighted combination of all models.

ADABOOST (Adaptive Boosting):
  After each round, increase the weight of misclassified samples.
  The next model is trained on the re-weighted dataset — forced to focus on hard cases.
  Final prediction: weighted vote where better models get more say.
  
  Great for: boosting simple classifiers (stumps) on clean data.
  Weakness: sensitive to noisy data and outliers (misclassified outliers get infinite weight).

GRADIENT BOOSTING:
  Frames boosting as gradient descent in function space.
  Each new tree fits the residuals (errors) of the ensemble so far.
  
  Algorithm:
    Initialize: F0(x) = best constant (mean of y for regression).
    For m = 1, 2, ..., M:
      Compute residuals: ri = yi - Fm-1(xi)
      Fit a new tree to the residuals.
      Update: Fm(x) = Fm-1(x) + η * hm(x)
    
    η = learning rate. Small η = more conservative, often better generalization.
  
  This is gradient descent, but instead of updating parameters, we're adding trees.`},
      {heading:"XGBoost and LightGBM — Practical Gradient Boosting", body:`Plain gradient boosting is powerful but slow. XGBoost and LightGBM dominate Kaggle competitions and real-world tabular ML.

XGBOOST (Extreme Gradient Boosting):
  Adds regularization (L1/L2) to each tree — reduces overfitting.
  Uses second-order gradient information (Newton's method) for faster, more accurate optimization.
  Parallel tree construction — fast despite sequential model construction.
  Handles missing values natively — learns the best direction for missing features.

LIGHTGBM:
  Histogram-based splitting: bins continuous features into discrete buckets.
    Instead of evaluating every split point: evaluate one per bucket.
    Dramatically faster than XGBoost on large datasets.
  
  Leaf-wise tree growth (vs. XGBoost's level-wise):
    LightGBM grows the leaf that reduces loss most, not the full next level.
    Produces deeper, more asymmetric trees. Better fit for same number of leaves.
    Risk: can overfit more on small datasets.

KEY HYPERPARAMETERS (both):
  n_estimators:    number of trees. More = better, up to overfitting.
  learning_rate:   shrinks each tree's contribution. Lower = better, needs more trees.
  max_depth:       depth per tree. Shallower = more regularization.
  min_child_weight: minimum samples per leaf. Higher = more regularization.
  subsample:       fraction of data per tree (like bagging within boosting).
  colsample_bytree: fraction of features per tree (like Random Forest's random features).

GENERAL RULE: XGBoost/LightGBM + tuning ≈ state of the art for tabular data.`},
      {heading:"Stacking — Let the Data Choose", body:`Bagging: same algorithm, different data.
Boosting: sequential correction.
Stacking: different algorithms, combined by a meta-learner.

THE STACKING ARCHITECTURE:
  LEVEL 0 — BASE LEARNERS:
    Train several diverse models on training data:
    e.g., Logistic Regression, Random Forest, XGBoost, KNN, SVM.
    Each model has different strengths and failure modes.
    Diversity is crucial — don't stack 5 gradient boosters.

  LEVEL 1 — META-LEARNER:
    Collect predictions from all base learners as new features.
    Train a second-level model (usually Logistic Regression or Ridge) to combine them.
    The meta-learner learns: "when model A is confident and model B disagrees, trust A."

AVOIDING LEAKAGE — OUT-OF-FOLD PREDICTIONS:
  The meta-learner cannot train on the same data as the base learners.
  Solution: use K-fold cross-validation to generate training examples for the meta-learner.
  Each training point is predicted by base learners that never saw it.
  
  This prevents the meta-learner from simply memorizing which base learner overfits on which points.

STACKING IN PRACTICE:
  Used heavily in Kaggle competition winners.
  Real production systems favor simpler solutions — stacking adds complexity and fragility.
  When it works: combines complementary model strengths into a stronger ensemble.`},
      {heading:"Choosing the Right Ensemble", body:`QUICK GUIDE:

  RANDOM FOREST:
    Your first stop. Fast to train, minimal tuning, solid performance.
    Built-in feature importance. Robust and interpretable.
    When: general tabular classification/regression, need a strong baseline fast.

  GRADIENT BOOSTING (XGBoost / LightGBM):
    When you need best-possible performance on tabular data.
    More tuning required. Sensitive to learning rate and number of trees.
    When: competition setting, after Random Forest gives a baseline, large datasets.

  ADABOOST:
    Simple, interpretable. Good for clean data with weak base learners.
    Avoid when: data is noisy or outlier-heavy.

  STACKING:
    Maximum performance, maximum complexity.
    Requires careful out-of-fold scheme to avoid leakage.
    When: Kaggle finals, production systems with mature pipelines and high stakes.

THE GENERAL ADVICE:
  Start with Random Forest. If you need more, move to XGBoost/LightGBM.

    return 1 / (1 + math.exp(-z))

def binary_cross_entropy(y_true, y_pred):
    n = len(y_true)
    eps = 1e-9  # prevent log(0)
    return -sum(
        y_true[i] * math.log(y_pred[i] + eps) +
        (1 - y_true[i]) * math.log(1 - y_pred[i] + eps)
        for i in range(n)

        dw2 = sum((probs[i]-y[i])*X[i][1] for i in range(n))/n
        db  = sum(probs[i]-y[i] for i in range(n))/n

random.seed(0)

def poly_features(x, degree):
    return [x**i for i in range(degree+1)]

def fit_poly(X, y, degree):
    # Simple normal equation for small problems
    n = len(X)
    d = degree + 1
    F = [poly_features(x, degree) for x in X]
    # Gram matrix (FtF) and FtY
    FtF = [[sum(F[i][a]*F[i][b] for i in range(n)) for b in range(d)] for a in range(d)]
    FtY = [sum(F[i][a]*y[i] for i in range(n)) for a in range(d)]
    # Gaussian elimination
    mat = [FtF[r][:]+[FtY[r]] for r in range(d)]
    for col in range(d):
        pivot = max(range(col,d), key=lambda r: abs(mat[r][col]))
        mat[col],mat[pivot] = mat[pivot],mat[col]
        for r in range(d):
            if r != col and mat[col][col] != 0:
                factor = mat[r][col]/mat[col][col]
                mat[r] = [mat[r][c]-factor*mat[col][c] for c in range(d+1)]
    return [mat[r][d]/mat[r][r] if mat[r][r]!=0 else 0 for r in range(d)]

def predict(x, coefs):

  {title:"Decision Tree Split: Gini Impurity",
  desc:"Implement Gini impurity and find the best split threshold for a single feature.",
  template:`def gini(labels):
    if not labels: return 0
    n = len(labels)
    counts = {}
    for l in labels:
        counts[l] = counts.get(l, 0) + 1
    return 1 - sum((c/n)**2 for c in counts.values())

def best_split(X, y):
    best_gain, best_thresh = -1, None
    parent_gini = gini(y)
    n = len(y)
    thresholds = sorted(set(X))
    for thresh in thresholds:
        left  = [y[i] for i in range(n) if X[i] <= thresh]
        right = [y[i] for i in range(n) if X[i] >  thresh]
        if not left or not right: continue
        weighted = (len(left)/n)*gini(left) + (len(right)/n)*gini(right)
        gain = parent_gini - weighted
        if gain > best_gain:
            best_gain, best_thresh = gain, thresh
    return best_thresh, best_gain

def euclidean(a, b):

    dot  = sum(ai*bi for ai,bi in zip(a,b))
    norm_a = math.sqrt(sum(ai**2 for ai in a))
    norm_b = math.sqrt(sum(bi**2 for bi in b))

random.seed(42)

def dist(a, b):
    return math.sqrt(sum((ai-bi)**2 for ai,bi in zip(a,b)))

def kmeans(X, k, max_iter=100):
    # K-Means++ initialization
    centroids = [random.choice(X)[:]]
    for _ in range(k-1):
        dists = [min(dist(x,c) for c in centroids)**2 for x in X]
        total = sum(dists)
        r = random.random() * total
        cumulative = 0
        for i,d in enumerate(dists):
            cumulative += d
            if cumulative >= r:
                centroids.append(X[i][:])
                break

    for iteration in range(max_iter):
        # Assign
        labels = [min(range(k), key=lambda c: dist(x, centroids[c])) for x in X]
        # Recompute centroids
        new_centroids = []
        for c in range(k):
            pts = [X[i] for i in range(len(X)) if labels[i]==c]
            if pts:
                new_centroids.append([sum(p[d] for p in pts)/len(pts) for d in range(len(X[0]))])
            else:
                new_centroids.append(centroids[c][:])
        if new_centroids == centroids: break
        centroids = new_centroids
    inertia = sum(dist(X[i], centroids[labels[i]])**2 for i in range(len(X)))
    return labels, centroids, inertia

  {title:"Gaussian Naive Bayes from Scratch",
  desc:"Implement Gaussian NB: learn per-class mean and variance, then predict using Bayes' theorem.",
  template:`import math

def gaussian_prob(x, mean, var):
    if var == 0: return 1.0 if x == mean else 0.0
    return (1/math.sqrt(2*math.pi*var)) * math.exp(-(x-mean)**2 / (2*var))

class GaussianNB:
    def fit(self, X, y):
        self.classes = list(set(y))
        n = len(y)
        self.priors = {c: y.count(c)/n for c in self.classes}
        self.stats = {}
        for c in self.classes:
            pts = [X[i] for i in range(n) if y[i]==c]
            d = len(pts[0])
            means, vars_ = [], []
            for j in range(d):
                col = [p[j] for p in pts]
                m = sum(col)/len(col)
                v = sum((x-m)**2 for x in col)/len(col)
                means.append(m); vars_.append(v)
            self.stats[c] = (means, vars_)

    def predict(self, X):
        results = []
        for x in X:
            best_class, best_score = None, float('-inf')
            for c in self.classes:
                means, vars_ = self.stats[c]
                log_prob = math.log(self.priors[c])
                for j in range(len(x)):
                    p = gaussian_prob(x[j], means[j], vars_[j])
                    log_prob += math.log(p + 1e-300)
                if log_prob > best_score:
                    best_score, best_class = log_prob, c
            results.append(best_class)
        return results

# Iris-like: sepal length, petal length, class

nb.fit(X, y)

preds = nb.predict(X)
acc = sum(p==a for p,a in zip(preds,y))/len(y)
print(f"Training accuracy: {acc:.0%}")
print()
print("Per-class statistics:")
for c in nb.classes:

    print(f"  Class {c}: sepal_mean={means[0]:.2f} petal_mean={means[1]:.2f} (prior={nb.priors[c]:.2f})")

'ensemble':[
  {title:"Gradient Boosting on Residuals",
  desc:"Implement the core gradient boosting loop: fit a stump to residuals, update the ensemble.",
  template:`import math

def mean(vals): return sum(vals)/len(vals) if vals else 0

def stump_fit(X, residuals):
    """Fit a depth-1 tree (stump) to predict residuals."""
    best_thresh, best_val_l, best_val_r, best_loss = None, 0, 0, float('inf')
    thresholds = sorted(set(X))
    for thresh in thresholds:
        left  = [residuals[i] for i in range(len(X)) if X[i] <= thresh]
        right = [residuals[i] for i in range(len(X)) if X[i] >  thresh]
        if not left or not right: continue
        loss = sum((r - mean(left))**2 for r in left) + \
               sum((r - mean(right))**2 for r in right)
        if loss < best_loss:
            best_loss = loss
            best_thresh = thresh
            best_val_l = mean(left)
            best_val_r = mean(right)
    return best_thresh, best_val_l, best_val_r

def stump_predict(x, thresh, val_l, val_r):
    return val_l if x <= thresh else val_r

# Regression: x → y = x² (noisy)
import random; random.seed(7)
X = [i*0.5 for i in range(1, 13)]
y = [x**2 + random.gauss(0, 1) for x in X]

# Gradient Boosting loop
lr = 0.3
F = [mean(y)] * len(X)  # initial prediction: mean of y
stumps = []

print(f"Initial prediction (mean): {mean(y):.2f}")
print(f"{'Iter':>5} {'RMSE':>8}  Stump threshold")
print("-"*40)

for iteration in range(8):
    residuals = [y[i] - F[i] for i in range(len(X))]
    rmse = math.sqrt(mean([r**2 for r in residuals]))
    thresh, vl, vr = stump_fit(X, residuals)
    stumps.append((thresh, vl, vr))
    # Update ensemble
    updates = [stump_predict(x, thresh, vl, vr) for x in X]
    F = [F[i] + lr * updates[i] for i in range(len(X))]
    print(f"{iteration+1:>5} {rmse:>8.3f}  x <= {thresh} → {vl:.2f}, else → {vr:.2f}")

print()
print("Final predictions vs actual:")
for x,pred,actual in list(zip(X,F,y))[:6]:
    print(f"  x={x:.1f}: predicted={pred:.2f}, actual={actual:.2f}")`}
]

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let currentTopic = 0;
let currentTab   = 'explain';
let quizState    = {};   // topicId → {idx, answers, score}
let editors      = {};   // key → CodeMirror instance
let started      = {};   // topicId → bool

// ─────────────────────────────────────────────
//  RENDER SIDEBAR
// ─────────────────────────────────────────────
function renderNav() {
  const nav = document.getElementById('navList');
  nav.innerHTML = topics.map((t,i) => `
    <div class="nav-item${i===currentTopic?' active':''}" onclick="selectTopic(${i})">
      <span class="nav-num">${String(i).padStart(2,'0')}</span>
      <span class="nav-dot" style="background:${t.color}"></span>
      <span class="nav-label">${t.label}</span>
    </div>`).join('');
  const n = Object.keys(started).length;
  document.getElementById('progressBar').style.width = (n/topics.length*100)+'%';
  document.getElementById('progressLabel').textContent = `${n} / ${topics.length} chapters started`;
}

// ─────────────────────────────────────────────
//  RENDER MAIN CONTENT
// ─────────────────────────────────────────────
function renderMain() {
  const t = topics[currentTopic];
  const c = t.content;
  started[t.id] = true;

  const hasChallenges = !!(codingChallenges[t.id] && codingChallenges[t.id].length);

  document.getElementById('mainContent').innerHTML = `
    <div class="topic-header">
      <div class="topic-tag"><span class="topic-dot" style="background:${t.color}"></span>Chapter ${String(currentTopic).padStart(2,'0')}</div>
      <div class="topic-title">${t.label}</div>
      <div class="topic-def">${c.definition}</div>
    </div>
    <div class="tabs">
      <div class="tab${currentTab==='explain'?' active':''}" onclick="switchTab('explain')">Deep Dive</div>
      <div class="tab${currentTab==='review'?' active':''}" onclick="switchTab('review')">Key Points</div>
      <div class="tab${currentTab==='practice'?' active':''}" onclick="switchTab('practice')">Practice Quiz</div>
      ${hasChallenges?`<div class="tab${currentTab==='coding'?' active':''}" onclick="switchTab('coding')">Coding</div>`:''}
    </div>
    <div id="tab-explain"  class="tab-content${currentTab==='explain'?' active':''}">
      ${renderExplain(c)}
    </div>
    <div id="tab-review"   class="tab-content${currentTab==='review'?' active':''}">
      ${renderReview(c)}
    </div>
    <div id="tab-practice" class="tab-content${currentTab==='practice'?' active':''}">
      ${renderPractice(t.id, c)}
    </div>
    ${hasChallenges?`<div id="tab-coding" class="tab-content${currentTab==='coding'?' active':''}">
      ${renderCoding(t.id)}
    </div>`:''}
  `;
  document.getElementById('mainContent').scrollTop = 0;
  if (currentTab === 'coding') initEditors(t.id);
}

// ─────────────────────────────────────────────
//  TAB RENDERERS
// ─────────────────────────────────────────────
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function isCapHeader(s) {
  // Require: starts uppercase, body is uppercase/spaces/apostrophes/digits/hyphens,
  // ends with —, -, or :, and has at least 3 uppercase letters total (avoids false positives)
  return /^[A-Z][A-Z\s'\d-]{3,}[\-—:]/.test(s) && (s.match(/[A-Z]/g)||[]).length >= 3;
}

function formatSectionBody(raw) {
  const lines = raw.split('\n');
  let html = '';
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();

    if (!trimmed) { i++; continue; }

    // Indented block → code/formula box
    if (/^  +\S/.test(line) && !isCapHeader(trimmed)) {
      const block = [];
      while (i < lines.length) {
        const l = lines[i];
        if (!l.trim()) {
          if (i+1 < lines.length && /^  +\S/.test(lines[i+1])) { block.push(''); i++; continue; }
          else break;
        }
        if (!/^  +/.test(l)) break;
        block.push(l);
        i++;
      }
      while (block.length && !block[block.length-1].trim()) block.pop();
      if (block.length) {
        const minIndent = Math.min(...block.filter(l=>l.trim()).map(l=>l.match(/^ */)[0].length));
        const dedented = block.map(l => l.slice(minIndent)).join('\n');
        html += `<div class="sb-code">${esc(dedented)}</div>`;
      }
      continue;
    }

    // ALL-CAPS header
    if (isCapHeader(trimmed)) {
      const m = trimmed.match(/^([A-Z][A-Z\s\/\-\(\)&]+?)(?:\s*[—\-:]\s*)(.*)$/);
      const tag  = m ? m[1].trim() : trimmed.replace(/[:\-—]\s*$/, '').trim();
      const desc = m ? m[2].trim() : '';
      i++;
      const bodyLines = [];
      while (i < lines.length && /^  +/.test(lines[i])) {
        bodyLines.push(lines[i].trim());
        i++;
      }
      html += `<div class="sb-item">`;
      html += `<div class="sb-item-header"><span class="sb-item-tag">${esc(tag)}</span>${desc ? `<span class="sb-item-desc">${esc(desc)}</span>` : ''}</div>`;
      if (bodyLines.length) html += `<div class="sb-item-body">${esc(bodyLines.join('\n'))}</div>`;
      html += `</div>`;
      continue;
    }

    // Plain prose
    const para = [];
    while (i < lines.length) {
      const l = lines[i];
      const t = l.trim();
      if (!t || /^  +\S/.test(l) || isCapHeader(t)) break;
      para.push(t);
      i++;
    }
    if (para.length) html += `<p class="sb-prose">${esc(para.join(' '))}</p>`;
  }

  return html;
}

function renderExplain(c) {
  return `<div class="sections">${c.explanation.map((s,i)=>`
    <div class="section" id="sec-${i}">
      <div class="section-head" onclick="toggleSection(${i})">
        <span class="section-heading">${s.heading}</span>
        <span class="section-chevron">▼</span>
      </div>
      <div class="section-body">${formatSectionBody(s.body)}</div>
    </div>`).join('')}</div>`;
}

function renderReview(c) {
  return `
    <div class="kp-grid">${c.keyPoints.map(k=>`
      <div class="kp-card">
        <div class="kp-title">${k.title}</div>
        <div class="kp-body">${k.body}</div>
      </div>`).join('')}
    </div>
    <div class="watch-out-box">
      <div class="watch-out-label">⚠ Watch Out</div>
      <div class="watch-out-text">${c.watchOut}</div>
    </div>`;
}

function renderPractice(id, c) {
  const qs = c.questions;
  if (!quizState[id]) quizState[id] = {idx:0, answers:[], score:0};
  const state = quizState[id];
  if (state.idx >= qs.length) return renderResult(id, c);
  const q = qs[state.idx];
  const answered = state.answers[state.idx] !== undefined;
  const dots = qs.map((_,i) => {
    let cls = '';
    if (i < state.answers.length && state.answers[i] !== undefined) {
      cls = state.answers[i] === qs[i].ans ? 'correct' : 'wrong';
    } else if (i === state.idx) cls = 'current';
    return `<div class="quiz-dot ${cls}"></div>`;
  }).join('');
  const opts = q.opts.map((o,i) => {
    let cls = '';
    if (answered) {
      if (i === q.ans) cls = 'correct-ans';
      else if (i === state.answers[state.idx]) cls = 'wrong-ans';
    }
    return `<div class="option${cls?' '+cls:''}" onclick="answerQuiz('${id}',${state.idx},${i})">${o}</div>`;
  }).join('');
  const expDiv = answered
    ? `<div class="explanation" id="exp" style="display:block">
        <div class="explanation-label">Why?</div>${q.exp}</div>`
    : `<div class="explanation" id="exp"></div>`;
  const nav = answered ? `
    <div class="quiz-nav">
      <button class="btn btn-primary" onclick="nextQuestion('${id}','${c.questions.length}')">
        ${state.idx < qs.length-1 ? 'Next Question →' : 'See Results'}
      </button>
    </div>` : '';
  return `
    <div class="quiz-progress">
      <div class="quiz-prog-dots">${dots}</div>
      <div class="quiz-score">${state.score} / ${state.answers.filter(a=>a!==undefined).length || '?'} correct</div>
    </div>
    <div class="question-card">
      <div class="question-text">Q${state.idx+1}. ${q.q}</div>
      <div class="options">${opts}</div>
      ${expDiv}
      ${nav}
    </div>`;
}

function renderResult(id, c) {
  const state = quizState[id];
  const n = c.questions.length;
  const pct = Math.round(state.score/n*100);
  const msg = pct>=80?'Strong work.':pct>=60?'Good foundation — review the misses.':'Review the Deep Dive tab and try again.';
  return `
    <div class="quiz-result">
      <div class="result-score">${state.score}/${n}</div>
      <div class="result-label">${pct}% — ${msg}</div>
      <button class="btn btn-primary" onclick="resetQuiz('${id}')">Retake Quiz</button>
      <div class="result-breakdown" style="margin-top:20px">
        ${c.questions.map((q,i)=>{
          const correct = state.answers[i]===q.ans;
          return `<div style="margin-bottom:4px">${correct?'✓':'✗'} Q${i+1}: ${q.q.substring(0,50)}...</div>`;
        }).join('')}
      </div>
    </div>`;
}

function renderCoding(topicId) {
  const challenges = codingChallenges[topicId] || [];
  return `<div class="coding-challenges">${challenges.map((ch,i) => `
    <div class="challenge-card" id="card-${topicId}-${i}">
      <div class="challenge-head">
        <div class="challenge-title">${ch.title}</div>
        <div class="challenge-desc">${ch.desc}</div>
      </div>
      <div class="editor-wrap">
        <textarea id="editor-${topicId}-${i}">${ch.template}</textarea>
        <div class="editor-actions">
          <button class="btn-run" onclick="runCode('${topicId}',${i})">▶ Run</button>
          <button class="btn-reset" onclick="resetCode('${topicId}',${i})">Reset</button>
        </div>
        <div class="output-box" id="output-${topicId}-${i}">
          <span class="output-placeholder">Press ▶ Run to execute your code.</span>
        </div>
      </div>
    </div>`).join('')}</div>`;
}

// ─────────────────────────────────────────────
//  INTERACTIONS
// ─────────────────────────────────────────────
function selectTopic(i) {
  currentTopic = i; currentTab = 'explain';
  renderNav(); renderMain();
  closeSidebar();
}

function switchTab(tab) {
  currentTab = tab; renderMain();
  if (tab === 'coding') setTimeout(() => initEditors(topics[currentTopic].id), 50);
}

function toggleSection(i) {
  const el = document.getElementById('sec-'+i);
  const isOpen = el.classList.contains('open');
  // Close all sections
  document.querySelectorAll('.section').forEach(s => s.classList.remove('open'));
  // If it wasn't open, open it
  if (!isOpen) el.classList.add('open');
}

function answerQuiz(id, qIdx, optIdx) {
  const state = quizState[id];
  if (state.answers[qIdx] !== undefined) return;
  state.answers[qIdx] = optIdx;
  const c = topics.find(t=>t.id===id).content;
  if (optIdx === c.questions[qIdx].ans) state.score++;
  renderMain();
}

function nextQuestion(id, total) {
  const state = quizState[id];
  state.idx = Math.min(state.idx+1, parseInt(total));
  renderMain();
}

function resetQuiz(id) {
  quizState[id] = {idx:0, answers:[], score:0};
  renderMain();
}

// ─────────────────────────────────────────────
//  CODE EDITOR
// ─────────────────────────────────────────────
function initEditors(topicId) {
  const challenges = codingChallenges[topicId] || [];
  challenges.forEach((_,i) => {
    const key = `${topicId}-${i}`;
    const ta = document.getElementById(`editor-${key}`);
    if (!ta || editors[key]) return;
    editors[key] = CodeMirror.fromTextArea(ta, {
      mode:'python', theme:'dracula', lineNumbers:true,
      indentUnit:4, indentWithTabs:false, lineWrapping:false,
      extraKeys:{"Tab": cm => cm.execCommand("insertSoftTab")}
    });
  });
}

function runCode(topicId, idx) {
  const key = `${topicId}-${idx}`;
  const outEl = document.getElementById(`output-${key}`);
  outEl.textContent = '';
  outEl.className = 'output-box';
  const code = editors[key] ? editors[key].getValue() : '';
  let output = '';
  Sk.configure({
    output: txt => { output += txt; outEl.textContent = output; },
    read: f => {
      if (Sk.builtinFiles?.files[f]) return Sk.builtinFiles.files[f];
      throw new Error(`File not found: '${f}'`);
    }
  });
  Sk.misceval.asyncToPromise(() => Sk.importMainWithBody('<stdin>', false, code, true))
    .catch(err => {
      outEl.className = 'output-box error';
      outEl.textContent = (output ? output+'\n\n' : '') + String(err);
    });
}

function resetCode(topicId, idx) {
  const key = `${topicId}-${idx}`;
  const challenges = codingChallenges[topicId] || [];
  if (editors[key]) editors[key].setValue(challenges[idx]?.template || '');
  const outEl = document.getElementById(`output-${key}`);
  if (outEl) { outEl.className='output-box'; outEl.innerHTML='<span class="output-placeholder">Press ▶ Run to execute your code.</span>'; }
}

// ─────────────────────────────────────────────
//  MOBILE
// ─────────────────────────────────────────────
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
});
document.getElementById('overlay').addEventListener('click', closeSidebar);

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
renderNav();
renderMain();
</script>
