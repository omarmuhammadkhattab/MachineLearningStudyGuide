<style>
:root{--bg:#FAF9F7;--bg-panel:#F4F2EE;--bg-input:#EDEAE4;--border:#DDD9D1;--border-light:#E8E4DC;--text-strong:#1A1714;--text-mid:#3D3830;--text-faint:#8C8278;--radius:8px;--sidebar-w:260px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Geist',sans-serif;background:var(--bg);color:var(--text-strong);}
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:var(--sidebar-w);background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
.main{flex:1;overflow-y:auto;}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.brand-mark{width:28px;height:28px;background:var(--text-strong);color:var(--bg);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:11px;font-weight:600;flex-shrink:0;}
.brand-text{font-size:13px;font-weight:600;line-height:1.2;}
.brand-sub{font-size:10px;color:var(--text-faint);}
.nav-scroll{overflow-y:auto;flex:1;padding:10px 0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;transition:background .15s;position:relative;}
.nav-item:hover,.nav-item.active{background:var(--bg-input);}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 2px 2px 0;background:var(--text-strong);}
.nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.nav-num{font-family:'Geist Mono',monospace;font-size:9px;color:var(--text-faint);min-width:16px;}
.nav-label{font-size:12.5px;color:var(--text-mid);font-weight:500;}
.nav-item.active .nav-label{color:var(--text-strong);}
.sidebar-footer{padding:14px 16px;border-top:1px solid var(--border);}
.progress-bar-wrap{height:3px;background:var(--border);border-radius:2px;margin-bottom:6px;}
.progress-bar{height:100%;background:var(--text-strong);border-radius:2px;transition:width .4s;}
.progress-label{font-size:10px;color:var(--text-faint);font-family:'Geist Mono',monospace;}
.topic-header{padding:40px 48px 28px;border-bottom:1px solid var(--border-light);}
.topic-tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-family:'Geist Mono',monospace;color:var(--text-faint);font-weight:500;margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em;}
.topic-dot{width:6px;height:6px;border-radius:50%;}
.topic-title{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:10px;}
.topic-def{font-size:14px;color:var(--text-mid);line-height:1.6;max-width:640px;}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 48px;background:var(--bg);}
.tab{padding:12px 0;margin-right:24px;font-size:12.5px;font-weight:500;color:var(--text-faint);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;}
.tab:hover{color:var(--text-mid);}
.tab.active{color:var(--text-strong);border-bottom-color:var(--text-strong);}
.tab-content{padding:36px 48px 60px;display:none;}
.tab-content.active{display:block;}
.sections{display:flex;flex-direction:column;}
.section{border:1px solid var(--border-light);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;}
.section-head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:var(--bg-panel);transition:background .15s;user-select:none;}
.section-head:hover{background:var(--bg-input);}
.section-heading{font-size:13.5px;font-weight:600;}
.section-chevron{font-size:10px;color:var(--text-faint);transition:transform .2s;}
.section.open .section-chevron{transform:rotate(180deg);}
.section-body{display:none;padding:22px 24px 28px;font-size:13.5px;color:var(--text-mid);line-height:1.85;border-top:1px solid var(--border-light);background:var(--bg);}
.section.open .section-body{display:block;}
.sb-prose{margin:0 0 14px;}
.sb-prose:last-child{margin-bottom:0;}
/* ── Math display blocks ── */
.math-block{margin:20px 0;padding:20px 28px;background:#F7F5F1;border:1px solid var(--border);border-left:3px solid var(--text-strong);border-radius:var(--radius);overflow-x:auto;text-align:center;}
.math-block .katex-display{margin:0;}
.math-block .katex{font-size:1.08em;}
.katex{font-size:1em;vertical-align:middle;}
/* ── Code blocks ── */
.sb-code{font-family:'Geist Mono',monospace;font-size:12px;background:var(--bg-panel);border:1px solid var(--border-light);border-radius:7px;padding:14px 18px;margin:14px 0;line-height:1.75;white-space:pre-wrap;word-break:break-word;color:var(--text-mid);}
.sb-item{margin:18px 0 10px;}
.sb-item:first-child{margin-top:0;}
.sb-item-header{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;}
.sb-item-tag{font-family:'Geist Mono',monospace;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--bg);background:var(--text-strong);padding:2px 8px 3px;border-radius:4px;flex-shrink:0;}
.sb-item-desc{font-size:13.5px;color:var(--text-mid);font-weight:500;}
.sb-item-body{padding:8px 12px;border-left:2px solid var(--border);margin-left:2px;font-size:13px;line-height:1.8;color:var(--text-mid);white-space:pre-line;}
.kp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.kp-card{border:1px solid var(--border);border-radius:var(--radius);padding:18px;background:var(--bg-panel);}
.kp-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:10px;font-family:'Geist Mono',monospace;}
.kp-body{font-size:13px;color:var(--text-mid);line-height:1.7;white-space:pre-line;}
.kp-body .katex{font-size:.95em;}
.watch-out-box{margin-top:28px;border:1px solid var(--border);border-left:3px solid var(--text-strong);border-radius:var(--radius);padding:16px 18px;background:var(--bg-panel);}
.watch-out-label{font-family:'Geist Mono',monospace;font-size:10px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;}
.watch-out-text{font-size:13px;color:var(--text-mid);line-height:1.65;}
.quiz-progress{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
.quiz-prog-dots{display:flex;gap:4px;}
.quiz-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .2s;}
.quiz-dot.correct{background:#3A7D55;}.quiz-dot.wrong{background:#B85C38;}.quiz-dot.current{background:var(--text-strong);}
.quiz-score{font-size:11px;font-family:'Geist Mono',monospace;color:var(--text-faint);margin-left:auto;}
.question-card{max-width:620px;}
.question-text{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:20px;}
.options{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.option{padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius);font-size:13.5px;color:var(--text-mid);cursor:pointer;transition:all .15s;line-height:1.4;}
.option:hover{border-color:var(--text-mid);color:var(--text-strong);background:var(--bg-panel);}
.option.correct-ans{border-color:#3A7D55;background:#EDF5F0;color:#2A5C3F;}
.option.wrong-ans{border-color:#B85C38;background:#F5EDE8;color:#8C3A20;}
.explanation{margin-top:14px;background:var(--bg-panel);border:1px solid var(--border);border-left:3px solid var(--text-strong);border-radius:var(--radius);padding:16px 18px;font-size:13.5px;color:var(--text-mid);line-height:1.65;}
.explanation-label{font-family:'Geist Mono',monospace;font-size:10px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;}
.quiz-nav{display:flex;gap:10px;margin-top:20px;}
.btn{padding:9px 18px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg-panel);color:var(--text-mid);transition:all .15s;font-family:'Geist',sans-serif;}
.btn:hover{border-color:var(--text-mid);color:var(--text-strong);}
.btn-primary{background:var(--text-strong);color:var(--bg);border-color:var(--text-strong);}
.btn-primary:hover{background:var(--text-mid);}
.quiz-result{text-align:center;padding:40px 0;}
.result-score{font-size:48px;font-weight:700;font-family:'Geist Mono',monospace;letter-spacing:-2px;}
.result-label{font-size:13px;color:var(--text-faint);margin-top:6px;margin-bottom:24px;}
.result-breakdown{font-size:12px;font-family:'Geist Mono',monospace;color:var(--text-faint);}
.coding-challenges{display:flex;flex-direction:column;gap:28px;}
.challenge-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.challenge-head{padding:14px 18px;background:var(--bg-panel);border-bottom:1px solid var(--border);}
.challenge-title{font-size:13.5px;font-weight:600;margin-bottom:4px;}
.challenge-desc{font-size:12.5px;color:var(--text-faint);line-height:1.5;}
.CodeMirror{height:auto;min-height:200px;font-family:'Geist Mono',monospace!important;font-size:12.5px!important;line-height:1.6!important;}
.editor-actions{display:flex;gap:8px;padding:10px 14px;background:#282A36;border-top:1px solid rgba(255,255,255,.07);}
.btn-run{padding:7px 16px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:#50FA7B;color:#282A36;font-family:'Geist Mono',monospace;}
.btn-run:hover{opacity:.85;}
.btn-reset{padding:7px 14px;border-radius:5px;font-size:12px;cursor:pointer;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.5);font-family:'Geist Mono',monospace;}
.btn-reset:hover{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.8);}
.output-box{background:#1E1F29;padding:14px 16px;font-family:'Geist Mono',monospace;font-size:12px;color:#F8F8F2;white-space:pre-wrap;line-height:1.6;min-height:48px;max-height:280px;overflow-y:auto;border-top:1px solid rgba(255,255,255,.05);}
.output-box.error{color:#FF5555;}
.output-placeholder{color:rgba(248,248,242,.25);font-style:italic;}
.mobile-menu-btn{display:none;position:fixed;top:14px;left:14px;z-index:200;width:36px;height:36px;border-radius:7px;background:var(--bg-panel);border:1px solid var(--border);cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:4px;}
.mobile-menu-btn span{display:block;width:16px;height:1.5px;background:var(--text-strong);border-radius:1px;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99;}
@media(max-width:768px){
.mobile-menu-btn{display:flex;}
.sidebar{position:fixed;left:-280px;top:0;height:100%;z-index:100;transition:left .25s;}
.sidebar.open{left:0;}
.sidebar-overlay.open{display:block;}
.topic-header,.tab-content{padding-left:20px;padding-right:20px;}
.topic-header{padding-top:64px;}
.tabs{padding-left:20px;}
.topic-title{font-size:22px;}
.kp-grid{grid-template-columns:1fr;}
.math-block{padding:14px 10px;}}

/* ── Visualizations ── */
.viz-tab{padding:36px 48px 60px;}
.viz-wrap{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:24px;}
.viz-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.viz-title{font-size:13px;font-weight:600;color:var(--text-strong);}
.viz-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.viz-label{font-size:11px;color:var(--text-faint);font-family:'Geist Mono',monospace;}
.viz-btn{padding:5px 14px;border-radius:5px;font-size:11.5px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text-mid);transition:all .15s;font-family:'Geist',sans-serif;}
.viz-btn:hover,.viz-btn.active{background:var(--text-strong);color:var(--bg);border-color:var(--text-strong);}
.viz-btn-primary{background:var(--text-strong);color:var(--bg);border-color:var(--text-strong);}
.viz-btn-primary:hover{opacity:.85;}
.viz-slider-wrap{display:flex;align-items:center;gap:8px;}
.viz-slider{-webkit-appearance:none;appearance:none;width:100px;height:3px;border-radius:2px;background:var(--border);outline:none;cursor:pointer;}
.viz-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--text-strong);cursor:pointer;}
.viz-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--text-strong);cursor:pointer;border:none;}
.viz-val{font-size:11px;font-family:'Geist Mono',monospace;color:var(--text-mid);min-width:28px;}
canvas.viz-canvas{display:block;width:100%;height:auto;max-height:340px;touch-action:none;}
.viz-note{padding:10px 20px;font-size:12px;color:var(--text-faint);border-top:1px solid var(--border);line-height:1.5;}
@media(max-width:768px){
.viz-tab{padding:20px 20px 40px;}
.viz-slider{width:80px;}
canvas.viz-canvas{max-height:260px;}}
</style>
</head>

<script>
function renderMath(el){
  if(typeof renderMathInElement==='undefined') return;
  renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false,errorColor:'#B85C38'});
}

const topics=[
{id:'what-is-ml',label:'What is ML?',color:'#1E3A5F',content:{
  definition:"The science of building systems that improve from experience — finding patterns in data rather than following hand-written rules.",
  explanation:[
    {heading:"What Does 'Learning' Actually Mean?",body:`In traditional programming, a developer writes explicit rules:\n\n  if contains_word("free money"): mark_as_spam()\n\nFor simple problems, this works. But detecting tumors in medical images, or translating 100+ languages? Nobody can write enough rules. Machine learning flips this: show the algorithm thousands of examples and it figures out the rules itself.\n\nTechnically, a model is a mathematical function $f: X \\to \\hat{y}$ mapping inputs to outputs. Training adjusts internal parameters until outputs match the correct answers in your data. When we say a model "learned," we mean it found parameter values that generalize well to new, unseen data — not just the training examples.`},
    {heading:"The Four Paradigms",body:`SUPERVISED LEARNING — Learning from labeled examples.\n  You provide $(x, y)$ pairs. The model learns to predict $y$ for new $x$.\n  Examples: spam detection, house price prediction, medical diagnosis.\n\nUNSUPERVISED LEARNING — Finding structure without labels.\n  Only inputs — no correct answers. The algorithm discovers patterns.\n  Examples: customer segmentation, anomaly detection, topic modeling.\n\nSEMI-SUPERVISED LEARNING — The pragmatic middle ground.\n  A small labeled set + a large unlabeled set. Labels are expensive to collect.\n\nREINFORCEMENT LEARNING — Learning through trial, error, and reward.\n  An agent takes actions in an environment, receives reward signals, and learns a policy maximizing cumulative reward.\n  Examples: AlphaGo, game-playing AI, robot locomotion.`},
    {heading:"Key Vocabulary",body:`FEATURE $(X)$: An input variable — a column in your dataset.\n\nLABEL $(y)$: The output you're predicting. Also called: target, ground truth.\n\nSAMPLE: A single data point — one row in your dataset.\n\nMODEL: A function $f(X) \\approx y$ with internal parameters adjusted during training.\n\nHYPERPARAMETER: A setting you choose before training — not learned from data.\n\nOVERFITTING: Great on training data, poor on new data. The model memorized instead of generalizing.\n\nGENERALIZATION: Good performance on unseen data. This is the entire goal of ML.`},
    {heading:"The ML Pipeline",body:`Real ML is a cycle:\n1. DEFINE THE PROBLEM — What are you predicting? What counts as success?\n2. COLLECT AND CLEAN DATA — Typically 60–80% of total project time.\n3. EXPLORATORY DATA ANALYSIS — Visualize distributions. Find outliers.\n4. FEATURE ENGINEERING — Transform raw data into useful features.\n5. TRAIN AND EVALUATE — Fit on training data, measure on held-out test set.\n6. ITERATE — Improve features, tune hyperparameters, try different algorithms.\n7. DEPLOY AND MONITOR — Monitor for data drift.`},
    {heading:"When to Use ML — and When Not To",body:`USE ML WHEN:\n  - The task is too complex to define rules manually.\n  - Rules need to adapt over time.\n  - You have enough good-quality data.\n\nDON'T USE ML WHEN:\n  - A simple rule works reliably. One line of regex is not failure — it's wisdom.\n  - You have very little data. Models need enough examples to generalize.\n  - Silent failure is catastrophic. ML fails in unpredictable ways on edge cases.\n\nThe most dangerous trap: using ML because it sounds modern, not because it solves the problem better than a simpler alternative.`}
  ],
  keyPoints:[
    {title:"Supervised Learning",body:"Learn from labeled $(x, y)$ pairs. Predict outputs for new inputs.\nUsed for spam detection, price prediction, classification."},
    {title:"Unsupervised Learning",body:"No labels — find hidden structure in raw data.\nUsed for clustering, anomaly detection, compression."},
    {title:"Key Vocabulary",body:"Feature $X$ = input column. Label $y$ = output.\nModel = learned function $f(X)$.\nHyperparameter = setting chosen before training."},
    {title:"The ML Pipeline",body:"Define → Collect & Clean → EDA → Feature Engineering\n→ Train → Evaluate → Iterate → Deploy & Monitor.\nData cleaning: typically 60–80% of total project time."},
    {title:"When NOT to Use ML",body:"If a simple rule works reliably, use it.\nML adds complexity, opacity, and maintenance burden.\nOnly use it when the problem genuinely requires it."},
    {title:"Overfitting vs Generalization",body:"Overfitting: great on training data, poor on new data.\nGeneralization: good performance on unseen data.\nThis is the central challenge of applied ML."}
  ],
  watchOut:"ML models are only as good as the data they train on. A biased dataset produces a biased model — the algorithm faithfully learns whatever patterns exist in the data, including unfair ones. No algorithmic sophistication compensates for a poorly defined problem or bad data.",
  questions:[
    {q:"What is the key difference between supervised and unsupervised learning?",opts:["Supervised uses more data","Supervised learns from labeled (input, output) pairs; unsupervised finds structure in unlabeled data","Supervised is for regression only","They're the same — 'supervised' refers to the programmer"],ans:1,exp:"Supervised learning requires labeled examples. Unsupervised learning receives only inputs and discovers patterns without predefined correct answers."},
    {q:"What is a 'label' (target) in ML terminology?",opts:["A tag identifying which model made the prediction","The correct output value paired with an input during training","A category marker attached to a feature column","The name given to a model's internal parameter"],ans:1,exp:"A label (target, ground truth) is the correct output paired with each input. The model trains on (features, label) pairs and predicts labels for unseen inputs."},
    {q:"Grouping millions of news articles by topic with no tags. Which paradigm?",opts:["Supervised learning","Reinforcement learning","Unsupervised learning","Semi-supervised learning"],ans:2,exp:"With no labels, this is unsupervised learning. Clustering algorithms group similar articles based on word patterns, discovering topic structure automatically."},
    {q:"A spam filter learns from thousands of labeled emails. This is:",opts:["Unsupervised learning","Reinforcement learning","Semi-supervised learning","Supervised learning"],ans:3,exp:"The model learns from labeled (email, spam/ham) pairs — that's supervised learning."},
    {q:"An AI learns chess by receiving +1 for winning, -1 for losing. This is:",opts:["Supervised learning","Unsupervised learning","Reinforcement learning","Semi-supervised learning"],ans:2,exp:"Reinforcement learning: an agent takes actions, receives reward signals, and learns a policy maximizing cumulative reward."},
    {q:"What is overfitting?",opts:["Training for too many iterations","Performing well on training data but poorly on new, unseen data","Using too many features","Setting the learning rate too high"],ans:1,exp:"Overfitting occurs when a model memorizes training data — including noise — instead of learning the underlying pattern."},
    {q:"Which pipeline step typically consumes 60–80% of project time?",opts:["Model training","Deployment and monitoring","Data collection and cleaning","Hyperparameter tuning"],ans:2,exp:"Data collection, cleaning, and preparation is the most time-consuming step. The model can only learn from the signal that exists in the data."},
    {q:"Which is a good reason NOT to use ML?",opts:["The task involves recognizing complex patterns in images","A simple rule-based filter handles the problem reliably","You have millions of labeled examples","The relationship is too complex to define manually"],ans:1,exp:"If a simple rule works reliably, don't use ML. ML adds complexity, opacity, and maintenance burden."}
  ]
}},
{id:'linear-regression',label:'Linear Regression',color:'#2D5544',content:{
  definition:"A supervised algorithm that models the relationship between input features and a continuous output by fitting the best straight line through the data.",
  explanation:[
    {heading:"The Model — Lines as Predictions",body:`For a single feature:\n$$\\hat{y} = w \\cdot x + b$$\nwhere $w$ is the weight (slope) and $b$ is the bias (intercept). For multiple features:\n$$\\hat{y} = w_1 x_1 + w_2 x_2 + \\cdots + w_n x_n + b = \\mathbf{w}^\\top \\mathbf{x} + b$$\nEvery feature gets its own weight. Training finds the $\\mathbf{w}$ and $b$ that minimize the difference between predictions $\\hat{y}$ and actual values $y$.`},
    {heading:"Mean Squared Error — The Cost Function",body:`The standard cost function for regression:\n$$\\text{MSE} = \\frac{1}{n} \\sum_{i=1}^{n} (y_i - \\hat{y}_i)^2$$\nWhy squared?\n  1. Negatives and positives don't cancel — both count as errors.\n  2. Large errors are penalized more than small ones (quadratic growth).\n  3. It's differentiable everywhere, enabling gradient-based optimization.\nTraining minimizes this number.`},
    {heading:"Gradient Descent — How the Model Learns",body:`Gradient descent finds optimal weights iteratively:\n  1. Start with $w = 0$, $b = 0$.\n  2. Compute the gradient of MSE with respect to each weight.\n  3. Take a small step opposite to the gradient (downhill).\n  4. Repeat until cost stops decreasing.\n\nThe update rules:\n$$w \\leftarrow w - \\alpha \\cdot \\frac{\\partial\\,\\text{MSE}}{\\partial w}, \\qquad b \\leftarrow b - \\alpha \\cdot \\frac{\\partial\\,\\text{MSE}}{\\partial b}$$\n\nwhere:\n$$\\frac{\\partial\\,\\text{MSE}}{\\partial w} = \\frac{2}{n}\\sum_{i=1}^n(\\hat{y}_i - y_i)\\,x_i, \\qquad \\frac{\\partial\\,\\text{MSE}}{\\partial b} = \\frac{2}{n}\\sum_{i=1}^n(\\hat{y}_i - y_i)$$\n\n$\\alpha$ is the learning rate — too large: overshoots. Too small: very slow convergence.`},
    {heading:"The Normal Equation — Closed Form Solution",body:`For small datasets there's a closed-form exact solution:\n$$\\mathbf{w}^* = (X^\\top X)^{-1} X^\\top y$$\nThis gives optimal weights in one step — no iteration needed.\n\nDownside: matrix inversion is $\\mathcal{O}(d^3)$ in the number of features $d$. For large $d$, gradient descent is preferred. Also, gradient descent generalizes to neural networks; the Normal Equation does not.`},
    {heading:"R-Squared and Assumptions",body:`$R^2$ (R-squared) measures what fraction of the variance in $y$ the model explains:\n$$R^2 = 1 - \\frac{SS_{\\text{res}}}{SS_{\\text{tot}}} = 1 - \\frac{\\displaystyle\\sum_i (y_i - \\hat{y}_i)^2}{\\displaystyle\\sum_i (y_i - \\bar{y})^2}$$\n\n$R^2 = 1$: perfect fit. $R^2 = 0$: no better than predicting the mean. $R^2 < 0$: worse than the mean.\n\nLinear regression assumes: linearity between $X$ and $y$, independence of samples, constant residual variance (homoscedasticity), and approximately normal residuals.`}
  ],
  keyPoints:[
    {title:"The Model",body:"$$\\hat{y} = w_1x_1 + w_2x_2 + \\cdots + b = \\mathbf{w}^\\top\\mathbf{x}+b$$\nEach feature gets a weight. Training minimizes prediction error."},
    {title:"Cost Function (MSE)",body:"$$\\text{MSE} = \\frac{1}{n}\\sum_{i=1}^n(y_i - \\hat{y}_i)^2$$\nSquaring errors penalizes large mistakes far more than small ones."},
    {title:"Gradient Descent",body:"$$w \\leftarrow w - \\alpha \\cdot \\nabla_w \\text{MSE}$$\n$\\alpha$ is the learning rate. Repeat until convergence.\nAlways moves downhill (opposite to gradient direction)."},
    {title:"Normal Equation",body:"$$\\mathbf{w}^* = (X^\\top X)^{-1} X^\\top y$$\nExact solution, no iteration. But $\\mathcal{O}(d^3)$ —\ntoo slow for many features."},
    {title:"R-Squared",body:"$$R^2 = 1 - \\frac{SS_{\\text{res}}}{SS_{\\text{tot}}}$$\n$R^2=1$: perfect. $R^2=0$: no better than predicting the mean.\n$R^2<0$: worse than the mean (something is wrong)."},
    {title:"When It Works",body:"Continuous output, approximately linear relationships, when interpretability matters. Always use as your first baseline before complex models."}
  ],
  watchOut:"Feature scaling matters for gradient descent — features on very different scales cause uneven gradient steps and slow convergence. Standardize features before training. Also: correlation ≠ causation. A high $R^2$ means the model fits the data, not that the features cause the output.",
  questions:[
    {q:"What does the weight w represent in y = wx + b?",opts:["The bias term added to every prediction","The slope — how much the output changes per unit increase in the feature","The learning rate used during gradient descent","The model's confidence in each prediction"],ans:1,exp:"The weight w is the slope. It tells you how much y changes for a one-unit increase in x."},
    {q:"Why does MSE square the prediction errors?",opts:["To make all errors positive, and penalize large errors disproportionately","To make the math simpler — squaring removes absolute values","Because negative errors are twice as costly","MSE and MAE give identical optimal weights"],ans:0,exp:"Squaring makes all errors positive and penalizes large errors far more — a prediction off by 10 contributes 100 to MSE, vs. one off by 1 contributing just 1."},
    {q:"What does the learning rate α control in gradient descent?",opts:["The number of training epochs","How large each step is in the direction of the gradient","The proportion of data used for training vs. validation","How much regularization is applied"],ans:1,exp:"The learning rate controls step size. Too large: overshoots. Too small: very slow convergence."},
    {q:"When is the Normal Equation preferred over gradient descent?",opts:["Always — it gives the exact optimal solution in one step","When the dataset has many samples and many features","When the number of features is small — matrix inversion is O(d³)","When the relationship is non-linear"],ans:2,exp:"The Normal Equation is exact but O(d³) in features. For small d it's faster; for large d, gradient descent is preferred."},
    {q:"A model has R² = 0.0 on test data. What does this mean?",opts:["The model is completely wrong","No better than predicting the mean every time","Perfect fit to training data","R² = 0 only occurs when all weights are zero"],ans:1,exp:"When R² = 0, the model does no better than a horizontal line at the mean of y."},
    {q:"Adding x² to a linear regression model is called:",opts:["Logistic regression","Polynomial features — remaining linear in parameters but fitting curves","Kernel regression","Support vector regression"],ans:1,exp:"Adding x² creates polynomial regression. Despite the curve, it's 'linear regression' because the model is linear in its parameters. High-degree polynomials overfit aggressively."},
    {q:"What is gradient descent doing at each step?",opts:["Randomly searching the weight space","Moving weights in the direction that increases cost","Computing the exact optimal weights using the Normal Equation","Moving weights opposite to the gradient — downhill toward lower cost"],ans:3,exp:"The gradient points uphill. Moving in the opposite direction (w = w - α·gradient) moves us downhill toward lower cost."},
    {q:"Which scenario is linear regression poorly suited for?",opts:["Predicting house prices from square footage","Predicting revenue as a function of advertising spend","Classifying emails as spam or not-spam (binary label)","Predicting temperature from humidity"],ans:2,exp:"Linear regression outputs a continuous number. For binary classification, you need a model that outputs probabilities — that's logistic regression."}
  ]
}},
{id:'logistic-regression',label:'Logistic Regression',color:'#5E4A7A',content:{
  definition:"A supervised classification algorithm that predicts the probability of a binary outcome by applying the sigmoid function to a linear combination of features.",
  explanation:[
    {heading:"From Numbers to Probabilities",body:`Linear regression outputs any real number. For classification you need outputs in $(0,1)$ — probabilities. Logistic regression adds the sigmoid function:\n\nStart with a linear combination:\n$$z = w_1 x_1 + w_2 x_2 + \\cdots + b$$\n\nApply the sigmoid:\n$$P(y=1 \\mid \\mathbf{x}) = \\sigma(z) = \\frac{1}{1 + e^{-z}}$$\n\nThe sigmoid squashes any real number into $(0,1)$:\n- $z \\to -\\infty$: $\\sigma(z) \\to 0$\n- $z = 0$: $\\sigma(0) = 0.5$\n- $z \\to +\\infty$: $\\sigma(z) \\to 1$\n\nTo make a hard prediction: predict class 1 if $P > 0.5$, class 0 otherwise. The threshold 0.5 is the default — tune it based on your use case.`},
    {heading:"The Decision Boundary",body:`Logistic regression creates a linear decision boundary — the set of points where $P = 0.5$, which is where $z = 0$:\n$$w_1 x_1 + w_2 x_2 + b = 0$$\n\nIn 2D, this is a line. In $n$ dimensions, a hyperplane. Logistic regression can only create linear boundaries — for curved ones, add polynomial features or use a non-linear algorithm.`},
    {heading:"Training — Binary Cross-Entropy Loss",body:`MSE creates a non-convex loss surface for logistic regression — gradient descent gets stuck. Instead, use Binary Cross-Entropy:\n$$\\mathcal{L} = -\\frac{1}{n} \\sum_{i=1}^{n} \\Big[ y_i \\log(p_i) + (1 - y_i) \\log(1 - p_i) \\Big]$$\n\nwhere $p_i = \\sigma(z_i)$. Intuition:\n- $y_i=1$, $p_i \\to 1$: $\\log(1) = 0$. No loss.\n- $y_i=1$, $p_i \\to 0$: $\\log(0) \\to -\\infty$. Catastrophic loss.\n\nThis loss is convex — gradient descent always reaches the global minimum. Gradient update:\n$$\\mathbf{w} \\leftarrow \\mathbf{w} - \\frac{\\alpha}{n} X^\\top(\\hat{\\mathbf{y}} - \\mathbf{y})$$`},
    {heading:"Multiclass — Softmax Regression",body:`For $K > 2$ classes, Softmax Regression extends logistic regression natively. Compute a score $z_k$ for each class $k$, then convert to probabilities:\n$$P(y=k \\mid \\mathbf{x}) = \\frac{e^{z_k}}{\\displaystyle\\sum_{j=1}^{K} e^{z_j}}$$\n\nAll probabilities are positive and sum to 1 — a proper probability distribution. Softmax + cross-entropy is the standard loss for multiclass classification.`},
    {heading:"Regularization",body:`L2 (Ridge): adds $\\lambda \\sum_i w_i^2$ to the loss. Shrinks weights, reduces overfitting.\nL1 (Lasso): adds $\\lambda \\sum_i |w_i|$ to the loss. Zeroes out irrelevant features.\n\nIn scikit-learn, $C = 1/\\lambda$. Smaller $C$ = more regularization.\n\nPRACTICAL TIPS:\n  - Always scale features before logistic regression.\n  - Check precision, recall, F1 — not just accuracy.\n  - If classes are imbalanced, adjust the threshold away from 0.5.`}
  ],
  keyPoints:[
    {title:"Sigmoid Function",body:"$$\\sigma(z) = \\frac{1}{1 + e^{-z}}$$\nSquashes any real number into $(0,1)$. Outputs a probability."},
    {title:"Decision Boundary",body:"The hyperplane where $P = 0.5$ (where $z = 0$):\n$$w_1x_1 + w_2x_2 + b = 0$$\nAlways linear in standard logistic regression."},
    {title:"Binary Cross-Entropy",body:"$$\\mathcal{L} = -\\frac{1}{n}\\sum\\big[y\\log p + (1-y)\\log(1-p)\\big]$$\nConvex — gradient descent always finds the global minimum."},
    {title:"Softmax for Multiclass",body:"$$P(y=k \\mid \\mathbf{x}) = \\frac{e^{z_k}}{\\sum_j e^{z_j}}$$\nExtends logistic regression to $K$ classes. Probabilities sum to 1."},
    {title:"Threshold Tuning",body:"Default threshold is $0.5$. Lower it for high-recall tasks\n(e.g. cancer screening). Raise it for high-precision tasks\n(e.g. spam filtering)."},
    {title:"vs. Linear Regression",body:"Linear: continuous output, MSE loss.\nLogistic: probability output, cross-entropy loss.\nSame training algorithm, different output and loss function."}
  ],
  watchOut:"Despite the name, logistic regression is a classification algorithm, not a regression one. It assumes a linear decision boundary — if classes can't be separated by a hyperplane, it will underfit regardless of data quantity. Check the confusion matrix, not just accuracy.",
  questions:[
    {q:"What does the sigmoid function do?",opts:["Applies a threshold to convert probabilities to class labels","Squashes the linear output to a value between 0 and 1, interpretable as a probability","Normalizes the weights to prevent overfitting","Applies a non-linear transformation to individual input features"],ans:1,exp:"The sigmoid σ(z) = 1/(1+e⁻ᶻ) maps any real number to (0,1), converting the raw linear score into a probability P(y=1|x)."},
    {q:"Why is Binary Cross-Entropy used instead of MSE for logistic regression?",opts:["MSE is harder to compute when outputs are probabilities","Cross-entropy is convex for logistic regression, ensuring gradient descent converges to the global minimum; MSE is not","Cross-entropy is faster to compute","MSE gives zero loss when predictions are exactly 0.5"],ans:1,exp:"MSE applied to logistic regression creates a non-convex loss surface with local minima. Binary cross-entropy is convex — gradient descent always finds the global optimum."},
    {q:"A logistic model outputs P(spam)=0.73. Using threshold 0.5, the prediction is:",opts:["Ham — probability not high enough","Spam — 0.73 > 0.5 threshold","Cannot predict without the full distribution","Depends on class imbalance in training data"],ans:1,exp:"With threshold 0.5: predict spam if P(spam) > 0.5. Since 0.73 > 0.5, the model predicts spam."},
    {q:"What does the decision boundary look like in standard logistic regression?",opts:["A curved surface that adapts to the data","A straight line (in 2D) or hyperplane — always linear","A non-linear boundary shaped by the sigmoid","Multiple boundaries, one per training epoch"],ans:1,exp:"Logistic regression creates a linear decision boundary: the set of points where z = 0 (P = 0.5). In 2D that's a line; in nD that's a hyperplane."},
    {q:"A large positive weight for a feature means:",opts:["The feature is noisy and should be removed","That feature strongly increases the probability of the positive class when it increases","That feature strongly decreases the probability of the positive class","The feature was not regularized during training"],ans:1,exp:"A large positive w means increasing that feature increases z, which increases σ(z) — the probability of the positive class."},
    {q:"Softmax probabilities always have what property?",opts:["They are all equal to 1/K by default","They sum to 1, making them a proper probability distribution over classes","They are all between -1 and 1","Each equals the sigmoid of its class score"],ans:1,exp:"The softmax function ensures all K class probabilities are positive and sum to 1 — a proper probability distribution."},
    {q:"Building a rare disease detector — missing a sick patient is far worse than a false alarm. How to adjust the threshold?",opts:["Raise the threshold above 0.5","Lower the threshold below 0.5 to catch more positive cases","Keep it at 0.5 — changing it introduces bias","Always predict the positive class"],ans:1,exp:"Lowering the threshold catches more true positives (higher recall) at the cost of more false positives (lower precision). For disease detection, high recall takes priority."},
    {q:"What does L2 regularization do to logistic regression weights?",opts:["Drives some weights to exactly zero","Shrinks all weights toward zero without making them exactly zero, reducing overfitting","Increases the learning rate","Normalizes the weights so they sum to 1"],ans:1,exp:"L2 adds λΣwi² to the loss, continuously pushing weights toward (but not to) zero. This shrinks all weights and reduces overfitting without creating sparsity."}
  ]
}},
{id:'model-evaluation',label:'Model Evaluation',color:'#9B3A22',content:{
  definition:"The discipline of rigorously measuring whether your model actually works on data it has never seen — and understanding precisely how and where it fails.",
  explanation:[
    {heading:"The Golden Rule — Never Test on Training Data",body:`If you measure performance on training data, you're measuring memorization, not learning. A model that perfectly memorizes training data fails on new data while showing near-perfect training accuracy.\n\nStandard approach: train/test split (typically 80/20).\n  Training set (80%): the model sees this data and learns from it.\n  Test set (20%): held out completely. Never seen during training.\n\nTHE TEST SET IS SACRED. For hyperparameter tuning, use a third split:\n  Training → model trains. Validation → you tune. Test → final evaluation, touched exactly once.`},
    {heading:"K-Fold Cross-Validation",body:`K-Fold CV gives a more reliable estimate:\n  1. Split the dataset into $K$ equal folds (typically $K=5$ or $K=10$).\n  2. For fold $i$: train on all folds except $i$, evaluate on fold $i$.\n  3. Repeat $K$ times. Average the scores.\n\nEvery sample is used for both training and testing. With a single 80/20 split, a lucky partition can make a model look better or worse than it is. K-fold averages out that variance.\n\nCost: $K$ times as much computation.`},
    {heading:"Regression Metrics",body:`For predicting a continuous number:\n$$\\text{MAE} = \\frac{1}{n}\\sum_{i=1}^n |y_i - \\hat{y}_i|$$\n$$\\text{RMSE} = \\sqrt{\\frac{1}{n}\\sum_{i=1}^n (y_i - \\hat{y}_i)^2}$$\n$$R^2 = 1 - \\frac{\\sum_i(y_i-\\hat{y}_i)^2}{\\sum_i(y_i-\\bar{y})^2}$$\n\nMAE: average absolute error — interpretable and robust to outliers.\nRMSE: penalizes large errors quadratically. More sensitive to outliers.\n$R^2$: proportion of variance in $y$ explained by the model.`},
    {heading:"The Accuracy Trap",body:`Accuracy $= \\frac{TP+TN}{TP+TN+FP+FN}$. Sounds reliable. Often dangerously misleading.\n\nTHE CLASSIC TRAP:\n  You build a model to detect a rare disease affecting 1% of the population.\n  Your model predicts "healthy" for everyone. Accuracy = 99%.\n  The model caught zero sick patients. It is completely useless.\n\nWhen classes are imbalanced, accuracy is dominated by the majority class. Always check the class distribution first. Use precision, recall, F1, and AUC for classification.`},
    {heading:"Precision, Recall, F1, and AUC",body:`From the confusion matrix ($TP$, $TN$, $FP$, $FN$):\n$$\\text{Precision} = \\frac{TP}{TP + FP} \\quad \\text{(of positive predictions, how many were correct?)}$$\n$$\\text{Recall} = \\frac{TP}{TP + FN} \\quad \\text{(of actual positives, how many did we catch?)}$$\n$$F_1 = \\frac{2 \\cdot \\text{Precision} \\cdot \\text{Recall}}{\\text{Precision} + \\text{Recall}}$$\n\n$F_1$ uses the harmonic mean — cannot be gamed by extreme precision/recall imbalance.\n\nAUC (Area Under the ROC Curve): probability that a random positive example scores higher than a random negative. $\\text{AUC}=1.0$: perfect. $\\text{AUC}=0.5$: random guessing.`}
  ],
  keyPoints:[
    {title:"Train / Test / Validation",body:"Never test on training data.\nTraining = model learns. Validation = you tune.\nTest = final evaluation, touched exactly once."},
    {title:"K-Fold Cross-Validation",body:"Split into $K$ folds. Each fold is the test set once.\nAverage $K$ scores for a reliable estimate.\nMore stable than a single 80/20 split."},
    {title:"Regression Metrics",body:"$\\text{MAE} = \\frac{1}{n}\\sum|y_i-\\hat{y}_i|$ — interpretable, robust\n$\\text{RMSE} = \\sqrt{\\frac{1}{n}\\sum(y_i-\\hat{y}_i)^2}$ — penalises large errors\n$R^2 = 1 - SS_{\\text{res}}/SS_{\\text{tot}}$ — variance explained"},
    {title:"The Accuracy Trap",body:"99% accuracy means nothing if 99% of samples are\nthe majority class. Always check class distribution\nbefore choosing any metric."},
    {title:"Precision vs. Recall",body:"$\\text{Precision} = TP/(TP+FP)$ — are predictions trustworthy?\n$\\text{Recall} = TP/(TP+FN)$ — catching all positives?\nThey trade off via the decision threshold."},
    {title:"F1 and AUC",body:"$F_1 = 2PR/(P+R)$ — harmonic mean, can't be gamed.\nAUC: threshold-independent. $1.0$: perfect. $0.5$: random guessing."}
  ],
  watchOut:"Never tune hyperparameters on the test set — it contaminates it. The test set must be touched exactly once: for final evaluation. Every decision made during development must be based on training and validation sets only. This is the most frequently violated rule in ML practice.",
  questions:[
    {q:"Why is evaluating a model on its training data misleading?",opts:["Training data is always biased","It measures memorization, not generalization — the model has already seen the answers","Models cannot be evaluated on training data","Training evaluation always has higher variance"],ans:1,exp:"Evaluating on training data measures how well the model memorized those examples. It tells you nothing about performance on new data."},
    {q:"Why is a separate validation set needed in addition to the test set?",opts:["To provide extra training data","To tune hyperparameters without contaminating the test set","To measure final model performance","To detect data drift"],ans:1,exp:"If you tune hyperparameters using the test set, it becomes contaminated — you've effectively trained on it. The test set is sacred and touched exactly once."},
    {q:"In 5-fold cross-validation, how many times is each data point used as a test sample?",opts:["5 times","4 times","1 time","0 times"],ans:2,exp:"Each fold serves as the test set exactly once. In 5-fold CV, every point is tested once and trained on 4 times."},
    {q:"A fraud detector predicts 'no fraud' for every transaction. Dataset has 99% legitimate. Accuracy?",opts:["50%","1%","99%","Undefined without a confusion matrix"],ans:2,exp:"Accuracy = correct/total. If 99% are legitimate and you always predict legitimate, accuracy = 99%. But the model caught zero fraudulent cases. Classic accuracy trap."},
    {q:"You want to minimise false positives in a legal document review system. Which metric?",opts:["Recall","Accuracy","AUC","Precision"],ans:3,exp:"Precision = TP/(TP+FP). Optimising precision means fewer false positives — fewer irrelevant documents incorrectly flagged as relevant."},
    {q:"What does AUC = 0.5 on the ROC curve indicate?",opts:["The model is 50% accurate","The model performs no better than random guessing across all thresholds","Perfect balance of precision and recall","Half the test samples are classified correctly"],ans:1,exp:"AUC = 0.5 means the ROC curve follows the diagonal — TPR equals FPR at every threshold. Equivalent to random guessing."},
    {q:"A cancer screening model has precision=0.97 and recall=0.35. Main problem?",opts:["Too many false alarms","Missing 65% of actual cancer cases — extremely high false negative rate","The model is overfitting","Precision and F1 are in conflict"],ans:1,exp:"Recall = 0.35 means the model only catches 35% of actual cancer cases. In medical screening, false negatives are potentially fatal."},
    {q:"Why does RMSE penalise large errors more than MAE?",opts:["RMSE uses division while MAE uses subtraction","RMSE squares errors — a mistake of 10 is penalised 100× more than a mistake of 1","RMSE is computed on a log scale","They penalise equally — only the units differ"],ans:1,exp:"RMSE squares each error: a prediction off by 10 contributes 100, while one off by 1 contributes 1. Quadratic penalisation makes RMSE much more sensitive to outliers."}
  ]
}},
{id:'overfitting',label:'Overfitting & Regularization',color:'#5C3D6E',content:{
  definition:"The fundamental tension between fitting training data and generalizing to new data — and the mathematical tools to manage it.",
  explanation:[
    {heading:"Overfitting and Underfitting",body:`OVERFITTING — the model is too complex:\n  Training accuracy: very high. Test accuracy: significantly lower.\n  Key diagnostic: a large train-test gap.\n  Fixes: more data, simpler model, regularization, early stopping.\n\nUNDERFITTING — the model is too simple:\n  Training accuracy: low. Test accuracy: also low.\n  Key diagnostic: small gap, but both scores are poor.\n  Fixes: more complex model, more features, less regularization.\n\nThe goal: find the sweet spot — complex enough to capture real patterns, simple enough to generalize.`},
    {heading:"The Bias-Variance Tradeoff",body:`Every model's expected error decomposes into three parts:\n$$\\text{Total Error} = \\underbrace{\\text{Bias}^2}_{\\text{underfitting}} + \\underbrace{\\text{Variance}}_{\\text{overfitting}} + \\underbrace{\\varepsilon^2}_{\\text{irreducible noise}}$$\n\nBIAS: error from wrong assumptions — model too simple. Consistently misses the true pattern regardless of training data.\n\nVARIANCE: error from sensitivity to data fluctuations — model too complex. Predictions change dramatically with a different training sample.\n\nTHE TRADEOFF: increasing complexity reduces bias but increases variance. The optimal point minimises $\\text{Bias}^2 + \\text{Variance}$.\n\nIrreducible noise sets the floor — no model can beat it.`},
    {heading:"L1 and L2 Regularization",body:`Regularization adds a penalty to the loss for model complexity:\n$$\\mathcal{L}_{\\text{reg}} = \\mathcal{L}_{\\text{original}} + \\lambda \\cdot \\Omega(\\mathbf{w})$$\n\nL2 REGULARIZATION (Ridge):\n$$\\mathcal{L} = \\text{MSE} + \\lambda \\sum_{i} w_i^2$$\nShrinks all weights toward zero — rarely to exactly zero.\nKeeps all features, just smaller.\n\nL1 REGULARIZATION (Lasso):\n$$\\mathcal{L} = \\text{MSE} + \\lambda \\sum_{i} |w_i|$$\nDrives some weights to exactly zero — automatic feature selection. The $\\ell_1$ geometry creates sparsity.\n\nELASTIC NET combines both:\n$$\\mathcal{L} = \\text{MSE} + \\lambda_1\\sum|w_i| + \\lambda_2\\sum w_i^2$$\n\n$\\lambda$ controls regularization strength. Too small: still overfitting. Too large: underfitting. Tune via cross-validation.`}
  ],
  keyPoints:[
    {title:"Overfitting",body:"High train accuracy, low test accuracy. Large gap = key diagnostic.\nFixes: more data, simpler model, regularization, early stopping."},
    {title:"Underfitting",body:"Low accuracy on both train and test. Small gap but both poor.\nFixes: more complex model, more features, less regularization."},
    {title:"Bias-Variance Tradeoff",body:"$$\\text{Error} = \\text{Bias}^2 + \\text{Variance} + \\text{Noise}$$\nIncreasing complexity reduces bias, increases variance."},
    {title:"Regularization",body:"$$\\mathcal{L}_{\\text{reg}} = \\mathcal{L} + \\lambda\\cdot\\Omega(\\mathbf{w})$$\nPenalises large weights → simpler models → better generalization."},
    {title:"L2 / Ridge",body:"Penalty $= \\lambda\\sum w_i^2$\nShrinks all weights toward zero but not to zero.\nBest when all features are likely relevant."},
    {title:"L1 / Lasso",body:"Penalty $= \\lambda\\sum|w_i|$\nDrives some weights to exactly zero.\nAutomatic feature selection."}
  ],
  watchOut:"Regularization doesn't eliminate overfitting — it trades off against underfitting. Too large a $\\lambda$ causes the model to underfit. Also: more training data is often more effective than any regularization technique. When in doubt, collect more data before tuning $\\lambda$.",
  questions:[
    {q:"A model achieves 99% training accuracy and 62% test accuracy. What is the problem?",opts:["Underfitting — the model is too simple","The dataset is too small","Overfitting — the model memorized training data","The learning rate was too high"],ans:2,exp:"High training accuracy + significantly lower test accuracy = overfitting. The large gap shows the model memorized training data and fails to generalize."},
    {q:"A model achieves 58% training accuracy and 57% test accuracy (random guessing = 50%). Problem?",opts:["Overfitting","Underfitting — both scores are poor; the model can't capture the real pattern","Data leakage","Good generalization — train and test are equal"],ans:1,exp:"Low accuracy on BOTH train and test, barely above chance — that's underfitting. The model is too simple to capture the real signal."},
    {q:"Which describes a high-bias model?",opts:["Performs well on training data but poorly on test","Predictions change drastically if training set changes slightly","Has wrong structural assumptions and misses patterns in both training and test","Generates too many false positives"],ans:2,exp:"High bias means the model's assumptions are too restrictive. It consistently misses patterns in BOTH training and test. This is underfitting."},
    {q:"L1 (Lasso) regularization tends to produce:",opts:["Weights that are uniformly small but nonzero","Sparse models where many weights are exactly zero","Larger weights than an unregularized model","Only positive weight values"],ans:1,exp:"L1 regularization creates sparsity: the geometry of the L1 penalty causes optimization to hit corners where individual weights are exactly zero — built-in feature selection."},
    {q:"What does increasing lambda (regularization strength) do?",opts:["Increases model complexity and can cause overfitting","Shrinks weights toward zero, simplifying the model and potentially causing underfitting","Speeds up training","Has no effect on model complexity"],ans:1,exp:"Larger lambda imposes a stronger penalty on large weights, shrinking them toward zero. Too large a lambda causes underfitting."},
    {q:"Why can't you have both low bias and low variance simultaneously, in general?",opts:["You need different hardware for each","Increasing model complexity reduces bias but increases variance — they trade off along a curve","Low variance always implies high bias mathematically","You can achieve both with enough training data"],ans:1,exp:"The bias-variance tradeoff is fundamental: increasing complexity gives more capacity to fit real patterns (lower bias) but also more capacity to fit noise (higher variance)."},
    {q:"Which of these is NOT a solution to overfitting?",opts:["Collecting more training data","Applying L2 regularization","Increasing model complexity by adding more parameters","Using early stopping on a validation set"],ans:2,exp:"Increasing complexity makes overfitting worse — a more complex model can fit noise even more precisely."},
    {q:"What does L2 regularization add to the loss function?",opts:["A term proportional to the sum of absolute weight values","A term proportional to the sum of squared weight values","A penalty on the number of features used","A bonus for correctly classified examples"],ans:1,exp:"L2 adds λΣwi² to the loss. The squared term makes large weights quadratically expensive, pushing weights toward (but not to) zero."}
  ]
}},
{id:'decision-trees',label:'Decision Trees & Random Forest',color:'#B07A1F',content:{
  definition:"Decision trees split data by asking yes/no questions on features; Random Forest combines hundreds of trees trained on random data subsets for far more accurate and robust predictions.",
  explanation:[
    {heading:"How Trees Split — Gini Impurity and Information Gain",body:`The tree greedily finds the split at each node that creates the purest children.\n\nGINI IMPURITY (used by CART):\n$$\\text{Gini}(S) = 1 - \\sum_{k} p_k^2$$\nwhere $p_k$ is the proportion of class $k$ in set $S$. $\\text{Gini}=0$: perfectly pure. $\\text{Gini}=0.5$: maximum impurity (50/50 binary).\n\nINFORMATION GAIN (used by ID3/C4.5):\n$$H(S) = -\\sum_{k} p_k \\log_2 p_k$$\n$$IG = H(\\text{parent}) - \\frac{|S_L|}{|S|}H(S_L) - \\frac{|S_R|}{|S|}H(S_R)$$\nPick the split with the highest information gain.\n\nFor regression trees: minimise variance (MSE) of the two subsets.`},
    {heading:"Random Forest — Bagging + Random Features",body:`Random Forest trains many decision trees and takes a majority vote. Two sources of randomness create diversity:\n\n1. BOOTSTRAP SAMPLING: each tree trains on a bootstrap sample — $n$ samples drawn with replacement. Each sample includes $\\approx 63\\%$ unique points.\n\n2. RANDOM FEATURE SUBSETS: at each split, only consider $m$ random features:\n   - Classification: $m = \\sqrt{p}$\n   - Regression: $m = p/3$\n\nWHY IT WORKS: if individual errors are uncorrelated, averaging $B$ models reduces variance:\n$$\\text{Var}\\!\\left(\\frac{1}{B}\\sum_{b=1}^B f_b\\right) \\approx \\frac{\\sigma^2}{B}$$\n\nPREDICTION:\n  Classification: majority vote across all trees.\n  Regression: average of all trees' predictions.`},
    {heading:"Out-of-Bag Error and Feature Importance",body:`OUT-OF-BAG (OOB) ERROR:\n  Each training point is omitted from $\\approx 37\\%$ of bootstrap samples.\n  Those omitted points serve as a free built-in validation set.\n  OOB error reliably estimates generalization without a separate held-out set.\n\nFEATURE IMPORTANCE:\n  For each feature, measure total impurity reduction it causes across all trees.\n  Features used in many early (high-impact) splits score highest.\n\nNote: correlated features split importance between them. For true importance with correlated features, use permutation importance.`}
  ],
  keyPoints:[
    {title:"Splitting Criteria",body:"Gini: $1 - \\sum p_k^2$ — lower = purer node.\nIG: $H(\\text{parent}) - \\text{weighted}\\,H(\\text{children})$\nAt each node: try all features × thresholds, pick best."},
    {title:"Tree Controls",body:"max_depth, min_samples_split, min_samples_leaf, pruning.\nA fully grown tree memorises training data.\nNo feature scaling needed. Handles mixed feature types."},
    {title:"Random Forest = Bagging + Random Features",body:"$B$ trees on bootstrap samples.\n$m = \\sqrt{p}$ features per split.\n$$\\text{Var}(\\bar{f}) \\approx \\sigma^2/B$$"},
    {title:"Out-of-Bag Error",body:"$\\approx 37\\%$ of samples omitted from each bootstrap.\nFree built-in validation — no held-out set needed.\nOOB error $\\approx$ cross-validation accuracy."},
    {title:"Feature Importance",body:"Total impurity reduction per feature, averaged across all trees.\nCorrelated features split importance between them.\nUse permutation importance for correlated features."},
    {title:"When to Use",body:"Strong baseline for almost any tabular dataset.\nMinimal preprocessing, built-in feature importance,\nrobust to outliers. No feature scaling needed."}
  ],
  watchOut:"Feature importance from Random Forest can be misleading when features are correlated — importance gets split between them. For true feature importance with correlated features, use permutation importance. Also: Random Forest doesn't extrapolate — it can only predict values within the range seen during training.",
  questions:[
    {q:"What does each internal node in a decision tree represent?",opts:["A final prediction for a group of samples","A test on a single feature — does x_i satisfy a threshold?","A weight applied to all samples reaching that node","A probability estimate for the positive class"],ans:1,exp:"Internal nodes test a single feature against a threshold. Based on the answer, data flows to the left or right child. Only leaf nodes make final predictions."},
    {q:"Gini impurity of a node is 0. What does this mean?",opts:["The split failed — all samples went to one side","The node is perfectly pure — all samples belong to the same class","Gini = 0 is the maximum impurity","The node has only one sample"],ans:1,exp:"Gini = 1 - Σpi². When all samples are the same class, pi=1 for that class and 0 for others. So Gini = 1 - 1² = 0. A pure node."},
    {q:"Why does Random Forest use random feature subsets at each split?",opts:["To speed up training","To create diversity — prevents all trees from using the same dominant feature, keeping errors uncorrelated","To ensure all features are used at least once","To simulate L1 regularization"],ans:1,exp:"If all trees used all features, they'd be highly correlated and averaging wouldn't help. Random feature subsets decorrelate the trees so their errors cancel."},
    {q:"What is 'bootstrapping' in the context of Random Forest?",opts:["A method to reduce tree depth by pruning","Sampling n points with replacement — some repeat, some are omitted","Scaling features before building each tree","Initializing tree weights randomly"],ans:1,exp:"Bootstrap sampling draws n samples with replacement. Each sample includes ~63% unique points, giving each tree a different training set and creating model diversity."},
    {q:"What is Out-of-Bag (OOB) error?",opts:["Error on the training set","Error on samples not in a tree's bootstrap sample — a free built-in validation set","Error from pruned trees","The variance component of the bias-variance tradeoff"],ans:1,exp:"Each bootstrap sample omits ~37% of training points. Those 'out of bag' points evaluate the tree for free, giving a reliable generalization estimate."},
    {q:"A single tree gets 98% training and 71% test accuracy. Adding more trees to a Random Forest helps by:",opts:["Reducing bias — each new tree is simpler","Reducing variance — averaging decorrelated trees smooths prediction errors","Increasing training accuracy, which indirectly helps test accuracy","Limiting individual tree depth"],ans:1,exp:"The single tree overfits (high variance). Random Forest averages decorrelated trees, reducing variance approximately 1/B. Individual random errors cancel out."},
    {q:"Random Forest feature importance measures:",opts:["The p-value of each feature's correlation with the target","Total reduction in impurity caused by splits on each feature, averaged across all trees","The proportion of leaf nodes that use each feature","Whether each feature has a linear relationship with the target"],ans:1,exp:"Feature importance = sum of impurity reduction caused by splits on that feature, weighted by samples, averaged across all trees."},
    {q:"What is a key limitation of decision trees for regression?",opts:["They can't handle more than two classes","They require all features to be on the same scale","They cannot extrapolate beyond the range of values seen during training","They only model linear relationships"],ans:2,exp:"Decision tree regression predicts the mean of training samples in each leaf. Since leaves are bounded by observed training values, the model can't predict values outside the training range."}
  ]
}},
{id:'distances',label:'Distance & Similarity',color:'#A65A2C',content:{
  definition:"Mathematical measures of how similar or different two points are in feature space — the foundation for KNN, clustering, and any algorithm that reasons about proximity.",
  explanation:[
    {heading:"Euclidean and Manhattan Distance",body:`EUCLIDEAN DISTANCE — the straight-line distance:\n$$d_{\\text{Euclid}}(\\mathbf{a},\\mathbf{b}) = \\sqrt{\\sum_{i=1}^{n}(a_i-b_i)^2}$$\nThe standard choice for continuous numeric features. Sensitive to large differences in any single dimension due to squaring.\n\nMANHATTAN DISTANCE — sum of absolute differences:\n$$d_{\\text{Manhattan}}(\\mathbf{a},\\mathbf{b}) = \\sum_{i=1}^{n}|a_i-b_i|$$\nMore robust to outliers — no squaring. Scales better to high dimensions. For the same two points, Manhattan $\\geq$ Euclidean.`},
    {heading:"Cosine Similarity — Direction Over Magnitude",body:`Cosine similarity measures the angle between two vectors, ignoring their length:\n$$\\cos(\\mathbf{a},\\mathbf{b}) = \\frac{\\mathbf{a}\\cdot\\mathbf{b}}{\\|\\mathbf{a}\\|\\,\\|\\mathbf{b}\\|} = \\frac{\\displaystyle\\sum_i a_i b_i}{\\sqrt{\\displaystyle\\sum_i a_i^2}\\cdot\\sqrt{\\displaystyle\\sum_i b_i^2}}$$\n\nRange: $-1$ (opposite directions) to $+1$ (same direction). $0$ means perpendicular (unrelated).\n\nCosine distance $= 1 - \\cos(\\mathbf{a},\\mathbf{b})$.\n\nWHEN TO USE: text and document similarity, recommendation systems, any sparse high-dimensional data where direction matters more than magnitude.`},
    {heading:"Feature Scaling and the Curse of Dimensionality",body:`FEATURE SCALING IS MANDATORY:\n  All distance metrics combine feature differences into one number.\n  An unscaled feature with a large range will dominate.\n\nZ-score standardization:\n$$x' = \\frac{x-\\mu}{\\sigma}$$\n\nMin-max scaling:\n$$x' = \\frac{x-x_{\\min}}{x_{\\max}-x_{\\min}}$$\n\nAlways fit the scaler on training data only, then apply to test data.\n\nTHE CURSE OF DIMENSIONALITY:\n  As features grow, all pairwise distances converge — everything becomes equidistant. The concept of "nearest neighbor" breaks down.\n  This is why distance-based algorithms struggle with more than $\\approx 50$–100 features.`}
  ],
  keyPoints:[
    {title:"Euclidean Distance",body:"$$d = \\sqrt{\\sum(a_i-b_i)^2}$$\nStraight-line distance. Default for continuous data.\nRequires feature scaling. Sensitive to outliers."},
    {title:"Manhattan Distance",body:"$$d = \\sum|a_i-b_i|$$\nCity-block distance. More robust (no squaring).\nScales better to high dimensions."},
    {title:"Cosine Similarity",body:"$$\\cos = \\frac{\\mathbf{a}\\cdot\\mathbf{b}}{\\|\\mathbf{a}\\|\\|\\mathbf{b}\\|}$$\nMeasures angle — direction, not magnitude.\nStandard for text and document similarity."},
    {title:"Feature Scaling is Mandatory",body:"Z-score: $x' = (x-\\mu)/\\sigma$\nMin-max: $x' = (x-x_{\\min})/(x_{\\max}-x_{\\min})$\nFit scaler on training data only — apply to test."},
    {title:"Curse of Dimensionality",body:"In high dimensions, all distances converge — everything equidistant.\n'Nearest' loses meaning past $\\approx 50$–100 features.\nUse PCA before distance-based algorithms."},
    {title:"Choosing a Metric",body:"Continuous, geometric: Euclidean or Manhattan.\nText, sparse, high-dim: Cosine similarity.\nBinary features: Hamming distance.\nWhen unsure: try multiple and compare."}
  ],
  watchOut:"Never apply distance-based algorithms to unscaled features — one of the most common bugs in ML practice. Always fit your scaler on the training set and apply it to the test set. Fitting on the full dataset introduces data leakage: the test set's statistics influence the transformation applied during training.",
  questions:[
    {q:"What does Euclidean distance measure?",opts:["The angle between two feature vectors","The straight-line distance between two points in feature space","The total number of features that differ between two points","The correlation between two samples"],ans:1,exp:"Euclidean distance = sqrt(Σ(ai-bi)²). It measures the length of the straight line between two points — a direct extension of the Pythagorean theorem."},
    {q:"Which metric is best for comparing two documents as word frequency vectors?",opts:["Euclidean distance","Manhattan distance","Cosine similarity","Hamming distance"],ans:2,exp:"Cosine similarity measures the angle between vectors, ignoring magnitude. A short and a long document discussing the same topic will have different lengths but similar directions."},
    {q:"Two features: age (0–100) and income (0–200,000). Without scaling in KNN:",opts:["Both contribute equally","Age dominates","Income dominates — differences in income dwarf age differences","The model normalizes features internally"],ans:2,exp:"Income differences (e.g. $50,000) contribute 50,000² = 2.5 billion to squared Euclidean distance. Age differences (e.g. 10 years) contribute 100. Income completely dominates."},
    {q:"What is the curse of dimensionality?",opts:["Too many hyperparameters","In high dimensions, all pairwise distances converge — data becomes sparse and 'nearest' loses meaning","The exponential increase in training time as features increase","When features exceed the number of training samples"],ans:1,exp:"As dimensions increase, data becomes increasingly sparse and all points become approximately equidistant. The concept of 'nearest neighbor' breaks down."},
    {q:"Manhattan distance between (1,2) and (4,6):",opts:["5 (Euclidean)","7 (|4-1| + |6-2| = 3 + 4)","25 (squared Euclidean)","sqrt(25) = 5"],ans:1,exp:"Manhattan = Σ|ai-bi| = |4-1| + |6-2| = 3 + 4 = 7. Sum of absolute differences in each dimension."},
    {q:"Cosine similarity = 1.0 between two vectors means:",opts:["The vectors are perpendicular (unrelated)","The vectors point in exactly the same direction","The vectors are opposite in direction","The vectors have the same magnitude"],ans:1,exp:"cos(0°) = 1: vectors point in the same direction. cos(90°) = 0: perpendicular. cos(180°) = -1: opposite."},
    {q:"Why fit the scaler on training data only?",opts:["Fitting on full data is too expensive","Fitting on full data includes test set statistics, leaking test information into training — data leakage","The scaler can only process data it was trained on","Test data has different distributions that confuse the scaler"],ans:1,exp:"If you fit the scaler on train+test together, the test set's mean and variance influence the transformation applied during training. This is data leakage."},
    {q:"When is Manhattan distance preferable to Euclidean?",opts:["When you need straight-line distance between geographic coordinates","When features are high-dimensional and you want a metric less sensitive to outlier feature differences","When you need to compare direction of feature vectors","When all features are binary"],ans:1,exp:"Manhattan doesn't square differences, so a single feature with a very large difference doesn't dominate. In high dimensions, this makes Manhattan more robust."}
  ]
}},
{id:'knn',label:'K-Nearest Neighbors',color:'#1A5C3D',content:{
  definition:"A non-parametric algorithm that classifies new points by majority vote of their K closest training examples — no training required, just distance computation at prediction time.",
  explanation:[
    {heading:"The Lazy Learner and the Effect of K",body:`KNN does zero work during training. At prediction time:\n  1. Receive a new point $\\mathbf{x}$.\n  2. Compute distance to every training point.\n  3. Find the $K$ nearest.\n  4. Classification: majority class vote. Regression: average of $K$ values.\n\nK CONTROLS THE BIAS-VARIANCE TRADEOFF:\n  $K=1$: decision boundary contorts to every training point. Training accuracy: 100%. High variance — overfitting.\n  $K=N$: every point classified as the majority class. Maximum underfitting.\n\nSWEET SPOT: small $K$ = low bias, high variance. Large $K$ = high bias, low variance.\nRule of thumb: $K \\approx \\sqrt{n_{\\text{samples}}}$. Always validate with cross-validation. Use odd $K$ for binary classification.`},
    {heading:"Weighted KNN and Distance Choices",body:`STANDARD KNN: each of the $K$ neighbors gets one vote.\nWEIGHTED KNN: closer neighbors get more weight:\n$$\\text{weight}_i = \\frac{1}{d_i^2}$$\n\nA neighbor at distance $0.1$ should matter far more than one at distance $10$. Standard KNN treats them equally; weighted KNN respects proximity.\n\nKNN naturally outputs a soft probability:\n$$P(\\text{class}=k \\mid \\mathbf{x}) = \\frac{\\text{votes for class }k}{K}$$\n\nIn scikit-learn: KNeighborsClassifier(weights='distance')`},
    {heading:"Computational Cost and Limitations",body:`PREDICTION COST:\n$$\\mathcal{O}(n \\cdot d) \\text{ per query}$$\nFor $n$ training samples and $d$ features, prediction requires computing $n$ distances. 100k samples × 100 features = 10M multiplications per prediction.\n\nKNN FAILS WHEN:\n  HIGH DIMENSIONALITY: in high dimensions all points become approximately equidistant — KNN's core assumption breaks down.\n  LARGE DATASETS: $\\mathcal{O}(n \\cdot d)$ per prediction becomes impractical.\n  IRRELEVANT FEATURES: KNN weights all features equally. Noise features pull neighbors in wrong directions.`}
  ],
  keyPoints:[
    {title:"Lazy Learner",body:"No training phase — stores all training data.\nAll computation at prediction: find $K$ nearest, majority vote.\nThe model IS the training data."},
    {title:"Effect of K",body:"Small $K$: high variance (overfitting). Large $K$: high bias (underfitting).\nRule of thumb: $K \\approx \\sqrt{n}$.\nAlways use odd $K$ for binary classification."},
    {title:"Feature Scaling Is Required",body:"KNN is purely distance-based. Unscaled features dominate.\nStandardize: $x' = (x-\\mu)/\\sigma$.\nFit scaler on training data only."},
    {title:"Weighted KNN",body:"$\\text{weight}_i = 1/d_i^2$ — closer neighbors vote more.\nMore robust than uniform voting.\nsklearn: KNeighborsClassifier(weights='distance')"},
    {title:"Prediction Cost",body:"$$\\mathcal{O}(n \\cdot d) \\text{ per prediction}$$\nSlow for large datasets. Use KD-trees or\napproximate KNN (FAISS, Annoy) for speed."},
    {title:"Curse of Dimensionality",body:"In high dimensions, all distances converge.\nKNN degrades past $\\approx 20$–50 features.\nApply PCA or feature selection before KNN."}
  ],
  watchOut:"KNN stores the entire training dataset — it can be impractical for very large datasets both in memory and prediction speed. For large-scale use, consider approximate nearest neighbor algorithms (like FAISS or Annoy) or switch to a model that compresses the training data into parameters.",
  questions:[
    {q:"Why is KNN called a 'lazy learner'?",opts:["It uses a simplified training algorithm","It performs no computation during training — all work happens at prediction time","It only uses a fraction of training data","It relies on random sampling to speed up training"],ans:1,exp:"KNN literally does nothing during 'training' — it just stores the data. At prediction time it computes distances, finds K nearest, and votes."},
    {q:"With K=1, what is KNN's training accuracy?",opts:["Depends on class balance","50% — random guess","100% — every point's nearest neighbor is itself","Varies with decision boundary complexity"],ans:2,exp:"With K=1, each training point's nearest neighbor is itself (distance=0). Every training point is classified as its own class — 100% training accuracy. Classic overfitting."},
    {q:"Increasing K from 3 to 50 typically:",opts:["Increases variance and decreases bias","Decreases variance and increases bias, creating a smoother decision boundary","Increases both variance and bias","Has no effect on bias or variance"],ans:1,exp:"Larger K averages over more neighbors, smoothing the boundary. This reduces variance but increases bias. Very large K causes underfitting."},
    {q:"Why must features be scaled before applying KNN?",opts:["KNN requires normally distributed features","Large-range features dominate the distance metric, effectively making KNN ignore other features","KNN uses matrix operations requiring normalized inputs","Feature scaling reduces training time"],ans:1,exp:"KNN computes distances. A feature with values 0–200,000 contributes far more to distance than one with values 0–1. Without scaling, KNN essentially ignores low-range features."},
    {q:"What is the main computational disadvantage of KNN for large datasets?",opts:["Training requires O(n²) pairwise computations","Each prediction requires computing distances to all n training points: O(n × d) per query","The K hyperparameter grows with dataset size","KNN must re-sort training data for every prediction"],ans:1,exp:"KNN prediction is O(n × d): compute distance to all n training samples across d features. Very slow without approximate methods."},
    {q:"With 500 features, KNN is likely to fail because:",opts:["KNN requires more samples than features","In high dimensions, all distances converge — 'nearest' neighbors are not meaningfully closer than random points","KNN can't handle more than 100 features","High dimensionality makes K continuous"],ans:1,exp:"The curse of dimensionality: in 500 dimensions, all points are approximately equidistant — the concept of 'nearest neighbor' loses meaning."},
    {q:"Weighted KNN with weight = 1/d² differs from standard KNN how?",opts:["It uses distance-weighted voting, so closer neighbors have more influence","It squares the number of neighbors, using K² total votes","It normalizes class votes so they sum to 1","It only considers neighbors within distance d"],ans:0,exp:"Weighted KNN gives closer neighbors more influence. Standard KNN treats all K neighbors equally. Weight = 1/d² makes a neighbor at d=0.1 influence the prediction 10,000× more than one at d=10."},
    {q:"For binary classification with K=4, two neighbors are class A and two are class B. What should you do?",opts:["Default to class A (alphabetical)","Use K=5 instead — always use odd K for binary classification","Average probabilities: 50% for both","Increase the threshold to break the tie"],ans:1,exp:"With K=4 and a 50/50 split, you have a tie. Use odd K for binary classification to prevent this."}
  ]
}},
{id:'clustering',label:'Clustering',color:'#3A6B4A',content:{
  definition:"An unsupervised approach to discovering natural groupings in unlabeled data — finding structure without being told what to look for.",
  explanation:[
    {heading:"K-Means Algorithm",body:`K-Means minimises within-cluster sum of squared distances (inertia):\n$$\\text{Inertia} = \\sum_{k=1}^{K}\\sum_{\\mathbf{x}\\in C_k} \\|\\mathbf{x}-\\boldsymbol{\\mu}_k\\|^2$$\n\nALGORITHM (Lloyd's):\n  1. Choose $K$ and initialise $K$ centroids (use K-Means++ for better results).\n  2. Assign each point to the nearest centroid: $c_i = \\arg\\min_k\\|\\mathbf{x}_i-\\boldsymbol{\\mu}_k\\|^2$\n  3. Recompute centroids: $\\boldsymbol{\\mu}_k = \\frac{1}{|C_k|}\\sum_{\\mathbf{x}\\in C_k}\\mathbf{x}$\n  4. Repeat steps 2–3 until centroids stop moving.\n\nK-Means always converges but may converge to a local minimum. Use multiple restarts (n_init) and K-Means++ initialisation.`},
    {heading:"Choosing K — Elbow and Silhouette",body:`ELBOW METHOD:\n  Run K-Means for $K=1,2,\\ldots,15$. Plot inertia vs. $K$.\n  Look for the elbow — where inertia stops decreasing sharply. Often ambiguous.\n\nSILHOUETTE SCORE:\n  For each point $i$:\n  $a_i$ = average distance to same-cluster points (cohesion)\n  $b_i$ = average distance to nearest other cluster (separation)\n\n$$s_i = \\frac{b_i - a_i}{\\max(a_i,\\, b_i)} \\in [-1,\\, +1]$$\n\n  $s_i \\approx +1$: well-clustered. $s_i \\approx 0$: on the boundary. $s_i < 0$: likely misassigned.\n\n  Choose $K$ that maximises average silhouette score. Aim for $s > 0.5$.`},
    {heading:"DBSCAN — Density-Based Clustering",body:`DBSCAN discovers clusters as dense regions separated by sparse regions. No $K$ required.\n\nKEY PARAMETERS:\n  $\\varepsilon$ (epsilon): maximum distance to be considered a neighbor.\n  $m$ (min_samples): minimum points in a neighborhood to form a dense region.\n\nPOINT TYPES:\n  CORE POINT: has $\\geq m$ points within $\\varepsilon$ distance.\n  BORDER POINT: within $\\varepsilon$ of a core point, but not enough neighbors itself.\n  NOISE POINT: not within $\\varepsilon$ of any core point — an outlier.\n\nADVANTAGES OVER K-MEANS:\n  - Discovers arbitrarily shaped clusters.\n  - No $K$ needed — discovers the number of clusters automatically.\n  - Explicitly identifies outliers as noise.\n  - Robust to outliers (they don't distort cluster centers).`}
  ],
  keyPoints:[
    {title:"K-Means Objective",body:"$$\\text{Inertia} = \\sum_k\\sum_{\\mathbf{x}\\in C_k}\\|\\mathbf{x}-\\boldsymbol{\\mu}_k\\|^2$$\nMinimise within-cluster sum of squared distances."},
    {title:"Silhouette Score",body:"$$s_i = \\frac{b_i - a_i}{\\max(a_i, b_i)} \\in [-1,+1]$$\n$+1$: well-clustered. $0$: on boundary. $<0$: misassigned."},
    {title:"K-Means Limitations",body:"Assumes spherical clusters of similar size.\nSensitive to scale — standardize features first.\nRequires $K$ upfront. K-Means++ prevents bad inits."},
    {title:"DBSCAN",body:"Density-based: clusters = dense regions.\nNo $K$ needed. Handles arbitrary shapes.\nExplicitly marks noise/outlier points."},
    {title:"Core / Border / Noise",body:"Core: $\\geq m$ points within $\\varepsilon$.\nBorder: within $\\varepsilon$ of a core, but not core itself.\nNoise: not within $\\varepsilon$ of any core — an outlier."},
    {title:"Evaluating Clusters",body:"Silhouette score (no labels needed).\nIf ground truth exists: Adjusted Rand Index or NMI.\nVisualise with PCA or t-SNE projections."}
  ],
  watchOut:"K-Means does not guarantee a global optimum — different initializations give different results. Always run with multiple restarts (n_init ≥ 10) and K-Means++ initialization. Also: clustering is sensitive to scale — standardize features first. Different algorithms on the same data can give completely different valid clusterings.",
  questions:[
    {q:"In K-Means, what does each centroid represent after convergence?",opts:["The training sample closest to the cluster center","The mean (average) of all points assigned to that cluster","The point with the lowest distance to all others","A randomly selected representative"],ans:1,exp:"At each step, K-Means recomputes each centroid as the arithmetic mean of all assigned points. After convergence, centroids sit at the center of mass of their clusters."},
    {q:"What objective function does K-Means minimise?",opts:["Total distance between all pairs of points","Within-cluster sum of squared distances (inertia)","The silhouette score","Between-cluster variance / within-cluster variance"],ans:1,exp:"K-Means minimises inertia = Σ Σ ||x - μ_k||² — the sum of squared distances from each point to its assigned centroid."},
    {q:"The elbow in the K-Means elbow method indicates:",opts:["The maximum possible K","The K where inertia stops decreasing sharply — adding more clusters yields diminishing returns","The K that maximises silhouette score","The K where training time starts increasing exponentially"],ans:1,exp:"As K increases, inertia always decreases. The elbow marks where reductions slow dramatically — additional clusters don't create much more structure."},
    {q:"What is a core point in DBSCAN?",opts:["The first point added to a cluster","A point with at least min_samples neighbors within distance ε","The centroid of a cluster","A point equidistant from two or more cluster centers"],ans:1,exp:"In DBSCAN, a core point has at least min_samples other points within ε distance. Core points form the dense interiors of clusters."},
    {q:"What is the main advantage of DBSCAN over K-Means?",opts:["DBSCAN is faster on large datasets","DBSCAN can discover clusters of arbitrary shape and doesn't require specifying K","DBSCAN always finds the global optimum","DBSCAN requires no hyperparameters"],ans:1,exp:"K-Means assumes spherical clusters and requires K upfront. DBSCAN defines clusters as dense regions, discovering arbitrary shapes automatically and identifying outliers."},
    {q:"A point has silhouette score s = -0.4. What does this mean?",opts:["The point is well-clustered at its cluster center","The point is on the boundary between clusters","The point is likely misassigned — closer to a neighbouring cluster than its own","The point is a noise outlier"],ans:2,exp:"Silhouette s = (b-a)/max(a,b). Negative s means a > b: the point is closer to another cluster than to its own — likely misassigned."},
    {q:"Why standardise features before K-Means?",opts:["K-Means requires normally distributed features","K-Means uses Euclidean distance — large-range features dominate cluster assignments","Standardisation speeds up convergence","K-Means++ requires standardised features"],ans:1,exp:"K-Means assigns points to the nearest centroid using Euclidean distance. If one feature has range 0–100,000 and another 0–1, the large-range feature completely dominates."},
