// ── 3: MODEL EVALUATION ─────────────────────
{
  id:'model-evaluation', label:'Model Evaluation', color:'#9B3A22',
  content:{
    definition:"The discipline of rigorously measuring whether your model actually works on data it has never seen — and understanding precisely how and where it fails.",
    explanation:[
      {heading:"Why Evaluation Is Its Own Skill", body:`Building a model is only half the job. The other half is knowing whether it works — and where it fails.

Evaluation is harder than it sounds because of one central trap: if you measure a model's performance on the data it trained on, you're measuring memorization, not learning. A model that perfectly memorizes training data fails catastrophically on new data while showing near-perfect training accuracy.

Good evaluation answers three questions:
  1. How well does this model perform on data it's never seen?
  2. In what specific ways does it fail?
  3. Is that performance good enough for the actual use case?

The third question is the one most people forget. "Good enough" is entirely context-dependent — 90% accuracy might be dangerously inadequate for a cancer detector but excellent for a movie recommender.`},
      {heading:"Train / Test Split — The Golden Rule", body:`The most fundamental rule: never test on data you trained on.

The standard approach is a train/test split — typically 80/20:
  Training set (80%): the model sees this data and learns from it.
  Test set (20%): held out completely. The model never sees this during training.

After training, evaluate performance on the test set. This simulates real deployment — you're measuring performance on data the model has genuinely never encountered.

THE TEST SET IS SACRED.
  If you use it to make decisions (tuning hyperparameters, selecting features, choosing algorithms), it becomes contaminated — you've trained on it indirectly.

For hyperparameter tuning, use a third split — the validation set:
  Training set:   model trains here.
  Validation set: you tune hyperparameters and compare model variants here.
  Test set:       you touch this exactly once, for final evaluation.`},
      {heading:"K-Fold Cross-Validation", body:`An 80/20 split works with large datasets, but with smaller datasets you might get an unlucky split. K-Fold Cross-Validation gives a more reliable estimate.

HOW IT WORKS:
  1. Split the full dataset into K equal folds (typically K=5 or K=10).
  2. For fold i: train on all folds except i, evaluate on fold i.
  3. Repeat K times — each fold serves as the test set exactly once.
  4. Average the K scores. This is your performance estimate.

Every sample is used for both training and testing. You get K estimates and average them — far more stable than a single split.

WHY IT MATTERS:
  With a single 80/20 split, a lucky or unlucky split can make a model look better or worse than it is. With 5-fold CV, that variance is averaged out.
  
  Cost: K times as much computation. K=3 or K=5 is reasonable for slow models or large datasets.`},
      {heading:"Evaluating Regression Models", body:`For regression problems (predicting a number), the key metrics are:

MEAN ABSOLUTE ERROR (MAE):
  MAE = (1/n) * Σ |yi - y_hat_i|
  Average absolute difference between predictions and actuals.
  Intuitive: "on average, my predictions are off by X units."
  Robust to outliers — doesn't amplify large errors.

MEAN SQUARED ERROR (MSE) and RMSE:
  MSE  = (1/n) * Σ (yi - y_hat_i)²
  RMSE = sqrt(MSE)
  Squares errors, so large mistakes are penalized much more heavily.
  RMSE is back in the same units as y — easier to interpret than MSE.
  Most commonly reported regression metric.

R-SQUARED (R²):
  R² = 1 - (SS_residual / SS_total)
  Proportion of variance in y explained by the model.
  R²=1.0: perfect. R²=0.0: no better than always predicting the mean. R²<0: worse than the mean.
  
  "R²=0.87" means the model explains 87% of the variation in y. The remaining 13% is noise, missing features, or model limitations.

WHICH TO USE:
  MAE: when large errors are not disproportionately costly.
  RMSE: when large errors are especially bad.
  R²: when you want to understand how much signal the model captures.`},
      {heading:"Why Accuracy Alone Is Dangerous", body:`Accuracy = correct predictions / total predictions.

It sounds reliable. It is often dangerously misleading.

THE CLASSIC TRAP:
  You build a model to detect a rare disease affecting 1% of the population.
  Your model predicts "healthy" for everyone. Accuracy = 99%.
  The model caught zero sick patients. It is completely useless.

When classes are imbalanced, accuracy is dominated by the majority class. A model can achieve high accuracy by completely ignoring the minority class.

This isn't a rare edge case. It's the norm for fraud detection, disease detection, defect detection, spam filtering — any real-world problem where the interesting outcome is rare.

WHAT TO DO:
  Check the class distribution before choosing any metric.
  Use precision, recall, F1, and ROC/AUC for classification.
  If 95% of your data is class 0, a model with 95% accuracy might not be doing anything useful.`},
      {heading:"The Confusion Matrix", body:`Every classification metric flows from four numbers:

  True Positives  (TP): Predicted positive. Actually positive. Correct.
  True Negatives  (TN): Predicted negative. Actually negative. Correct.
  False Positives (FP): Predicted positive. Actually negative. Wrong. (Type I Error — false alarm)
  False Negatives (FN): Predicted negative. Actually positive. Wrong. (Type II Error — missed it)

Spam detection example:
  TP: Model said spam. It was spam. Correctly blocked.
  TN: Model said ham. It was ham. Correctly delivered.
  FP: Model said spam. It was a real email. User missed something important.
  FN: Model said ham. It was spam. Spam got through.

Every metric below is derived from these four numbers. Understanding the confusion matrix means you understand exactly how and where the model fails.`},
      {heading:"Precision, Recall, and F1", body:`PRECISION — How trustworthy are positive predictions?
  Precision = TP / (TP + FP)
  "Of all the times I predicted positive, how often was I right?"
  High precision = few false alarms.
  Use when false positives are costly: spam filtering (legitimate emails lost).

RECALL (Sensitivity) — Did we catch everything?
  Recall = TP / (TP + FN)
  "Of all the actual positive cases, how many did I catch?"
  High recall = few missed positives.
  Use when false negatives are costly: cancer screening (missed diagnoses).

THE TENSION:
  Lower the decision threshold → predict positive more often → recall goes up, precision goes down.
  Raise the threshold → only predict positive when very confident → precision goes up, recall goes down.
  They are in direct tension, controlled by your classification threshold.

F1 SCORE — The harmonic balance:
  F1 = 2 * (Precision * Recall) / (Precision + Recall)
  
  Uses harmonic mean (not arithmetic). Why? Arithmetic mean of 0.9 and 0.1 is 0.5 — looks okay.
  Harmonic mean of 0.9 and 0.1 is 0.18 — exposes the imbalance.
  F1 cannot be gamed by extreme imbalance between precision and recall.`},
      {heading:"ROC Curves and AUC", body:`ROC CURVE (Receiver Operating Characteristic):
  Plots True Positive Rate (Recall) vs. False Positive Rate at every possible threshold:
    FPR = FP / (FP + TN) — how often does the model raise a false alarm on negatives?
  
  A perfect model: upper-left corner (TPR=1, FPR=0) at some threshold.
  A random model: the diagonal — TPR equals FPR at every threshold.
  The curve shows the full range of tradeoffs between catching positives and generating false alarms.

AUC — AREA UNDER THE ROC CURVE:
  Summarizes the entire ROC curve in one number.
  AUC = 1.0: perfect classifier.
  AUC = 0.5: random guessing — no discrimination whatsoever.
  AUC = 0.7–0.9: typical range for a useful model.
  
  Intuition: AUC = the probability that a randomly drawn positive example gets a higher model score than a randomly drawn negative example.

WHEN TO USE WHICH:
  AUC: threshold-independent — good for comparing models at different operating points.
  F1: threshold-specific — good when you've chosen a threshold and need one number.
  RMSE / R²: for regression problems.`}
    ],
    keyPoints:[
      {title:"Train / Test / Validation",body:"Never test on training data.\nTraining = model learns. Validation = you tune. Test = final evaluation, touched once.\nTest set contamination is the most common mistake."},
      {title:"K-Fold Cross-Validation",body:"Split into K folds. Each fold is the test set once.\nAverage K scores for a reliable estimate.\nMore stable than a single 80/20 split, especially on smaller datasets."},
      {title:"Regression Metrics",body:"MAE = average absolute error (interpretable, robust)\nRMSE = sqrt(MSE) — penalizes large errors more\nR² = 1 - SS_res/SS_tot — proportion of variance explained"},
      {title:"The Accuracy Trap",body:"On imbalanced datasets, a model can get 99% accuracy by predicting the majority class only.\nAlways check class distribution before choosing metrics."},
      {title:"Precision vs. Recall",body:"Precision = TP/(TP+FP): are positive predictions trustworthy?\nRecall = TP/(TP+FN): are we catching all positives?\nThey trade off against each other via the decision threshold."},
      {title:"F1 and AUC",body:"F1: harmonic mean of precision and recall. Cannot be gamed by imbalance.\nAUC: probability that a random positive scores higher than a random negative. Threshold-independent."}
    ],
    watchOut:"Never tune hyperparameters on the test set — it contaminates it. The test set must be touched exactly once: for final evaluation. Every decision made during development should be based on the training and validation sets only. This is the most frequently violated rule in ML practice.",
    questions:[
      {q:"Why is evaluating a model on its training data misleading?",opts:["Training data is always biased and not representative","It measures memorization, not generalization — the model has already seen the answers","Models cannot be mathematically evaluated on training data","Training data evaluation always has higher variance than test evaluation"],ans:1,exp:"Evaluating on training data measures how well the model memorized those specific examples — including their noise. It tells you nothing about performance on new data, which is the only performance that matters in production."},
      {q:"Why is a separate validation set needed in addition to the test set?",opts:["To provide extra training data when the training set is too small","To tune hyperparameters without contaminating the test set with those decisions","To measure final model performance before deployment","To detect data drift after deployment"],ans:1,exp:"If you tune hyperparameters using the test set, it becomes contaminated — you've effectively trained on it. A validation set handles all tuning decisions. The test set is sacred and touched exactly once: for final evaluation."},
      {q:"In 5-fold cross-validation, how many times is each data point used as a test sample?",opts:["5 times","4 times","1 time","0 times — no point is ever in both train and test"],ans:2,exp:"Each fold serves as the test set exactly once. In 5-fold CV, every point is tested once and trained on 4 times. This gives a more stable performance estimate than a single split."},
      {q:"A fraud detector predicts 'no fraud' for every transaction. The dataset has 99% legitimate transactions. What is its accuracy?",opts:["50%","1%","99%","Undefined without a confusion matrix"],ans:2,exp:"Accuracy = correct/total. If 99% are legitimate and you always predict legitimate, accuracy = 99%. But the model caught zero fraudulent cases. This is the accuracy trap on imbalanced datasets — high accuracy, zero utility."},
      {q:"You want to minimize false positives in a legal document review system. Which metric do you optimize?",opts:["Recall","Accuracy","AUC","Precision"],ans:3,exp:"Precision = TP/(TP+FP). Optimizing precision means fewer false positives — fewer irrelevant documents incorrectly flagged as relevant. Lawyers reviewing false positives is expensive; precision must be high even if it means missing some relevant documents."},
      {q:"What does AUC = 0.5 on the ROC curve indicate?",opts:["The model is 50% accurate","The model performs no better than random guessing across all thresholds","The model has a perfect balance of precision and recall","Half the test samples are classified correctly at the default threshold"],ans:1,exp:"AUC = 0.5 means the ROC curve follows the diagonal — the True Positive Rate equals the False Positive Rate at every threshold. That's equivalent to random guessing. AUC = 1.0 is perfect discrimination."},
      {q:"A cancer screening model has precision=0.97 and recall=0.35. What is the main problem?",opts:["Too many false alarms — high FP rate","Missing 65% of actual cancer cases — extremely high FN rate","The model is overfitting to the training data","Precision and F1 are in conflict"],ans:1,exp:"Recall = 0.35 means the model only catches 35% of actual cancer cases — missing 65%. In medical screening, false negatives (missed diagnoses) are potentially fatal. Despite high precision, this model is dangerously bad for its use case."},
      {q:"Why does RMSE penalize large errors more than MAE?",opts:["RMSE uses division while MAE uses subtraction","RMSE squares errors before averaging — a mistake of 10 is penalized 100x more than a mistake of 1","RMSE is computed on a log scale","They penalize errors equally — only the units differ"],ans:1,exp:"RMSE squares each error before averaging: a prediction off by 10 contributes 100, while one off by 1 contributes 1. This quadratic penalization makes RMSE much more sensitive to outliers and large mistakes than MAE, which just averages absolute errors linearly."}
    ]
  }
},
// ── 4: OVERFITTING & REGULARIZATION ─────────
{
  id:'overfitting', label:'Overfitting & Regularization', color:'#5C3D6E',
  content:{
    definition:"The fundamental tension between fitting training data and generalizing to new data — and the mathematical tools to manage it.",
    explanation:[
      {heading:"Why Models Fail in the Real World", body:`A model that performs brilliantly during training but fails in production is worse than no model — it gives false confidence.

The root cause: models can learn two types of patterns in data:
  1. SIGNAL — the real, generalizable relationship between features and targets.
  2. NOISE — random fluctuations, measurement errors, or quirks specific to this training set.

A good model learns signal. A bad model also learns noise.

The problem: the model can't distinguish signal from noise directly. It just minimizes training error. Given enough complexity, it can and will memorize noise.

Think of studying for an exam by memorizing every practice question verbatim. When the real exam asks the same questions, you ace it. When it asks slightly different questions — you fail.

Machine learning has the same problem, and the same solution: generalize from examples instead of memorizing them.`},
      {heading:"Overfitting — When the Model Is Too Complex", body:`Overfitting happens when the model is too complex relative to the amount of training data available.

SYMPTOMS:
  Training accuracy:     very high (often near perfect)
  Test accuracy:         significantly lower
  Train-test gap:        large — the key diagnostic signal

CAUSES:
  - Model has too many parameters relative to data size.
  - Too few training examples.
  - Training too long (neural networks).
  - Too many features, some of which are noise.

FIXES:
  - More training data (often the most effective fix).
  - Simpler model (fewer parameters, shallower trees, fewer layers).
  - Regularization — penalize model complexity mathematically.
  - Dropout (neural networks).
  - Early stopping — stop training when validation loss stops improving.
  - Cross-validation — detect overfitting before deployment.`},
      {heading:"Underfitting — When the Model Is Too Simple", body:`Underfitting is the opposite problem: the model is too simple to capture real patterns.

SYMPTOMS:
  Training accuracy:   low
  Test accuracy:       also low (similar to training — but both are bad)
  Train-test gap:      small, but both scores are unacceptably poor

CAUSES:
  - Model too simple for the problem's actual complexity.
  - Insufficient informative features.
  - Too much regularization — over-constraining the model.
  - Training stopped too early.

FIXES:
  - More complex model (add layers, more parameters, higher-degree features).
  - Add more informative features.
  - Reduce regularization strength.
  - Train for more iterations.

The goal: find the sweet spot. Complex enough to capture real patterns, simple enough to generalize. This balance is the central challenge of applied ML.`},
      {heading:"The Bias-Variance Tradeoff", body:`Every model's error decomposes into three parts:
  Total Error = Bias² + Variance + Irreducible Noise

BIAS: Error from wrong assumptions in the model.
  High bias = model too simple = underfitting.
  The model consistently misses the true pattern, regardless of training data.
  Example: fitting a line to data with a clear curve.

VARIANCE: Error from sensitivity to training data fluctuations.
  High variance = model too complex = overfitting.
  The model's predictions change dramatically if you use a different training sample.
  Example: a degree-10 polynomial that threads through every noisy training point.

THE TRADEOFF:
  Increasing complexity: reduces bias (more capacity to learn), increases variance (more sensitivity to noise).
  Decreasing complexity: increases bias, reduces variance.

You can reduce one but only at the cost of the other. The optimal point minimizes Bias² + Variance — it's where total error is lowest.

IRREDUCIBLE NOISE:
  Some variance in y is random noise that no model can predict. This sets the floor on achievable error — no amount of cleverness can get below it.`},
      {heading:"Regularization — Constraining the Model", body:`Regularization adds a penalty term to the loss function for model complexity. Instead of just minimizing prediction error, the model also minimizes parameter size:

  Regularized Loss = Original Loss + λ * Complexity Penalty

λ (lambda) is the regularization strength:
  λ = 0:        no regularization (pure fit)
  Small λ:      light penalty, mostly fits data
  Large λ:      heavy penalty, heavily constrained — may underfit

HOW IT WORKS:
  Without regularization, the optimizer can assign arbitrarily large weights to fit noisy training points. Regularization makes large weights expensive, pushing the optimizer toward smaller, simpler solutions.

  Simpler models generalize better — less likely to have memorized noise.

CHOOSING λ:
  Too small → still overfitting.
  Too large → underfitting.
  λ is a hyperparameter. Tune it via cross-validation, never on the test set.`},
      {heading:"L1 (Lasso) vs L2 (Ridge) Regularization", body:`The two standard regularization forms differ only in how they penalize weights:

L2 REGULARIZATION — Ridge:
  Penalty = λ * Σwi²
  Full loss: MSE + λ * Σwi²

  Effect: Shrinks all weights toward zero but rarely to exactly zero.
  Large weights are penalized quadratically — doubly expensive.
  Result: a model with many small weights.
  
  Use when: most features contribute and you want to keep them all, just smaller.

L1 REGULARIZATION — Lasso:
  Penalty = λ * Σ|wi|
  Full loss: MSE + λ * Σ|wi|

  Effect: Drives some weights to exactly zero — automatic feature selection.
  The sharp corners of the L1 constraint geometry create sparsity.
  Result: a sparse model that uses only a subset of features.
  
  Use when: you suspect many features are irrelevant and want automatic selection.

ELASTIC NET:
  Penalty = λ1*Σ|wi| + λ2*Σwi²
  Combines sparsity from L1 and stability from L2.
  Good when features are correlated.

QUICK RULE:
  L2 (Ridge): shrinks weights, keeps all features.
  L1 (Lasso): zeroes weights, selects features.
  When unsure: start with L2.`}
    ],
    keyPoints:[
      {title:"Overfitting",body:"High train accuracy, low test accuracy.\nLarge train-test gap = key diagnostic.\nFixes: more data, simpler model, regularization, early stopping."},
      {title:"Underfitting",body:"Low accuracy on both train and test.\nSmall train-test gap but both scores are poor.\nFixes: more complex model, more features, less regularization."},
      {title:"Bias-Variance Tradeoff",body:"Bias = consistent error from wrong assumptions (underfitting).\nVariance = sensitivity to training data noise (overfitting).\nIncreasing complexity reduces bias, increases variance — they trade off."},
      {title:"Regularization",body:"Add a penalty for large weights: Loss + λ * penalty.\nSimpler, smaller weights → better generalization.\nλ controls strength — tune via cross-validation."},
      {title:"L2 / Ridge",body:"Penalty = λΣwi²\nShrinks weights toward zero but not to zero.\nKeeps all features, smaller weights. Best when all features matter."},
      {title:"L1 / Lasso",body:"Penalty = λΣ|wi|\nDrives some weights to exactly zero — automatic feature selection.\nBest when many features are irrelevant."}
    ],
    watchOut:"Regularization doesn't eliminate overfitting — it trades off against underfitting. Too large a lambda causes the model to underfit. Also: more training data is often more effective than any regularization technique. When in doubt, collect more data before tuning lambda.",
    questions:[
      {q:"A model achieves 99% training accuracy and 62% test accuracy. What is the problem?",opts:["Underfitting — the model is too simple to capture the patterns","The dataset is too small to evaluate accurately","Overfitting — the model memorized training data and has high variance","The learning rate was set too high during training"],ans:2,exp:"High training accuracy + significantly lower test accuracy = overfitting. The large gap shows the model memorized training data (including noise) and fails to generalize. Fixes: more data, regularization, simpler model."},
      {q:"A model achieves 58% training accuracy and 57% test accuracy on a binary problem where random guessing gives 50%. What is the problem?",opts:["Overfitting — the gap between train and test is suspiciously small","Underfitting — both scores are poor; the model can't capture the real pattern","Data leakage — test data contaminated the training process","This is good generalization — train and test are equal"],ans:1,exp:"Low accuracy on BOTH train and test, barely above chance — that's underfitting. The model is too simple to capture the real signal. A small train-test gap doesn't help if both scores are unacceptably low."},
      {q:"Which describes a high-bias model?",opts:["Performs well on training data but poorly on test data","Predictions change drastically if the training set changes slightly","Has wrong structural assumptions and misses patterns in both training and test data","Generates too many false positives across all thresholds"],ans:2,exp:"High bias means the model's assumptions are too restrictive — it can't capture the true complexity of the data. It consistently misses patterns in BOTH training and test. This is underfitting: systematically wrong regardless of how much data you provide."},
      {q:"L1 (Lasso) regularization tends to produce:",opts:["Weights that are uniformly small but nonzero","Sparse models where many weights are exactly zero","Larger weights than an unregularized model","Only positive weight values"],ans:1,exp:"L1 regularization creates sparsity: the geometry of the L1 penalty (a diamond shape in weight space) causes optimization to hit corners where individual weights are exactly zero. This makes L1 a built-in feature selection tool — irrelevant features get eliminated."},
      {q:"What does increasing lambda (regularization strength) do?",opts:["Increases model complexity and can cause overfitting","Shrinks weights toward zero, simplifying the model and potentially causing underfitting","Speeds up training by reducing gradient computation","Has no effect on model complexity — only affects training speed"],ans:1,exp:"Larger lambda imposes a stronger penalty on large weights, shrinking them toward zero. The model becomes simpler and more constrained. Too large a lambda causes underfitting — the model can't learn even the real signal."},
      {q:"Why can't you have both low bias and low variance simultaneously, in general?",opts:["You need different hardware for each","Increasing model complexity reduces bias but increases variance — they trade off along a curve","Low variance always implies high bias mathematically","You can achieve both with enough training data, always"],ans:1,exp:"The bias-variance tradeoff is fundamental: increasing complexity gives more capacity to fit real patterns (lower bias) but also more capacity to fit noise (higher variance). You can move along the curve, but the curve exists regardless."},
      {q:"Which of these is NOT a solution to overfitting?",opts:["Collecting more training data","Applying L2 regularization","Increasing model complexity by adding more features and parameters","Using early stopping on a validation set"],ans:2,exp:"Increasing complexity makes overfitting worse — a more complex model can fit noise even more precisely. The correct approaches for overfitting: more data, simpler model, regularization, dropout, early stopping, cross-validation."},
      {q:"What does L2 regularization add to the loss function?",opts:["A term proportional to the sum of absolute weight values","A term proportional to the sum of squared weight values","A penalty on the number of features used","A bonus for correctly classified examples"],ans:1,exp:"L2 adds lambda * Σwi² to the loss. The squared term makes large weights quadratically expensive, continuously pushing weights toward (but not to) zero. This shrinks all weights without creating sparsity — that's Ridge regression."}
    ]
  }
},
// ── 5: DECISION TREES & RANDOM FOREST ───────
{
  id:'decision-trees', label:'Decision Trees & Random Forest', color:'#B07A1F',
  content:{
    definition:"Decision trees split data by asking yes/no questions on features; Random Forest combines hundreds of trees trained on random data subsets to produce far more accurate and robust predictions.",
    explanation:[
      {heading:"The Decision Tree Intuition", body:`A decision tree mimics how humans make decisions: ask a series of yes/no questions until you reach a conclusion.

  Is income > $50k?
    Yes → Is age > 35? → Yes: likely to repay. No: moderate risk.
    No  → Is employment > 2 years? → Yes: moderate risk. No: high risk.

Each internal node tests a feature. Each branch represents an outcome. Each leaf node gives a prediction (class label or value).

What makes decision trees special:
  - Completely non-parametric — makes no assumptions about data distribution.
  - Handles both numerical and categorical features.
  - Automatically captures non-linear relationships and feature interactions.
  - Fully interpretable — you can trace exactly why any prediction was made.
  - No feature scaling needed.

The tree learns by finding splits that best separate the data into pure groups.`},
      {heading:"How Trees Split — Gini Impurity and Information Gain", body:`The tree greedily finds the split at each node that creates the purest children.

GINI IMPURITY (used by CART algorithm):
  Gini(S) = 1 - Σ pi²

  where pi is the proportion of class i in set S.
  Gini=0: perfectly pure node (all one class).
  Gini=0.5: maximum impurity (50/50 split in binary case).

ENTROPY and INFORMATION GAIN (used by ID3 / C4.5):
  H(S) = -Σ pi * log2(pi)
  IG(split) = H(parent) - weighted_average(H(left), H(right))

  We pick the split with the highest Information Gain — it creates the biggest reduction in impurity.

WHAT THE TREE DOES AT EACH NODE:
  1. For each feature, try every possible split threshold.
  2. Compute the Gini impurity (or IG) of the resulting split.
  3. Pick the feature and threshold that gives the lowest child impurity.
  4. Recurse on each child.
  5. Stop when: maximum depth reached, or node is pure, or minimum samples threshold met.

For regression trees: instead of impurity, minimize variance (MSE) of the two subsets.`},
      {heading:"The Overfitting Problem — Why Deep Trees Fail", body:`A fully grown decision tree will perfectly memorize the training data. Given enough depth, it can create one leaf per training sample.

Training accuracy: 100%. Test accuracy: often terrible.

This is overfitting in its purest form. The tree learned the noise — every outlier, every mislabeled sample — by creating arbitrarily specific splits.

PRUNING — the classic fix:
  Grow the full tree, then remove branches that don't improve performance on a validation set.
  Result: a shallower, more general tree.
  
MAX DEPTH:
  Limit how deep the tree can grow. A max_depth=5 tree can only create 2⁵=32 leaf nodes.
  Simple to control, works well in practice.
  
MIN SAMPLES TO SPLIT:
  Don't split a node if it has fewer than N samples.
  Prevents highly specific splits on tiny groups.

Even with these controls, a single decision tree is usually not a production-ready model. Its high variance makes it unreliable. Random Forest solves this.`},
      {heading:"Random Forest — Solving the Variance Problem", body:`Random Forest is simple in concept: train many decision trees, take a majority vote.

The key innovation is how it creates diversity among the trees — without diversity, averaging doesn't help much.

TWO SOURCES OF RANDOMNESS:
  1. BOOTSTRAP SAMPLING (Bagging):
     Each tree trains on a bootstrap sample — n samples drawn with replacement from the training set.
     Each sample includes ~63% unique points (some repeated, some omitted).
     So trees see different data and make different errors.

  2. RANDOM FEATURE SUBSETS:
     At each split, only consider a random subset of features:
       Classification: sqrt(p) features
       Regression: p/3 features
     This prevents the same dominant feature from being chosen by every tree.
     Result: trees are decorrelated — their errors are independent.

PREDICTION:
  Classification: majority vote across all trees.
  Regression: average of all trees' predictions.

WHY IT WORKS:
  If individual errors are uncorrelated, averaging reduces variance by roughly 1/B, where B is the number of trees. Adding more trees (up to ~200-500) consistently improves accuracy — a property almost no other algorithm has.`},
      {heading:"Random Forest — Practical Advantages", body:`OUT-OF-BAG (OOB) ERROR:
  Each training point is omitted from ~37% of bootstrap samples.
  Those omitted points can be used as a built-in validation set — no separate held-out set required.
  OOB error is a reliable, free estimate of generalization performance.

FEATURE IMPORTANCE:
  For each feature, measure how much total impurity reduction it causes across all trees.
  Features used in many early splits (high up the tree) score highest.
  This gives an interpretable ranking of which features matter most.
  Note: correlated features can split importance between them — interpret with caution.

HYPERPARAMETERS THAT MATTER:
  n_estimators: number of trees. More is better up to ~200-500; diminishing returns after that.
  max_depth: depth limit per tree. Shallow trees → higher bias but less variance.
  max_features: how many features to consider at each split. Controls tree diversity.
  min_samples_leaf: minimum samples per leaf. Prevents overly specific splits.

WHEN TO USE RANDOM FOREST:
  - Strong baseline for almost any tabular dataset.
  - When you can't afford to tune many hyperparameters.
  - When you need built-in feature importance.
  - When a single tree overfits badly.
  - When you want solid performance with minimal preprocessing.`}
    ],
    keyPoints:[
      {title:"Decision Tree Structure",body:"Root → internal nodes (feature tests) → leaf nodes (predictions).\nEach split asks: which threshold best separates the classes?\nNo feature scaling needed. Handles mixed feature types."},
      {title:"Splitting Criteria",body:"Gini: 1 - Σpi². Lower = purer.\nInformation Gain: H(parent) - weighted H(children). Higher = better split.\nAt each node: try all features × all thresholds, pick best."},
      {title:"Overfitting in Trees",body:"A fully grown tree perfectly memorizes training data.\nControl via max_depth, min_samples_leaf, pruning.\nBut even controlled single trees have high variance — use Random Forest instead."},
      {title:"Random Forest = Bagging + Random Features",body:"B trees, each trained on a bootstrap sample + random feature subsets.\nBootstrap: sampling with replacement.\nRandom features: sqrt(p) features per split. Creates decorrelated trees."},
      {title:"Out-of-Bag Error",body:"~37% of samples are never in a tree's bootstrap sample.\nUse these as a free validation set for each tree.\nOOB error ≈ cross-validation accuracy, without the extra computation."},
      {title:"Feature Importance",body:"Rank features by total impurity reduction across all trees.\nHighly informative for feature selection and interpretation.\nCorrelated features can split importance — interpret with care."}
    ],
    watchOut:"Feature importance from Random Forest can be misleading when features are correlated — importance gets split between them, making each look less important than it is. For true feature importance with correlated features, use permutation importance instead. Also: Random Forest doesn't extrapolate — it can only predict values within the range seen during training.",
    questions:[
      {q:"What does each internal node in a decision tree represent?",opts:["A final prediction for a group of samples","A test on a single feature — does x_i satisfy a threshold?","A weight applied to all samples reaching that node","A probability estimate for the positive class"],ans:1,exp:"Internal nodes test a single feature against a threshold (e.g., 'Is age > 35?'). Based on the answer, data flows to the left or right child. Only leaf nodes make final predictions."},
      {q:"Gini impurity of a node is 0. What does this mean?",opts:["The split at this node failed — all samples went to one side","The node is perfectly pure — all samples belong to the same class","Gini = 0 is the maximum impurity, indicating a 50/50 class split","The node has only one sample"],ans:1,exp:"Gini = 1 - Σpi². When all samples are the same class, one pi = 1 and all others = 0. So Gini = 1 - 1² = 0. A pure node — no further splitting needed. Maximum Gini is 0.5 for binary classification (50/50 split)."},
      {q:"Why does Random Forest use random feature subsets at each split?",opts:["To speed up training by reducing the number of features to evaluate","To create diversity among trees — prevents all trees from using the same dominant feature, keeping errors uncorrelated","To ensure all features are used at least once across the forest","To simulate L1 regularization by dropping irrelevant features"],ans:1,exp:"If all trees could use all features, they'd all pick the same dominant features and be highly correlated. Correlated trees make the same errors, so averaging doesn't help. Random feature subsets decorrelate the trees, making their individual errors cancel."},
      {q:"What is 'bootstrapping' in the context of Random Forest?",opts:["A method to reduce tree depth by pruning","Sampling n points with replacement from the training set — some points repeat, some are omitted","Scaling features before building each tree","Initializing tree weights randomly before training"],ans:1,exp:"Bootstrap sampling draws n samples with replacement from the training set. Each sample includes ~63% unique points (some appear multiple times, ~37% are never selected). This gives each tree a different training set, creating model diversity."},
      {q:"What is Out-of-Bag (OOB) error in Random Forest?",opts:["Error computed on the training set","Error computed on samples not included in a tree's bootstrap sample — a free built-in validation set","Error from trees that were pruned during training","The variance component of the bias-variance tradeoff"],ans:1,exp:"Each bootstrap sample omits ~37% of training points. Those points are 'out of bag' for that tree and can be used to evaluate it. Averaging OOB errors across all trees gives a reliable generalization estimate without needing a separate validation set."},
      {q:"A single decision tree achieves 98% training accuracy and 71% test accuracy. Adding more trees to create a Random Forest most directly helps by:",opts:["Reducing bias — each new tree is simpler and corrects previous trees' biases","Reducing variance — averaging decorrelated trees smooths out individual prediction errors","Increasing the training accuracy further, which indirectly improves test accuracy","Preventing overfitting by limiting how deep any individual tree can grow"],ans:1,exp:"The single tree overfits (high variance). Random Forest averages many decorrelated trees. Averaging reduces variance: Var(average of B independent models) ≈ Var(single model) / B. The test accuracy improves because individual random errors cancel out."},
      {q:"Random Forest's feature importance measures:",opts:["The p-value of each feature's correlation with the target","Total reduction in impurity caused by splits on each feature, averaged across all trees","The proportion of leaf nodes that use each feature","Whether each feature has a linear relationship with the target"],ans:1,exp:"Feature importance = sum of impurity reduction caused by splits on that feature, weighted by the number of samples reaching each split, averaged across all trees. Features that cause many high-gain splits score highest."},
      {q:"What is a key limitation of decision trees for regression problems?",opts:["They can't handle more than two classes","They require all features to be on the same scale","They cannot extrapolate beyond the range of values seen during training","They only model linear relationships between features and targets"],ans:2,exp:"Decision tree regression predicts the mean of training samples in each leaf. Since leaves are bounded by observed training values, the model can't predict values outside the training range — it will just predict the maximum or minimum it saw. This is called the inability to extrapolate."}
    ]
  }
},
// ── 6: DISTANCE & SIMILARITY ────────────────
{
  id:'distances', label:'Distance & Similarity', color:'#A65A2C',
  content:{
    definition:"Mathematical measures of how similar or different two points are in feature space — the foundation for KNN, clustering, and any algorithm that reasons about proximity.",
    explanation:[
      {heading:"Why Distance Matters", body:`Several of the most important ML algorithms rely on one core question: how similar are two data points?

K-Nearest Neighbors classifies by finding the nearest training examples.
K-Means clustering groups points by their distance to cluster centers.
Hierarchical clustering merges the closest clusters.
Anomaly detection flags points far from all others.

The choice of distance metric is not cosmetic — it fundamentally changes which points are considered "close," and therefore changes what the algorithm learns.

Three questions to ask when choosing a metric:
  1. What is the scale of each feature? (Unscaled features distort distances.)
  2. Are you measuring geometric distance, travel distance, or directional similarity?
  3. Is the data dense (numeric, continuous) or sparse (text, binary)?`},
      {heading:"Euclidean Distance — The Straight Line", body:`The most common distance metric — the "as-the-crow-flies" distance between two points:

  d(a, b) = sqrt( Σ (ai - bi)² )

For 2D: d = sqrt((a1-b1)² + (a2-b2)²)  — Pythagoras' theorem.
For n dimensions: the same formula extended to all n coordinates.

WHEN TO USE:
  - When features represent true geometric or physical coordinates.
  - When the shortest path between two points matters.
  - General-purpose default for most continuous feature problems.

WHEN IT FAILS:
  - When features are on very different scales. Income (0-200k) will dominate age (0-100). Always scale features first.
  - When features are correlated. Euclidean treats correlated features independently, effectively double-counting their information.
  - When dealing with text or sparse vectors — Euclidean doesn't capture semantic similarity.`},
      {heading:"Manhattan Distance — City Block Travel", body:`Named for the grid streets of Manhattan. The total distance traveling only horizontally and vertically:

  d(a, b) = Σ |ai - bi|

In 2D: |a1-b1| + |a2-b2|  — total city blocks to get from A to B.

WHEN TO USE:
  - When movement is constrained to grid-like paths.
  - High-dimensional data: Manhattan distance scales better to many dimensions than Euclidean (less affected by curse of dimensionality).
  - When you want equal penalization of small and large differences (no squaring means no amplification of large errors).
  - Works well for some types of text data and image processing.

COMPARISON WITH EUCLIDEAN:
  For the same two points, Manhattan distance ≥ Euclidean distance.
  Manhattan: no squaring → not sensitive to large individual feature differences.
  Euclidean: squaring → large differences in one feature dominate the total distance.`},
      {heading:"Cosine Similarity — Direction Over Magnitude", body:`Cosine similarity measures the angle between two vectors — ignoring their length:

  cos(a, b) = (a · b) / (||a|| * ||b||)

  = Σ(ai * bi) / (sqrt(Σai²) * sqrt(Σbi²))

Range: -1 (opposite directions) to +1 (same direction). 0 means perpendicular (unrelated).

Cosine distance = 1 - cosine_similarity.

WHY IT IGNORES LENGTH:
  Two documents, one short and one long, can discuss the same topic.
  Euclidean distance between them is large (different vector lengths).
  Cosine similarity is high (same relative word frequencies, same direction).

WHEN TO USE:
  - Text and document similarity — comparing word frequency vectors.
  - Information retrieval — finding related articles or queries.
  - Recommendation systems — finding users or items with similar patterns.
  - Any sparse, high-dimensional data where magnitude is less meaningful than direction.

WHEN IT FAILS:
  - When magnitude genuinely matters (e.g., distance between physical locations).
  - When zero values are meaningful (Cosine ignores the scale of vectors).`},
      {heading:"The Curse of Dimensionality and Feature Scaling", body:`FEATURE SCALING IS MANDATORY:
  All distance metrics combine feature differences into one number.
  An unscaled feature with a large range will dominate.
  
  Example: age (0-100) and income (0-200,000). 
  A $50k income difference contributes 2.5 billion to squared Euclidean distance.
  A 10-year age difference contributes 100. 
  Income controls everything. Age is effectively invisible.

  SOLUTIONS:
    Z-score standardization: x' = (x - mean) / std  → mean=0, std=1
    Min-max scaling: x' = (x - min) / (max - min)  → range [0,1]
    Use the same scaling on train and test (fit scaler on train only).

THE CURSE OF DIMENSIONALITY:
  As the number of features grows, something counterintuitive happens:
  all pairs of points become approximately equidistant from each other.
  
  In 2 dimensions: "nearby" and "far" points are meaningfully different.
  In 1000 dimensions: all points are roughly the same distance apart.
  
  Why: in high dimensions, the volume of space grows exponentially. Data becomes infinitely sparse — even with millions of samples, the space is almost completely empty. The concept of "nearest neighbor" breaks down.
  
  This is why distance-based algorithms like KNN struggle with more than ~50-100 features.`}

      {title:"Curse of Dimensionality",body:"In high dimensions, all distances converge — everything is equidistant.\n'Nearest' becomes meaningless past ~50-100 features.\nUse dimensionality reduction (PCA) before distance-based algorithms."},

    questions:[
      {q:"What does Euclidean distance measure?",opts:["The angle between two feature vectors","The straight-line (as-the-crow-flies) distance between two points in feature space","The total number of features that differ between two points","The correlation between two samples"],ans:1,exp:"Euclidean distance = sqrt(Σ(ai-bi)²). It measures the length of the straight line between two points in n-dimensional feature space — a direct extension of the Pythagorean theorem to n dimensions."},
      {q:"Which distance metric would be best for comparing two documents represented as word frequency vectors?",opts:["Euclidean distance","Manhattan distance","Cosine similarity","Hamming distance"],ans:2,exp:"Cosine similarity measures the angle between vectors, ignoring their magnitude. A short and a long document discussing the same topic will have different vector lengths (magnitudes) but similar directions. Cosine captures this semantic similarity while Euclidean would see them as 'far apart.'"},

// ── 7: K-NEAREST NEIGHBORS ──────────────────
{
  id:'knn', label:'K-Nearest Neighbors', color:'#1A5C3D',
  content:{
    definition:"A non-parametric algorithm that classifies new points by majority vote of their K closest training examples — no training required, just distance computation at prediction time.",
    explanation:[
      {heading:"The Lazy Learner", body:`KNN has a property unique among major ML algorithms: it does zero work during training.

It doesn't fit a model. It doesn't learn parameters. It doesn't build a tree. It just stores the entire training dataset and waits.

All the computation happens at prediction time:
  1. Receive a new, unseen point x.
  2. Compute distance from x to every training point.
  3. Find the K training points with the smallest distances.
  4. Classification: return the majority class among those K neighbors.
     Regression: return the average of those K neighbors' values.

This is why KNN is called a "lazy learner" — it defers all computation until prediction. It's also why it's called "non-parametric" — the model IS the training data; there are no summarizing parameters.

The simplicity is both its strength and its limitation.`},
      {heading:"Choosing K — The Central Hyperparameter", body:`K is the only hyperparameter that matters in KNN — and it has a direct effect on the bias-variance tradeoff.

K=1 (Minimum):
  Classify every new point as the class of its single nearest neighbor.
  Decision boundary contorts to fit every training point exactly.
  Training accuracy: 100% (every point is its own nearest neighbor).
  Test accuracy: often poor — extremely high variance.
  The model memorizes every point, including noise and outliers.

K=N (Maximum — all training points):
  Every point is classified as the majority class in the full dataset.
  Decision boundary is a single global boundary.
  Maximum underfitting: ignores all local structure.
  All predictions are identical regardless of where the input is.

SWEET SPOT:
  Small K: flexible boundary, low bias, high variance (overfitting).
  Large K: smooth boundary, high bias, low variance (underfitting).
  Typical range: K=3 to K=20. Start with K=5 or 7.
  Rule of thumb: K ≈ sqrt(n_samples), but always validate with cross-validation.
  Always use odd K for binary classification to avoid ties.`},
      {heading:"Feature Scaling — Non-Negotiable", body:`KNN is entirely distance-based. If features are on different scales, large-range features control every prediction.

Example: 
  Feature 1: age in years (20-80)
  Feature 2: annual income in dollars (20,000-200,000)
  
  A difference of $5,000 in income dwarfs a 50-year age difference in Euclidean space.
  Income determines the neighbors; age is invisible.
  Your KNN model is just "nearest income" — not what you wanted.

ALWAYS apply feature scaling before KNN:
  Standard scaling: x' = (x - mean) / std  (preferred for most cases)
  Min-max scaling: x' = (x - min) / (max - min)
  
  Fit on training data only. Apply the same transformation to test data.

This is not optional. KNN without scaling is broken.`},
      {heading:"When KNN Works — and When It Breaks", body:`KNN WORKS WELL WHEN:
  - The decision boundary is genuinely irregular and complex.
  - You have a small-to-medium dataset (< ~100k samples).
  - Features are informative and well-scaled.
  - You need a quick, no-assumptions baseline with interpretability (you can point to the neighbors).
  - k-NN is surprisingly competitive on well-scaled, low-dimensional data.

KNN FAILS WHEN:
  HIGH DIMENSIONALITY (Curse of Dimensionality):
    As features increase, all points become approximately equidistant.
    "Nearest" neighbors are not meaningfully closer than "farthest" ones.
    KNN's core assumption breaks down. Use dimensionality reduction first.

  LARGE DATASETS:
    Predicting a single point requires computing distances to ALL training points.
    O(n*d) per prediction: n = training samples, d = dimensions.
    100k training points × 100 features = 10 million multiplications per prediction.
    For production with many queries, KNN is slow without approximate methods.

  IRRELEVANT FEATURES:
    KNN weights all features equally. A feature with pure noise pulls neighbors
    in the wrong direction. Feature selection matters enormously.

  IMBALANCED CLASSES:
    Majority class overwhelms minority in the vote. Use weighted KNN or 
    class-balanced sampling before training.`},
      {heading:"Beyond Euclidean — Distance Choices and Weighted KNN", body:`DEFAULT: Euclidean distance. Good for continuous, scaled features.

ALTERNATIVES:
  Manhattan distance: more robust in high dimensions.
  Cosine similarity: for text and sparse data.
  Hamming distance: for binary or categorical features.
  Custom distance: domain-specific metrics (e.g., edit distance for strings).

WEIGHTED KNN:
  Standard KNN: each of the K neighbors gets one vote.
  Weighted KNN: closer neighbors get more weight.
  
  Common weighting: weight_i = 1 / distance_i²
  
  Why it helps: a neighbor at distance 0.1 should matter more than one at distance 10.
  Standard KNN treats them equally. Weighted KNN respects proximity.
  In scikit-learn: KNeighborsClassifier(weights='distance')

DISTANCE TO PROBABILITY:
  KNN naturally outputs a soft probability: P(class=k | x) = (votes for k) / K.
  With K=5 and 3 votes for class 1: P(class=1) = 0.6.
  These aren't well-calibrated probabilities, but they're useful for ranking.`}

    questions:[
      {q:"Why is KNN called a 'lazy learner'?",opts:["It uses a simplified, approximate version of the training algorithm","It performs no computation during training — all work happens at prediction time","It only uses a fraction of training data for each prediction","It relies on random sampling to speed up the training phase"],ans:1,exp:"KNN literally does nothing during 'training' — it just stores the data. At prediction time, it computes distances to all training points, finds K nearest, and votes. This is the opposite of 'eager' learners like decision trees, which do all computation upfront."},
      {q:"With K=1, what is the training accuracy of KNN?",opts:["Depends on the class balance in training data","50% — random guess for each point","100% — every point's nearest neighbor is itself","Varies based on the complexity of the decision boundary"],ans:2,exp:"With K=1, each training point's nearest neighbor is itself (distance=0). Every training point is classified as its own class — 100% training accuracy. This is classic overfitting: the model memorizes all training points, including noise."},
      {q:"In KNN, increasing K from 3 to 50 typically:",opts:["Increases variance and decreases bias","Decreases variance and increases bias, creating a smoother decision boundary","Increases both variance and bias","Has no effect on bias or variance — K only affects training speed"],ans:1,exp:"Larger K averages over more neighbors, smoothing the decision boundary. This reduces variance (less sensitivity to individual points) but increases bias (less responsiveness to local structure). Very large K causes underfitting — predictions converge to the global majority class."},
      {q:"Why must features be scaled before applying KNN?",opts:["KNN requires features to be normally distributed","Large-range features dominate the distance metric, effectively making KNN ignore other features","KNN uses matrix operations that require normalized inputs","Feature scaling reduces training time for KNN"],ans:1,exp:"KNN computes distances. A feature with values 0-200,000 contributes far more to distance than one with values 0-1. Without scaling, KNN essentially ignores low-range features. Scale all features to comparable ranges first."},
      {q:"What is the main computational disadvantage of KNN for large datasets?",opts:["Training requires O(n²) pairwise distance computations","Each prediction requires computing distances to all n training points: O(n × d) per query","The K hyperparameter grows with dataset size, requiring more computation","KNN must re-sort the training set for every new prediction, taking O(n log n)"],ans:1,exp:"KNN has no training phase, but prediction time is O(n × d): for each query, compute distance to all n training samples across d features. With n=1,000,000 and d=100, that's 100 million multiplications per prediction — very slow without approximate methods."},
      {q:"You have a dataset with 500 features. KNN is likely to fail because:",opts:["KNN requires more samples than features","In high dimensions, all pairwise distances converge — 'nearest' neighbors are not meaningfully closer than random points","KNN can't handle more than 100 features mathematically","High dimensionality causes K to become a continuous variable"],ans:1,exp:"The curse of dimensionality: as features increase, the volume of space grows exponentially and data becomes infinitely sparse. In 500 dimensions, all points are approximately equidistant — the concept of 'nearest neighbor' loses meaning. Apply PCA or feature selection before KNN."},
      {q:"Weighted KNN assigns weight = 1/d² to neighbors. How does this differ from standard KNN?",opts:["It uses distance-weighted voting, so closer neighbors have more influence on the prediction","It squares the number of neighbors, using K² total votes","It normalizes the class votes so they sum to 1","It only considers neighbors within distance d of the query point"],ans:0,exp:"Weighted KNN gives closer neighbors more influence. Standard KNN treats all K neighbors equally — a neighbor at distance 0.1 and one at distance 10 both get one vote. Weighted KNN assigns weight = 1/d², so the close neighbor influences the prediction ~10,000x more than the distant one."},
      {q:"For binary classification with K=4, two neighbors are class A and two are class B. What should you do?",opts:["Default to class A (alphabetical priority)","Use K=5 instead to avoid ties — always use odd K for binary classification","Average the probabilities: output 50% for both classes","Increase the threshold to break the tie"],ans:1,exp:"With K=4 and a 50/50 split, you have a tie with no way to break it. Best practice: use odd K for binary classification to prevent ties. With K=5, the result will always be 3-2 in favor of one class."}

// ── 8: CLUSTERING ───────────────────────────
{
  id:'clustering', label:'Clustering', color:'#3A6B4A',
  content:{
    definition:"An unsupervised approach to discovering natural groupings in unlabeled data — finding structure without being told what to look for.",
    explanation:[
      {heading:"Learning Without Labels", body:`Clustering is the workhorse of unsupervised learning. Unlike supervised algorithms, you have no labels — no correct answers to learn from.

Instead, the algorithm discovers structure in the data itself:
  - Which points naturally belong together?
  - What are the natural groupings in this data?
  - Are there distinct customer segments? Unusual data patterns? Document topics?

WHEN TO CLUSTER:
  - Customer segmentation: group customers by behavior for targeted marketing.
  - Anomaly detection: points far from all clusters are outliers.
  - Data compression: replace many points with cluster representatives.
  - Exploratory analysis: find structure before you know what to look for.
  - Document/image organization: group similar articles or photos.
  - Preprocessing: use cluster assignments as features for a downstream model.

KEY CHALLENGE: with no labels, how do you know if the clustering is good?
  You're not minimizing a classification error. You need other criteria.
  This is the fundamental difficulty of unsupervised evaluation.`},
      {heading:"K-Means — The Standard Algorithm", body:`K-Means is the most widely used clustering algorithm. Fast, simple, interpretable.

ALGORITHM (Lloyd's algorithm):
  1. Choose K (number of clusters) — you must specify this upfront.
  2. Initialize K centroids randomly (or with K-Means++).
  3. Assign each point to the nearest centroid (Euclidean distance).
  4. Recompute each centroid as the mean of its assigned points.
  5. Repeat steps 3-4 until centroids stop moving (convergence).

OBJECTIVE: minimize within-cluster sum of squared distances (inertia):
  Inertia = Σ_k Σ_{x in cluster k} ||x - μ_k||²

K-Means always converges (inertia never increases), but may converge to a local minimum. Multiple random restarts (n_init) help find a good solution.

K-MEANS++ INITIALIZATION:
  Instead of random initialization, K-Means++ spreads centroids out:
  1. Choose first centroid randomly.
  2. Choose each subsequent centroid with probability proportional to squared distance from the nearest existing centroid.
  Result: faster convergence, fewer local minima. Use this always.`},
      {heading:"Choosing K — The Elbow Method and Silhouette Score", body:`K-Means requires you to specify K before running. How do you choose?

THE ELBOW METHOD:
  Run K-Means for K = 1, 2, 3, ..., 15.
  Plot inertia (within-cluster variance) vs. K.
  Look for the "elbow" — the point where inertia stops decreasing sharply.
  
  Why it works: adding more clusters always reduces inertia (you can perfectly cluster by making K=N). The elbow shows diminishing returns — where more clusters stop adding meaningful structure.
  
  Limitation: the elbow is often ambiguous — it's a curve, not a sharp bend.

SILHOUETTE SCORE:
  For each point i:
    a = average distance to all points in the same cluster (cohesion)
    b = average distance to all points in the nearest other cluster (separation)
    s(i) = (b - a) / max(a, b)
  
  s(i) ranges from -1 to +1:
    +1: well-clustered. The point is tight within its cluster and far from others.
     0: on the boundary between clusters.
    -1: likely misassigned — closer to another cluster.
  
  Average silhouette score across all points: higher is better (aim for > 0.5).
  Choose K that maximizes the average silhouette score.`},
      {heading:"K-Means Limitations", body:`K-Means has real limitations worth knowing before you use it:

NON-SPHERICAL CLUSTERS:
  K-Means assumes clusters are convex and roughly spherical (isotropic).
  It cannot discover elongated, ring-shaped, or interleaved clusters.
  Real data often has irregular cluster shapes — K-Means will fail on these.

SENSITIVE TO INITIALIZATION:
  Different random starts can give very different results.
  Fix: use K-Means++ initialization and run multiple times (n_init=10+).

SCALE-SENSITIVE:
  Uses Euclidean distance — scale your features first. Same issue as KNN.

HARD ASSIGNMENT:
  Every point belongs to exactly one cluster.
  Real data often has ambiguous boundary points that belong partly to multiple clusters.
  Gaussian Mixture Models (GMM) offer soft cluster assignments.

K MUST BE SPECIFIED:
  You must know K before running. In practice, you don't always know.
  Elbow/silhouette help, but they're heuristics, not answers.`},
      {heading:"DBSCAN — Density-Based Clustering", body:`DBSCAN (Density-Based Spatial Clustering of Applications with Noise) takes a completely different approach — no need to specify K.

INTUITION: clusters are dense regions separated by sparse regions.

KEY PARAMETERS:
  ε (epsilon): the maximum distance for two points to be considered neighbors.
  min_samples: minimum points in a neighborhood to form a dense region.

POINT TYPES:
  CORE POINT: has at least min_samples points within ε distance.
  BORDER POINT: within ε of a core point, but not enough neighbors itself.
  NOISE POINT: not within ε of any core point — an outlier.

ALGORITHM:
  1. Label each point as core, border, or noise.
  2. Connect all core points that are within ε of each other.
  3. Add border points to the nearest core point's cluster.
  4. Noise points are left as outliers.

ADVANTAGES OVER K-MEANS:
  - Discovers arbitrarily shaped clusters (not just spheres).
  - No need to specify K — discovers the number of clusters.
  - Explicitly identifies outliers as noise.
  - Robust to outliers (they don't distort cluster centers).

DISADVANTAGES:
  - Choosing ε and min_samples requires domain knowledge.
  - Struggles with varying-density clusters (different ε for different regions).
  - O(n²) distance computations without spatial indexing.`}
    ],
    keyPoints:[
      {title:"K-Means Algorithm",body:"1. Initialize K centroids\n2. Assign each point to nearest centroid\n3. Recompute centroids as cluster means\n4. Repeat until convergence\nMinimizes within-cluster sum of squared distances (inertia)."},
      {title:"Choosing K",body:"Elbow method: plot inertia vs K, find the bend.\nSilhouette score: ranges -1 to +1, higher = better separation.\nBoth are heuristics — domain knowledge often matters more."},
      {title:"K-Means Limitations",body:"Assumes spherical clusters. Sensitive to scale (standardize!).\nRequires K upfront. Hard assignments only.\nK-Means++ initialization prevents bad random starts."},
      {title:"DBSCAN",body:"Density-based: clusters = dense regions, outliers = sparse points.\nNo K needed — discovers cluster count automatically.\nHandles arbitrary shapes. Explicitly marks noise."},
      {title:"Core / Border / Noise",body:"Core: ≥ min_samples within ε distance.\nBorder: within ε of a core point but not core itself.\nNoise: not within ε of any core — an outlier."},
      {title:"Evaluating Clusters",body:"Silhouette score (no labels needed).\nIf ground truth labels exist: Adjusted Rand Index or NMI.\nVisually inspect with PCA or t-SNE projections."}
    ],
    watchOut:"K-Means does not guarantee a global optimum — different initializations give different results. Always run with multiple restarts (n_init ≥ 10) and K-Means++ initialization. Also: clustering results are sensitive to scale, so always standardize features first. Different algorithms on the same data can give completely different 'valid' clusterings — clustering is inherently subjective.",
    questions:[
      {q:"In K-Means, what does each centroid represent after convergence?",opts:["The training sample closest to the center of its cluster","The mean (average) of all points currently assigned to that cluster","The point with the lowest distance to all other points","A randomly selected representative of each cluster"],ans:1,exp:"At each step, K-Means recomputes each centroid as the arithmetic mean of all points assigned to it. After convergence, centroids sit at the center of mass of their clusters."},
      {q:"What is the objective function that K-Means minimizes?",opts:["Total distance between all pairs of points across clusters","Within-cluster sum of squared distances from each point to its centroid (inertia)","The silhouette score across all clusters","Between-cluster variance divided by within-cluster variance"],ans:1,exp:"K-Means minimizes inertia = Σ Σ ||x - μ_k||² — the sum of squared distances from each point to its assigned centroid. Lower inertia = tighter, more compact clusters."},
      {q:"The elbow in the K-Means elbow method indicates:",opts:["The maximum possible K for the dataset","The K where inertia stops decreasing sharply — adding more clusters yields diminishing returns","The K that maximizes the silhouette score","The K where training time starts increasing exponentially"],ans:1,exp:"As K increases, inertia always decreases (more clusters = smaller groups = closer centroids). The elbow marks where reductions in inertia slow dramatically — additional clusters don't create much more structure, suggesting the 'natural' number of clusters."},
      {q:"What is a core point in DBSCAN?",opts:["The first point added to a cluster during initialization","A point with at least min_samples neighbors within distance ε","The centroid of a cluster, computed as the mean of its points","A point equidistant from two or more cluster centers"],ans:1,exp:"In DBSCAN, a core point has at least min_samples other points within ε distance. Core points form the dense interiors of clusters. Border points are within ε of a core point but don't have enough neighbors themselves. Noise points are neither core nor border."},
      {q:"What is the main advantage of DBSCAN over K-Means?",opts:["DBSCAN is faster on large datasets","DBSCAN can discover clusters of arbitrary shape and doesn't require specifying K in advance","DBSCAN always finds the global optimum clustering","DBSCAN requires no hyperparameters"],ans:1,exp:"K-Means assumes spherical, similarly-sized clusters and requires K upfront. DBSCAN defines clusters as dense regions separated by sparse ones, discovering arbitrary shapes automatically. It also explicitly identifies outliers as noise rather than forcing them into a cluster."},
      {q:"A point has silhouette score s = -0.4. What does this mean?",opts:["The point is well-clustered at the center of its cluster","The point is on the boundary between two clusters","The point is likely misassigned — on average closer to a neighboring cluster","The point is a noise outlier with no clear cluster membership"],ans:2,exp:"Silhouette s = (b - a)/max(a,b), where a = mean distance to same-cluster points and b = mean distance to nearest other cluster. Negative s means a > b: the point is closer to another cluster than to its own — it's likely misassigned."},
      {q:"Why should you standardize features before K-Means clustering?",opts:["K-Means requires normally distributed features","K-Means uses Euclidean distance — features with larger ranges dominate cluster assignments","Standardization speeds up K-Means convergence","K-Means++ initialization requires standardized features"],ans:1,exp:"K-Means assigns points to the nearest centroid using Euclidean distance. If one feature has range 0-100,000 and another has range 0-1, the large-range feature completely dominates distance calculations, effectively ignoring the other feature. Standardize first."},
      {q:"In K-Means, running n_init=10 means:",opts:["Training for 10 epochs per run","Running K-Means 10 times with different random initializations and keeping the best result","Using 10 different values of K and averaging the results","Setting the maximum number of iterations per run to 10"],ans:1,exp:"n_init controls how many independent runs with different random initializations are attempted. K-Means can converge to local minima; running it multiple times and keeping the lowest-inertia result significantly improves the final clustering quality."}
    ]
  }
