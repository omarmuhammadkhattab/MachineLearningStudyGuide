<html lang="en">
<head>

<title>The Machine Learning Handbook</title>

<style>
:root {
  --bg:          #FAF9F7;
  --bg-panel:    #F4F2EE;
  --bg-input:    #EDEAE4;
  --border:      #DDD9D1;
  --border-light:#E8E4DC;
  --text-strong: #1A1714;
  --text-mid:    #3D3830;
  --text-faint:  #8C8278;
  --accent:      #2D5544;
  --accent-light:#EAF0EC;
  --radius:      8px;
  --sidebar-w:   260px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Geist', sans-serif; background: var(--bg); color: var(--text-strong); }

/* ── Layout ── */
.app      { display: flex; height: 100vh; overflow: hidden; }
.sidebar  { width: var(--sidebar-w); background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
.main     { flex: 1; overflow-y: auto; }

/* ── Sidebar ── */
.brand    { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.brand-mark{ width: 28px; height: 28px; background: var(--text-strong); color: var(--bg); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: -0.5px; flex-shrink: 0; }
.brand-text{ font-size: 13px; font-weight: 600; color: var(--text-strong); line-height: 1.2; }
.brand-sub { font-size: 10px; color: var(--text-faint); font-weight: 400; }
.nav-scroll{ overflow-y: auto; flex: 1; padding: 10px 0; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 16px; cursor: pointer; transition: background 0.15s; border-radius: 0; position: relative; }
.nav-item:hover { background: var(--bg-input); }
.nav-item.active { background: var(--bg-input); }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 18px; border-radius: 0 2px 2px 0; background: var(--text-strong); }
.nav-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.nav-num  { font-family: 'Geist Mono', monospace; font-size: 9px; color: var(--text-faint); min-width: 16px; }
.nav-label{ font-size: 12.5px; color: var(--text-mid); font-weight: 500; line-height: 1.3; }
.nav-item.active .nav-label { color: var(--text-strong); }
.sidebar-footer { padding: 14px 16px; border-top: 1px solid var(--border); }
.progress-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 6px; }
.progress-bar { height: 100%; background: var(--text-strong); border-radius: 2px; transition: width 0.4s ease; }
.progress-label { font-size: 10px; color: var(--text-faint); font-family: 'Geist Mono', monospace; }

/* ── Main Content ── */
.topic-header { padding: 40px 48px 28px; border-bottom: 1px solid var(--border-light); }
.topic-tag    { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-family: 'Geist Mono', monospace; color: var(--text-faint); font-weight: 500; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
.topic-dot    { width: 6px; height: 6px; border-radius: 50%; }
.topic-title  { font-size: 28px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.5px; margin-bottom: 10px; }
.topic-def    { font-size: 14px; color: var(--text-mid); line-height: 1.6; max-width: 640px; }

/* ── Tabs ── */
.tabs         { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 48px; background: var(--bg); }
.tab          { padding: 12px 0; margin-right: 24px; font-size: 12.5px; font-weight: 500; color: var(--text-faint); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; white-space: nowrap; }
.tab:hover    { color: var(--text-mid); }
.tab.active   { color: var(--text-strong); border-bottom-color: var(--text-strong); }
.tab-content  { padding: 36px 48px 60px; display: none; }
.tab-content.active { display: block; }

/* ── Explain Tab ── */
.sections     { display: flex; flex-direction: column; gap: 0; }
.section      { border: 1px solid var(--border-light); border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; }
.section-head { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: var(--bg-panel); transition: background 0.15s; user-select: none; }
.section-head:hover { background: var(--bg-input); }
.section-heading { font-size: 13.5px; font-weight: 600; color: var(--text-strong); }
.section-chevron { font-size: 10px; color: var(--text-faint); transition: transform 0.2s; }
.section.open .section-chevron { transform: rotate(180deg); }
.section-body { display: none; padding: 22px 24px 28px; font-family: 'Geist', sans-serif; font-size: 13.5px; color: var(--text-mid); line-height: 1.85; border-top: 1px solid var(--border-light); background: var(--bg); }
.section.open .section-body { display: block; }
.sb-prose { margin: 0 0 16px; }
.sb-prose:last-child { margin-bottom: 0; }
.sb-code { font-family: 'Geist Mono', monospace; font-size: 12px; background: var(--bg-panel); border: 1px solid var(--border-light); border-radius: 7px; padding: 14px 18px; margin: 14px 0; line-height: 1.75; white-space: pre-wrap; word-break: break-word; color: var(--text-mid); }
.sb-item { margin: 18px 0 10px; }
.sb-item:first-child { margin-top: 0; }
.sb-item-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.sb-item-tag { font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--bg); background: var(--text-strong); padding: 2px 8px 3px; border-radius: 4px; flex-shrink: 0; }
.sb-item-desc { font-size: 13.5px; color: var(--text-mid); font-weight: 500; }
.sb-item-body { padding: 8px 12px; border-left: 2px solid var(--border); margin-left: 2px; font-size: 13px; line-height: 1.8; color: var(--text-mid); white-space: pre-line; }
.sb-divider { height: 1px; background: var(--border-light); margin: 20px 0; }

/* ── Key Points Tab ── */
.kp-grid      { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.kp-card      { border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; background: var(--bg-panel); }
.kp-title     { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); margin-bottom: 8px; font-family: 'Geist Mono', monospace; }
.kp-body      { font-family: 'Geist', sans-serif; font-size: 13px; color: var(--text-mid); line-height: 1.65; white-space: pre-line; }
.watch-out-box{ margin-top: 28px; border: 1px solid var(--border); border-left: 3px solid var(--text-strong); border-radius: var(--radius); padding: 16px 18px; background: var(--bg-panel); }
.watch-out-label { font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 7px; }
.watch-out-text { font-size: 13px; color: var(--text-mid); line-height: 1.65; }

/* ── Practice Tab ── */
.quiz-progress{ display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.quiz-prog-dots{ display: flex; gap: 4px; }
.quiz-dot     { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: background 0.2s; }
.quiz-dot.correct  { background: #3A7D55; }
.quiz-dot.wrong    { background: #B85C38; }
.quiz-dot.current  { background: var(--text-strong); }
.quiz-score   { font-size: 11px; font-family: 'Geist Mono', monospace; color: var(--text-faint); margin-left: auto; }
.question-card{ max-width: 620px; }
.question-text{ font-size: 15px; font-weight: 600; color: var(--text-strong); line-height: 1.5; margin-bottom: 20px; }
.options      { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.option       { padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13.5px; color: var(--text-mid); cursor: pointer; transition: all 0.15s; line-height: 1.4; }
.option:hover { border-color: var(--text-mid); color: var(--text-strong); background: var(--bg-panel); }
.option.selected { border-color: var(--text-strong); background: var(--bg-panel); color: var(--text-strong); }
.option.correct-ans { border-color: #3A7D55; background: #EDF5F0; color: #2A5C3F; }
.option.wrong-ans   { border-color: #B85C38; background: #F5EDE8; color: #8C3A20; }
.explanation  { margin-top: 14px; background: var(--bg-panel); border: 1px solid var(--border); border-left: 3px solid var(--text-strong); border-radius: var(--radius); padding: 16px 18px; font-size: 13.5px; color: var(--text-mid); line-height: 1.65; display: none; }
.explanation-label { font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 7px; }
.quiz-nav     { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
.btn          { padding: 9px 18px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--bg-panel); color: var(--text-mid); transition: all 0.15s; font-family: 'Geist', sans-serif; }
.btn:hover    { border-color: var(--text-mid); color: var(--text-strong); }
.btn-primary  { background: var(--text-strong); color: var(--bg); border-color: var(--text-strong); }
.btn-primary:hover { background: var(--text-mid); }
.quiz-result  { text-align: center; padding: 40px 0; }
.result-score { font-size: 48px; font-weight: 700; color: var(--text-strong); font-family: 'Geist Mono', monospace; letter-spacing: -2px; }
.result-label { font-size: 13px; color: var(--text-faint); margin-top: 6px; margin-bottom: 24px; }
.result-breakdown { font-size: 12px; font-family: 'Geist Mono', monospace; color: var(--text-faint); }

/* ── Coding Tab ── */
.coding-challenges { display: flex; flex-direction: column; gap: 28px; }
.challenge-card { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.challenge-head { padding: 14px 18px; background: var(--bg-panel); border-bottom: 1px solid var(--border); }
.challenge-title { font-size: 13.5px; font-weight: 600; color: var(--text-strong); margin-bottom: 4px; }
.challenge-desc  { font-size: 12.5px; color: var(--text-faint); line-height: 1.5; }
.editor-wrap     { position: relative; }
.CodeMirror      { height: auto; min-height: 200px; font-family: 'Geist Mono', monospace !important; font-size: 12.5px !important; line-height: 1.6 !important; }
.editor-actions  { display: flex; gap: 8px; padding: 10px 14px; background: #282A36; border-top: 1px solid rgba(255,255,255,0.07); }
.btn-run         { padding: 7px 16px; border-radius: 5px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; background: #50FA7B; color: #282A36; font-family: 'Geist Mono', monospace; transition: opacity 0.15s; }
.btn-run:hover   { opacity: 0.85; }
.btn-reset       { padding: 7px 14px; border-radius: 5px; font-size: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.15); background: transparent; color: rgba(255,255,255,0.5); font-family: 'Geist Mono', monospace; transition: all 0.15s; }
.btn-reset:hover { border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.8); }
.output-box      { background: #1E1F29; padding: 14px 16px; font-family: 'Geist Mono', monospace; font-size: 12px; color: #F8F8F2; white-space: pre-wrap; line-height: 1.6; min-height: 48px; max-height: 280px; overflow-y: auto; border-top: 1px solid rgba(255,255,255,0.05); }
.output-box.error{ color: #FF5555; }
.output-placeholder { color: rgba(248,248,242,0.25); font-style: italic; }

/* ── Mobile ── */
.mobile-menu-btn { display: none; position: fixed; top: 14px; left: 14px; z-index: 200; width: 36px; height: 36px; border-radius: 7px; background: var(--bg-panel); border: 1px solid var(--border); cursor: pointer; align-items: center; justify-content: center; flex-direction: column; gap: 4px; }
.mobile-menu-btn span { display: block; width: 16px; height: 1.5px; background: var(--text-strong); border-radius: 1px; }
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 99; }

@media (max-width: 768px) {
  .mobile-menu-btn { display: flex; }
  .sidebar { position: fixed; left: -280px; top: 0; height: 100%; z-index: 100; transition: left 0.25s ease; }
  .sidebar.open { left: 0; }
  .sidebar-overlay.open { display: block; }
  .topic-header, .tab-content { padding-left: 20px; padding-right: 20px; }
  .topic-header { padding-top: 64px; }
  .tabs { padding-left: 20px; }
  .topic-title { font-size: 22px; }
  .kp-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
// ─────────────────────────────────────────────
//  TOPICS DATA

const topics = [
// ── 0: WHAT IS ML? ──────────────────────────
{
  id:'what-is-ml', label:'What is ML?', color:'#1E3A5F',
  content:{
    definition:"The science of building systems that improve from experience — finding patterns in data rather than following hand-written rules.",
    explanation:[
      {heading:"What Does 'Learning' Actually Mean?", body:`In traditional programming, a developer writes explicit rules:

  if contains_word("free money"): mark_as_spam()

This works for simple, well-understood problems. But what about detecting tumors in medical images, translating between 100+ languages, or recognizing a face? Nobody can write enough rules to cover every case.

Machine learning flips this: instead of writing rules, you show the algorithm thousands of examples, and it figures out the rules itself.

Technically, a model is a mathematical function that maps inputs to outputs. Training is the process of adjusting that function's internal parameters until its outputs match the correct answers in your data. When we say a model "learned," we mean it found parameter values that generalize well enough to be useful on new, unseen data — not just the examples it trained on.`},
      {heading:"The Four Paradigms", body:`Machine learning is a family of approaches, each for a different kind of problem.

SUPERVISED LEARNING — Learning from labeled examples.
  You provide (input, correct output) pairs. The model learns to predict outputs for new inputs.
  Examples: spam detection, house price prediction, medical diagnosis.
  Covered here: Linear Regression, Logistic Regression, Decision Trees, KNN, Naive Bayes, SVM.

UNSUPERVISED LEARNING — Finding structure without labels.
  Only inputs — no correct answers. The algorithm discovers patterns on its own.
  Examples: customer segmentation, anomaly detection, topic modeling.
  Covered here: Clustering (K-Means, DBSCAN).

SEMI-SUPERVISED LEARNING — The pragmatic middle ground.
  A small amount of labeled data + a large amount of unlabeled data. Labels are expensive — a radiologist annotating scans costs real time and money. The model uses both.
  Examples: medical image labeling, web page classification.

REINFORCEMENT LEARNING — Learning through trial, error, and reward.
  An agent takes actions in an environment, receives reward signals, and learns a policy that maximizes cumulative reward.
  Examples: AlphaGo, game-playing AI, robot locomotion, recommendation systems.
  Not covered here — it deserves its own handbook.`},
      {heading:"Key Vocabulary — The Words You'll See Everywhere", body:`Nail these terms before anything else. They appear in every chapter.

FEATURE (X): An input variable. A column in your dataset.
  House price example: square footage, bedrooms, neighborhood, age.

LABEL (y): The output you're predicting. Also called: target, ground truth.
  House price example: price in dollars.

SAMPLE: A single data point — one row in your dataset.

MODEL: The mathematical function mapping features to predictions. Has internal parameters (weights) adjusted during training.

TRAINING: Showing the model data and adjusting parameters to minimize errors. The model never sees the test set during this phase.

INFERENCE: Using the trained model on new data it has never seen before.

HYPERPARAMETER: A setting you choose before training — not learned from data.
  Examples: how many trees in a forest, the learning rate, K in KNN.

OVERFITTING: The model performs great on training data but poorly on new data. It memorized instead of generalizing.

GENERALIZATION: The model's ability to perform well on new, unseen data. This is the whole point.`},
      {heading:"The ML Pipeline — How a Real Project Works", body:`Real ML is not just picking an algorithm. It's a cycle:

  1. DEFINE THE PROBLEM
     What are you predicting? What counts as success?
     Bad: "Can ML help us?" Good: "Can we predict churn in the next 30 days with >80% precision?"

  2. COLLECT AND CLEAN DATA
     Typically 60-80% of total project time.
     Remove duplicates, handle missing values, fix inconsistencies.
     Garbage in, garbage out.

  3. EXPLORATORY DATA ANALYSIS (EDA)
     Visualize distributions. Spot patterns. Find outliers. Understand correlations.
     This shapes your feature engineering and model choice.

  4. FEATURE ENGINEERING
     Transform raw data into features the model can use.
     Encode categories. Normalize scales. Create new combinations. Remove noise.

  5. TRAIN AND EVALUATE
     Split data into train and test sets (typically 80/20).
     Fit on training data. Measure performance on the held-out test set.

  6. ITERATE
     Improve features, tune hyperparameters, try different algorithms.
     ML is experimental by nature — the first attempt is rarely the best.

  7. DEPLOY AND MONITOR
     Integrate into a product or workflow.
     Monitor for data drift — the world changes, and your model needs to keep up.`},
      {heading:"When to Use ML — and When Not To", body:`ML is powerful, but not always the right tool.

USE ML WHEN:
  - The task is too complex to define rules manually (image recognition, language).
  - Rules need to adapt over time (fraud patterns, user behavior).
  - You have enough good-quality data.
  - The performance gain justifies the added complexity.

DON'T USE ML WHEN:
  - A simple rule works reliably. One line of regex or if/else is not a failure — it's wisdom.
  - You have very little data. Models need enough examples to generalize.
  - You need perfect explainability and a simple rule-based system suffices.
  - Silent failure is catastrophic. ML fails in unpredictable ways on edge cases.

The most dangerous trap: using ML because it sounds modern, not because it solves the problem better than a simpler alternative.`}
    ],
    keyPoints:[
      {title:"Supervised Learning",body:"Learn from labeled (input, output) pairs. Predict outputs for new inputs. Used for spam detection, price prediction, classification."},
      {title:"Unsupervised Learning",body:"No labels — the algorithm finds hidden structure in raw data. Used for clustering, anomaly detection, compression."},
      {title:"Semi-supervised & RL",body:"Semi-supervised: small labeled set + large unlabeled set. Reinforcement: learn a policy through rewards and penalties."},
      {title:"Key Vocabulary",body:"Feature (X) = input column. Label (y) = output. Sample = one row. Model = learned function. Hyperparameter = setting you choose before training."},
      {title:"The ML Pipeline",body:"Define → Collect & Clean → EDA → Feature Engineering → Train → Evaluate → Iterate → Deploy & Monitor. Data cleaning is usually 60-80% of the time."},
      {title:"When NOT to Use ML",body:"If a simple rule works reliably, use it. ML adds complexity, opacity, and maintenance burden. Only use it when the problem genuinely requires it."}
    ],
    watchOut:"ML models are only as good as the data they train on. A biased dataset produces a biased model — the algorithm faithfully learns whatever patterns exist in the data, including unfair ones. No algorithmic sophistication compensates for a poorly defined problem or bad data.",
    questions:[
      {q:"What is the key difference between supervised and unsupervised learning?",opts:["Supervised uses more data","Supervised learns from labeled (input, output) pairs; unsupervised finds structure in unlabeled data","Supervised is for regression only; unsupervised is for classification","They're the same — 'supervised' refers to the programmer, not the data"],ans:1,exp:"Supervised learning requires labeled examples — you tell the model the correct output. Unsupervised learning only receives inputs and discovers patterns without any predefined correct answers."},
      {q:"In ML terminology, what is a 'label' (also called the target)?",opts:["A tag identifying which model made the prediction","The correct output value paired with an input during training","A category marker attached to a feature column","The name given to a model's internal parameter"],ans:1,exp:"A label (target, ground truth) is the correct output paired with each input. In supervised learning, the model trains on (input features, label) pairs and learns to predict labels for unseen inputs."},
      {q:"You want to group millions of news articles by topic — no one has tagged them. Which paradigm?",opts:["Supervised learning","Reinforcement learning","Unsupervised learning","Semi-supervised learning"],ans:2,exp:"With no labels, this is unsupervised learning. Clustering algorithms like K-Means will group similar articles together based on word patterns, discovering topic structure automatically."},
      {q:"A spam filter learns from thousands of labeled examples of spam and non-spam emails. This is:",opts:["Unsupervised learning","Reinforcement learning","Semi-supervised learning","Supervised learning"],ans:3,exp:"The model learns from labeled (email, spam/ham) pairs — that's supervised learning. The labels tell the model what's correct; it generalizes to new emails."},
      {q:"An AI learns to play chess by playing millions of games and receiving +1 for winning, -1 for losing. This is:",opts:["Supervised learning","Unsupervised learning","Reinforcement learning","Semi-supervised learning"],ans:2,exp:"Reinforcement learning: an agent takes actions (chess moves) in an environment (the game), receives reward signals (win/loss), and learns a policy maximizing cumulative reward. No labeled 'correct moves' exist."},
      {q:"What is overfitting?",opts:["When a model is trained for too many iterations","When a model performs well on training data but poorly on new, unseen data","When a model uses too many features","When the learning rate is set too high"],ans:1,exp:"Overfitting occurs when a model memorizes training data — including its noise — instead of learning the underlying pattern. It performs great on training data but fails to generalize."},
      {q:"Which step in the ML pipeline typically consumes 60-80% of project time?",opts:["Model training and optimization","Deployment and monitoring","Data collection and cleaning","Hyperparameter tuning"],ans:2,exp:"Data collection, cleaning, and preparation is by far the most time-consuming step. Ensuring data quality is the highest-leverage activity — the model can only learn from the signal that exists in the data."},
      {q:"Which is a good reason NOT to use ML?",opts:["The task involves recognizing complex patterns in images","A simple rule-based filter handles the problem reliably","You have millions of labeled examples","The input-output relationship is too complex to define manually"],ans:1,exp:"If a simple rule works reliably, don't use ML. ML adds complexity, opacity, and maintenance burden. Use it when rules genuinely can't handle the complexity — not because it sounds more sophisticated."}
    ]
  }
},
// ── 1: LINEAR REGRESSION ─────────────────────
{
  id:'linear-regression', label:'Linear Regression', color:'#2D5544',
  content:{
    definition:"A supervised algorithm that models the relationship between one or more input features and a continuous output by fitting the best possible straight line through the data.",
    explanation:[
      {heading:"The Core Idea — Lines as Predictions", body:`Linear regression is the simplest supervised algorithm, and understanding it deeply unlocks intuition for almost everything else.

The goal: given a set of data points, find the line (or hyperplane in multiple dimensions) that best predicts the output from the inputs.

For a single feature, the equation is:
  y_hat = w * x + b

  y_hat = prediction
  x     = input feature
  w     = weight (slope) — how much y changes per unit of x
  b     = bias (intercept) — the prediction when x = 0

For multiple features:
  y_hat = w1*x1 + w2*x2 + ... + wn*xn + b

Every feature gets its own weight. The model learns which features matter and how much.

"Fitting" means finding the values of w and b that make predictions as close as possible to the actual y values in the training data. This is an optimization problem.`},
      {heading:"The Cost Function — Measuring How Wrong We Are", body:`To find the best w and b, we need a way to measure how far off our predictions are. The standard for regression is Mean Squared Error (MSE):

  MSE = (1/n) * Σ (yi - y_hat_i)²

Why squared? Three reasons:
  1. Negatives and positives don't cancel — both count as errors.
  2. Large errors are penalized more than small ones (quadratic growth).
  3. It's differentiable everywhere, which makes optimization tractable.

MSE is our "cost function" — the single number that tells us how bad the current weights are. Training is the process of finding weights that minimize this number.`},
      {heading:"Gradient Descent — How the Model Actually Learns", body:`We can't just guess the best weights. Gradient descent is the algorithm that finds them iteratively:

  1. Start with random weights (usually w=0, b=0).
  2. Calculate the gradient of the cost function with respect to each weight.
     The gradient tells us the direction of steepest increase.
  3. Take a small step in the opposite direction (downhill).
  4. Repeat until the cost stops decreasing.

The update rules:
  w_new = w - α * (dMSE/dw)
  b_new = b - α * (dMSE/db)

  where:
    dMSE/dw = (2/n) * Σ (y_hat_i - yi) * xi   (gradient for w)
    dMSE/db = (2/n) * Σ (y_hat_i - yi)          (gradient for b)

α is the learning rate — how big each step is. Too large: the optimizer overshoots and diverges. Too small: training is very slow.`},
      {heading:"Multiple Features and the Normal Equation", body:`In practice, you have many features. The model becomes:
  y_hat = w1*x1 + w2*x2 + ... + wn*xn + b

In matrix form: y_hat = X @ w  (where X includes a bias column of ones)

For small datasets, there's a closed-form solution called the Normal Equation:
  w* = (X^T X)^{-1} X^T y

This gives the exact optimal weights in one step — no iteration needed.
Downside: matrix inversion is O(n³) in the number of features — impractical for large feature sets. Gradient descent is preferred for large datasets.

Gradient descent also generalizes to neural networks and other models. The Normal Equation doesn't. This is why gradient descent is the foundational technique.`},
      {heading:"Assumptions and When to Use It", body:`Linear regression makes assumptions worth knowing:

  - Linearity: the true relationship between X and y is approximately linear.
  - Independence: samples are independent of each other (not time-series without adjustment).
  - Homoscedasticity: residual variance is constant across all values of X.
  - Normality of residuals: errors are approximately normally distributed.

Violating these doesn't always break the model — linear regression is remarkably robust — but it's worth checking.

USE WHEN:
  - The relationship between features and output is approximately linear.
  - Interpretability matters — weights directly tell you feature importance.
  - You have a continuous output (price, temperature, revenue).
  - You need a fast, simple baseline to beat before trying complex models.

EXTENSION: Polynomial features
  y_hat = w0 + w1*x + w2*x^2 + w3*x^3
  Still "linear regression" (linear in parameters), but captures curves.
  Risk: high-degree polynomials overfit aggressively.`}
    ],
    keyPoints:[
      {title:"The Model",body:"y_hat = w1x1 + w2x2 + ... + b\nEach feature gets a weight. Training finds the weights that minimize prediction error."},
      {title:"Cost Function (MSE)",body:"MSE = (1/n) Σ(yi - ŷi)²\nSquaring errors penalizes large mistakes more. The model minimizes this during training."},
      {title:"Gradient Descent",body:"Iteratively adjust weights in the direction that reduces error.\nw = w - α * gradient\nα (learning rate) controls step size."},

      {title:"When It Works",body:"Continuous output, approximately linear relationships, when interpretability matters. Always use as your first baseline before complex models."}
    ],
    watchOut:"Feature scaling matters for gradient descent — features on very different scales cause uneven gradient steps and slow convergence. Standardize features before training. Also: correlation ≠ causation. A high R² means the model fits the data, not that the features cause the output.",
    questions:[
      {q:"What does the weight (w) represent in a linear regression model y = wx + b?",opts:["The bias term added to every prediction","The slope — how much the output changes per unit increase in the feature","The learning rate used during gradient descent","The model's confidence in each prediction"],ans:1,exp:"The weight w is the slope of the line. It tells you how much y changes for a one-unit increase in x. A weight of 3.5 means each additional unit of x adds 3.5 to the prediction."},
      {q:"Why does Mean Squared Error square the prediction errors?",opts:["To make all errors positive, and to penalize large errors disproportionately","To make the math simpler — squaring removes the need for absolute values","Because negative errors are twice as costly as positive errors","It doesn't matter — MSE and MAE give identical optimal weights"],ans:0,exp:"Squaring serves two purposes: (1) it makes all errors positive (preventing negatives from canceling positives), and (2) it penalizes large errors far more than small ones — a prediction off by 10 contributes 100 to MSE, vs. one off by 1 contributing just 1."},
      {q:"What does the learning rate (α) control in gradient descent?",opts:["The number of training epochs","How large each step is in the direction of the gradient","The proportion of data used for training vs. validation","How much regularization is applied to the weights"],ans:1,exp:"The learning rate controls step size. Too large: the optimizer overshoots the minimum and may diverge. Too small: convergence is very slow. A good learning rate is usually found by experimentation or learning rate schedules."},
      {q:"When is the Normal Equation preferred over gradient descent?",opts:["Always — it gives the exact optimal solution in one step","When the dataset has many samples and many features","When the number of features is small — matrix inversion is too slow for large feature sets","When the relationship between features and output is non-linear"],ans:2,exp:"The Normal Equation is exact and requires no iterations, but matrix inversion is O(d³) in features. For small d (hundreds of features), it's faster. For large d (thousands+), gradient descent is preferred."},
      {q:"A linear regression model has R² = 0.0 on test data. What does this mean?",opts:["The model is completely wrong — it predicts everything backwards","The model explains none of the variance in y — no better than predicting the mean every time","The model has a perfect fit to the training data","R² = 0 only occurs when all weights are zero"],ans:1,exp:"R² = 1 - SS_res / SS_tot. When R² = 0, SS_res = SS_tot — the model does no better than a horizontal line at the mean. When R² = 1, the model perfectly explains all variance. R² < 0 is possible if the model is worse than the mean."},
      {q:"You add a squared feature x² to your linear regression model. This is called:",opts:["Logistic regression — adding a squared term changes the model class","Polynomial features — extending linear regression to fit curves while remaining linear in parameters","Kernel regression — using the kernel trick to go non-linear","Support vector regression — the squared term creates a margin"],ans:1,exp:"Adding x² creates polynomial regression. Despite the curve, it's still 'linear regression' because the model is linear in its parameters (w0 + w1*x + w2*x² — the weights are linear). The risk: high-degree polynomials overfit aggressively."},
      {q:"What is gradient descent doing at each step?",opts:["Randomly searching the weight space for a lower cost","Moving weights in the direction that increases the cost function","Computing the exact optimal weight update using the Normal Equation","Moving weights in the direction opposite to the gradient — downhill toward lower cost"],ans:3,exp:"The gradient points in the direction of steepest increase in cost. By moving in the opposite direction (w = w - α * gradient), we move downhill — toward lower cost. We repeat this until the cost stops decreasing significantly."},
      {q:"Which scenario is linear regression poorly suited for?",opts:["Predicting house prices from square footage (positive linear relationship)","Predicting revenue as a function of advertising spend (roughly linear in log-log space)","Classifying emails as spam or not-spam (predicting a binary label)","Predicting temperature from humidity (weak linear relationship)"],ans:2,exp:"Linear regression outputs a continuous number (e.g., -1000 to +infinity). For binary classification (spam/not-spam), you need a model that outputs probabilities between 0 and 1 — that's logistic regression's job, not linear regression's."}

// ── 2: LOGISTIC REGRESSION ──────────────────
{
  id:'logistic-regression', label:'Logistic Regression', color:'#5E4A7A',
  content:{
    definition:"A supervised classification algorithm that predicts the probability of a binary outcome by applying the sigmoid function to a linear combination of features.",
    explanation:[
      {heading:"From Numbers to Probabilities", body:`Linear regression outputs any real number. For classification, you need outputs between 0 and 1 — probabilities. Logistic regression does this with one elegant addition: the sigmoid function.

Start with a linear combination (identical to linear regression):
  z = w1*x1 + w2*x2 + ... + b

Apply the sigmoid function:
  P(y=1 | x) = σ(z) = 1 / (1 + e^(-z))

The sigmoid "squashes" any real number into (0, 1):
  z → -∞  :  σ(z) → 0
  z = 0   :  σ(z) = 0.5
  z → +∞  :  σ(z) → 1

Interpretation: the model outputs the probability that the input belongs to the positive class.

To make a hard prediction: predict class 1 if P > 0.5, class 0 otherwise. (0.5 is the default threshold — you can and should tune this based on your use case.)`},
      {heading:"The Decision Boundary", body:`Logistic regression creates a linear decision boundary — the set of points where P(y=1 | x) = 0.5, which is where z = 0:

  w1*x1 + w2*x2 + b = 0

In 2D, this is a line. In 3D, a plane. In n dimensions, a hyperplane.

Points on one side of this boundary are classified as class 0; points on the other side as class 1. The further a point is from the boundary, the more confident the prediction.

Logistic regression can only create linear boundaries — it cannot separate classes that require a curved boundary. For that, you'd add polynomial features (w1*x1 + w2*x1^2...) or use a non-linear algorithm like Decision Trees or SVM with a kernel.`},
      {heading:"Training — Binary Cross-Entropy Loss", body:`You can't use MSE for logistic regression — it creates a non-convex loss surface with local minima. Instead, logistic regression uses Binary Cross-Entropy (log loss):

  L = -(1/n) * Σ [yi * log(p_i) + (1-yi) * log(1-p_i)]

where p_i = σ(z_i) is the predicted probability for sample i.

Intuition:
  - When yi=1 and p_i → 1: log(1) = 0. No loss.
  - When yi=1 and p_i → 0: log(0) → -∞. Catastrophic loss.
  - When yi=0 and p_i → 0: log(1) = 0. No loss.
  - When yi=0 and p_i → 1: log(0) → -∞. Catastrophic loss.

The loss heavily penalizes confident wrong predictions. This convex loss function means gradient descent will always converge to the global minimum.

Gradient descent update:
  w = w - α * (1/n) * X^T * (y_hat - y)
  b = b - α * (1/n) * Σ(y_hat_i - yi)

These gradients are elegant — the same form as linear regression, but y_hat = σ(Xw + b).`},
      {heading:"Multiclass Classification — One vs. Rest and Softmax", body:`Logistic regression is naturally binary. For K > 2 classes:

ONE-VS-REST (OVR):
  Train K separate binary classifiers, one per class.
  Classifier k learns P(y=k | x) vs P(y≠k | x).
  At prediction time, pick the class with the highest probability.
  Simple, but can lead to overlapping or uncalibrated probability estimates.

SOFTMAX REGRESSION (Multinomial Logistic Regression):
  Extends logistic regression natively to K classes.
  Computes a score z_k for each class k.
  Softmax converts scores to probabilities:

  P(y=k | x) = exp(z_k) / Σ_j exp(z_j)

  Properties:
    - All probabilities sum to 1.
    - The class with the highest z_k always gets the highest probability.
    - Probabilities are "calibrated" — they can be interpreted as true confidence.

Softmax + cross-entropy is the standard loss for multiclass classification.`},
      {heading:"Assumptions, Regularization, and Practical Tips", body:`ASSUMPTIONS:
  - Features and the log-odds of the output are linearly related.
  - Samples are independent.
  - No extreme multicollinearity — correlated features make weights unstable.

REGULARIZATION:
  L2 (Ridge): adds λ * Σwi² to the loss. Shrinks weights, reduces overfitting.
  L1 (Lasso): adds λ * Σ|wi| to the loss. Zeroes out irrelevant features.
  Controlled by parameter C (in scikit-learn): C = 1/λ. Smaller C = more regularization.

PRACTICAL TIPS:
  - Always scale features before logistic regression.
  - Check the confusion matrix, precision, recall, and F1 — not just accuracy.
  - If classes are imbalanced, adjust the threshold away from 0.5, or use class_weight='balanced'.
  - Logistic regression is fast, interpretable, and often surprisingly strong.
  - It's always worth trying as your first classification baseline.`}
    ],
    keyPoints:[
      {title:"Sigmoid Function",body:"σ(z) = 1 / (1 + e⁻ᶻ)\nSquashes any real number into (0,1). Outputs a probability between 0 and 1."},
      {title:"Decision Boundary",body:"The line (or hyperplane) where P=0.5. Points on each side are classified differently. Logistic regression boundaries are always linear."},
      {title:"Binary Cross-Entropy Loss",body:"L = -(1/n) Σ [y·log(p) + (1-y)·log(1-p)]\nHeavily penalizes confident wrong predictions. Convex — always converges."},
      {title:"Softmax for Multiclass",body:"P(y=k | x) = exp(zk) / Σ exp(zj)\nExtends logistic regression to K classes. Probabilities sum to 1."},
      {title:"Threshold Tuning",body:"Default threshold is 0.5. In practice, tune it:\nHigh recall needed (e.g. cancer): lower threshold.\nHigh precision needed (e.g. spam): raise threshold."},
      {title:"vs. Linear Regression",body:"Linear: continuous output, MSE loss.\nLogistic: probability output, cross-entropy loss.\nSame training algorithm (gradient descent), different output and loss."}
    ],
    watchOut:"Despite the name, logistic regression is a classification algorithm, not a regression one. Also: it assumes a linear decision boundary — if your classes can't be separated by a line, it will underfit regardless of how much data you throw at it. Check the confusion matrix, not just accuracy.",
    questions:[
      {q:"What does the sigmoid function do to the output of logistic regression?",opts:["Applies a threshold to convert probabilities to class labels","Squashes the linear output to a value between 0 and 1, interpretable as a probability","Normalizes the weights to prevent overfitting","Applies a non-linear transformation to individual input features"],ans:1,exp:"The sigmoid σ(z) = 1/(1+e⁻ᶻ) maps any real number to (0,1). This converts the raw linear score z into a probability P(y=1 | x). Values close to 1 mean high confidence in the positive class."},
      {q:"Why is Binary Cross-Entropy used instead of MSE for logistic regression?",opts:["MSE is harder to compute when outputs are probabilities","Cross-entropy is convex for logistic regression, ensuring gradient descent converges to the global minimum; MSE is not","Cross-entropy is faster to compute","MSE would give zero loss when predictions are exactly 0.5"],ans:1,exp:"MSE applied to logistic regression creates a non-convex loss surface with local minima where gradient descent can get stuck. Binary cross-entropy is convex for logistic regression — gradient descent always finds the global optimum."},
      {q:"A logistic regression model outputs P(spam)=0.73. Using a threshold of 0.5, what is the prediction?",opts:["Ham — the probability is not high enough","Spam — 0.73 > 0.5 threshold","Cannot predict — need to see the full distribution","Depends on the class imbalance in training data"],ans:1,exp:"With threshold 0.5: predict spam if P(spam) > 0.5. Since 0.73 > 0.5, the model predicts spam. The threshold can be adjusted based on the relative cost of false positives vs. false negatives."},
      {q:"What does the decision boundary look like in standard logistic regression?",opts:["A curved surface that adapts to the data distribution","A straight line (in 2D) or hyperplane — always linear","A non-linear boundary shaped by the sigmoid function","Multiple boundaries, one per training epoch"],ans:1,exp:"Logistic regression creates a linear decision boundary: the set of points where z = 0 (P = 0.5). In 2D that's a line; in nD that's a hyperplane. To get curved boundaries, you'd need polynomial features or a non-linear algorithm."},
      {q:"In logistic regression, what does a large positive weight for a feature indicate?",opts:["The feature is noisy and should be removed","That feature strongly increases the probability of the positive class when it increases","That feature strongly decreases the probability of the positive class when it increases","The feature was not regularized during training"],ans:1,exp:"A large positive w means increasing that feature increases z = w*x + b, which increases σ(z) — the probability of the positive class. A large negative weight means increasing that feature strongly pushes the prediction toward class 0."},
      {q:"Softmax regression extends logistic regression to K classes. What property do its output probabilities always have?",opts:["They are all equal to 1/K by default","They sum to 1, making them a proper probability distribution over classes","They are all between -1 and 1","Each probability equals the sigmoid of the class score"],ans:1,exp:"The softmax function P(y=k|x) = exp(zk) / Σ exp(zj) ensures all K class probabilities are positive and sum to 1 — a proper probability distribution. This makes them interpretable as confidence levels."},
      {q:"You're building a rare disease detector. Missing a sick patient (false negative) is far worse than a false alarm. How should you adjust the threshold?",opts:["Raise the threshold above 0.5 to be more conservative","Lower the threshold below 0.5 to catch more positive cases","Keep it at 0.5 — changing the threshold introduces bias","Remove the threshold entirely and always predict the positive class"],ans:1,exp:"Lowering the threshold (e.g. to 0.3) means the model predicts 'positive' more liberally — catching more true positives (higher recall) at the cost of more false positives (lower precision). For disease detection, missing a case is catastrophic, so high recall takes priority."},
      {q:"What does L2 regularization do to logistic regression weights?",opts:["Drives some weights to exactly zero, removing features","Shrinks all weights toward zero without making them exactly zero, reducing overfitting","Increases the learning rate to speed up convergence","Normalizes the weights so they sum to 1"],ans:1,exp:"L2 regularization adds λ * Σwi² to the loss. The gradient includes 2λwi, which continuously pushes weights toward (but not to) zero. This shrinks all weights and reduces overfitting without creating sparsity. L1 regularization, by contrast, drives some weights to exactly zero."}
    ]
  }
